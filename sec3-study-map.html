var GUIDES_AM={
"amath-0":{s:[
["Get the equation or expression into standard form","Why: every method (factorise, formula, discriminant, inequality sign test) needs ax² + bx + c with one side equal to 0. How: expand brackets, move all terms to one side, and tidy. Example: x(x + 4) = 21 becomes x² + 4x − 21 = 0."],
["For a maximum or minimum, complete the square","Why: (x + p)² is never negative, so the extreme value is the constant left over. How: take out a, add and subtract (half of b)² inside the bracket. 3x² − 12x + 5 = 3(x − 2)² − 7, so the minimum is −7 at x = 2. Remember to multiply the subtracted square by the factor you took out."],
["Choose a solving method","Factorise first if the numbers look friendly. Use the formula x = [−b ± √(b² − 4ac)]/2a when the roots are not whole, or the question asks for surds or decimals. Always check by substituting back."],
["Use the discriminant for the number of roots","Why: it is the part of the formula under the square root. Greater than 0 gives two roots, equal to 0 gives one repeated root (a tangent), less than 0 gives none. ‘Real roots’ means b² − 4ac ≥ 0."],
["Line and curve: substitute the linear into the other","Why: this removes one variable and leaves a quadratic. Solve, then find the other coordinate from the linear equation. For tangent questions, set b² − 4ac = 0 on that quadratic."],
["Inequalities: critical values, sketch, read the region","Why: the expression only changes sign at its roots. Factorise, sketch the parabola, and read where it is above (> 0) or below (< 0) the axis. Outside the roots for > 0 with a > 0; between the roots for < 0."]],
t:[["Completing the square and range","State the turning point, the max or min value, and the range f(x) ≥ q or f(x) ≤ q."],["Find the range of k for real, equal or no roots","Write the discriminant in k and solve the inequality."],["Tangent or intersection of a line and a curve","Substitute and use the discriminant."],["Solve a quadratic inequality","Show the factorised form, the critical values and the final range."],["Show that an expression is always positive","Complete the square, or use a > 0 and b² − 4ac < 0."]]},
"amath-1":{s:[
["Simplify surds first","Why: like surds can only be combined once simplified. How: pull out the largest square factor. √72 = 6√2. Never write √(a + b) = √a + √b."],
["Rationalise with the conjugate","Why: (a + √b)(a − √b) = a² − b has no surd. How: multiply top and bottom by the conjugate. 1/(3 + √2) = (3 − √2)/7."],
["Equate rational and surd parts for unknowns","If a + b√2 = 5 + 3√2 with a and b rational, then a = 5 and b = 3. Expand and collect first."],
["Make the bases the same to solve exponential equations","Why: if aᵐ = aⁿ then m = n. How: write 4 = 2² and 8 = 2³ so 4ˣ = 8^(x − 1) becomes 2x = 3x − 3."],
["Use log laws to combine or split","log(xy) = log x + log y; log(x/y) = log x − log y; log xⁿ = n log x; log_a b = log_c b / log_c a. Remember log_a a = 1 and log_a 1 = 0."],
["Solve equations and always check log answers","For aˣ = b take logs: x = lg b / lg a. For log equations combine into one log, convert to a power, solve, and reject any answer that makes a log argument zero or negative."]],
t:[["Simplify or rationalise a surd expression","Show every step; leave the answer in exact form."],["Find unknowns given surd equality","Equate rational and surd parts."],["Evaluate or simplify using log laws","Combine into one log, or express in terms of p and q."],["Solve exponential equations with logs","Take logs of both sides and give the answer to the stated d.p."],["Solve log equations","Convert to powers and check for rejected answers."]]},
"amath-2":{s:[
["Write polynomials in descending order","Put zero coefficients in for missing powers before dividing: x³ + 2 = x³ + 0x² + 0x + 2."],
["Use the remainder theorem for a quick remainder","Why: f(x) = (x − a)Q(x) + R, so f(a) = R. For (2x − 1) use x = 1/2."],
["Use the factor theorem to find factors","If f(a) = 0 then (x − a) is a factor. Try ±1, ±2, ±3 and so on, divisors of the constant term."],
["Factorise a cubic fully","Find one root, divide (long or synthetic division) to get a quadratic, then factorise it. List all the roots."],
["For unknown coefficients form simultaneous equations","Each fact (factor, or given remainder) gives an equation from f(a) = value. Solve the equations together."],
["Partial fractions: right form, clear denominators, find constants","Improper fraction? Divide first. Then use A/(x − a) for each distinct factor, A/(x − a) + B/(x − a)² for a repeated factor, and (Ax + B)/(x² + k) for an irreducible quadratic. Multiply out and substitute roots or compare coefficients."]],
t:[["Division with quotient and remainder","Show the layout and check with f(a)."],["Solve a cubic equation","Use the factor theorem, then solve the quadratic."],["Find a and b from factor and remainder facts","Form two equations and solve."],["Express in partial fractions","Pick the correct form; check by substituting a value."]]},
"amath-3":{s:[
["Know where the coefficients come from","Why: in (a + b)ⁿ, each term aⁿ⁻ʳbʳ comes from choosing b from r of the n brackets, and there are ⁿCᵣ ways to choose. For small n, read them from Pascal’s triangle."],
["Write the general term","T(r + 1) = ⁿCᵣ aⁿ⁻ʳ bʳ. Put the whole of a and b in brackets, including numbers and signs."],
["To expand, list the terms in order","The powers of a go down from n to 0 and the powers of b go up from 0 to n. There are n + 1 terms. Use brackets so (−3x)² = 9x²."],
["To find a particular term, solve for r","Simplify the power of x in the general term, set it equal to the required power, solve for r, then substitute r to get the coefficient."],
["For a term independent of x, make the power of x zero","Use the index laws to collect the power of x as a single expression in r, set it to 0 and solve."],
["For products of two expansions, combine all pairs","List every pair of terms from the two expansions whose powers of x add to the required power, multiply and add the coefficients."]],
t:[["Expand with the first few terms only","Show ⁿCᵣ values and brackets."],["Find a coefficient or the constant term","Use the general term."],["Find n or k from given coefficients","Form equations and divide."],["Use the expansion to approximate","Take x small and use the first 3 or 4 terms."]]},
"amath-4":{s:[
["Know the shapes and key points","y = aˣ passes through (0, 1) with asymptote y = 0. y = log_a x passes through (1, 0) with asymptote x = 0. They are reflections in y = x because log is the inverse of the power."],
["Sketch with transformations","y = aˣ + k shifts up by k (asymptote y = k). y = a^(x + h) shifts left. Always mark the intercepts and draw the asymptote as a dashed line."],
["Spot a hidden quadratic","If 2²ˣ and 2ˣ both appear, let u = 2ˣ. Solve the quadratic in u, reject negative u (2ˣ is always positive), then solve 2ˣ = u."],
["Use logs when x is in the index","aˣ = b gives x = lg b / lg a (or ln b / ln a). Keep the full calculator value before rounding."],
["Solve log equations carefully","Combine with the laws, rewrite as a power, solve, and substitute back to reject any invalid answer."],

var CONCEPTS_AM=["Quadratics are the first curved functions you study in depth. This chapter shows how to find the highest or lowest point by completing the square, solve equations, decide if a line meets a curve, and solve inequalities with a sketch.","Surds keep roots exact, indices describe repeated multiplication, and logarithms are the reverse of powers. Together they let you simplify tricky numbers and solve equations where the unknown is in the power.","Polynomials are sums of powers of x. The remainder and factor theorems let you factorise cubics, and partial fractions break a big fraction into simple ones.","The binomial theorem expands expressions like (a + b)ⁿ without multiplying them out, and lets you pick out a single term or coefficient.","Exponential graphs show growth and decay, and logarithmic graphs are their mirror images. You learn to sketch them, solve equations, and model real situations.","Trigonometry for any angle uses the unit circle and quadrants. You learn radians, exact values, the shapes of the graphs, identities, and how to solve equations.","Coordinate geometry puts shapes on a grid so that lengths, midpoints, gradients, lines and circles can all be handled with algebra.","Geometry proofs ask you to justify every step with a reason. You use congruent and similar triangles, the midpoint theorem and the tangent-chord theorem."];

var CONCEPTS={
emath:["An equation where the highest power of x is 2, like x²+2x−15=0. It usually has two answers, found by factorising, the formula, or completing the square.","Equations with x in the denominator, like 2/x = x−1. You clear the fractions by multiplying through, or read the answers from where two graphs cross.","y=ax²+bx+c draws a U-shaped curve called a parabola. If a is positive it opens upward (has a minimum); if negative it opens downward (has a maximum). The roots are where it crosses the x-axis.","Like an equation but with <, >, ≤ or ≥, so the answer is a range of values (such as x>5) instead of one number.","Powers like 2⁵ mean 2×2×2×2×2. Index laws let you multiply, divide and simplify powers, including zero, negative and fractional powers.","Interest earned on your money and on the interest already added. A=P(1+r/100)ⁿ after n years, so it grows faster than simple interest.","A way to write very large or very small numbers as A×10ⁿ where 1≤A<10, e.g. 3 500 000 = 3.5×10⁶.","Using x and y coordinates to find how steep a line is (gradient=(y₂−y₁)÷(x₂−x₁)), how long it is, and its equation y=mx+c.","A function gives exactly one output for every input, written f(x). You plot its graph and read off values such as intercepts and turning points.","Congruent shapes are identical in size and shape. Similar shapes have the same shape but different size, with matching sides in the same ratio.","Extends sin and cos to angles between 90° and 180° (sin θ = sin(180°−θ)), so you can find the area of any triangle using ½ab sin C.","Formulas for finding sides and angles in any triangle, not only right-angled ones. Use the sine rule with a matching side-angle pair, and the cosine rule when you know two sides and the angle between them.","Using sin, cos and tan on real situations: bearings (angles measured clockwise from north), angles of elevation and depression, and 3D shapes.","A sector is a slice of a circle. Arc length = θ/360 × 2πr and sector area = θ/360 × πr². Radians measure angles using arc length: 180° = π rad.","Rules about angles and lines in circles, e.g. the angle at the centre is twice the angle at the circumference, and a tangent meets the radius at 90°."],
amath:["Square roots that do not come out as whole numbers or fractions, like √2 or √3. They are exact values, so answers are kept as 3√2 rather than 4.243.","Functions of the form f(x)=ax²+bx+c. Their graph is a parabola; you find the turning point, where it crosses the axes, and how it meets a line.","Use the discriminant b²−4ac to tell how many real roots there are: above 0 gives two different roots, equal to 0 gives one repeated root, below 0 gives none.","Finding values that satisfy two equations at once. With one linear and one non-linear equation, substitute the linear one into the other to get a quadratic.","Inequalities like x²−5x+6<0. Find the roots, sketch the parabola, and read off which x-values put the curve above or below the axis.","Expressions with several powers of x, like x³−2x²+5. You divide them, and use the remainder and factor theorems to find factors and unknown constants.","Splitting one complicated fraction into simpler ones that add up to it, e.g. 5/((x−1)(x+2)) = A/(x−1) + B/(x+2).","A shortcut for expanding (a+b)ⁿ without multiplying brackets by hand. The coefficients come from Pascal's triangle.","In an exponential, the unknown is in the power (like 2ˣ). A logarithm is the reverse: log₂8=3 means 2³=8. Logs let you solve for unknown powers.","Like E Math but deeper: equations of lines and circles, parallel and perpendicular gradients, and areas of shapes from coordinates.","Turning a curved relationship into a straight line by changing variables, so you can find unknown constants from the gradient and y-intercept.","Sin, cos and tan for any angle, their graphs, and identities like sin²θ+cos²θ=1 that let you simplify expressions and solve trig equations.","Finding how fast something is changing, i.e. the gradient of a curve at any point. For y=xⁿ, dy/dx = nxⁿ⁻¹."],
phy:["Measuring quantities with the right units and instruments (ruler, vernier calipers, micrometer), and understanding accuracy versus precision.","Describing motion: distance, speed, velocity and acceleration, and reading them from distance-time and speed-time graphs.","Why things move. A resultant force makes an object accelerate: F=ma. Includes Newton's laws, friction, and balanced versus unbalanced forces.","Mass is how much matter there is (kg). Weight is gravity pulling on it (W=mg, in N). Density = mass ÷ volume, how tightly packed the matter is.","A force can turn things around a pivot. Moment = force × perpendicular distance from the pivot. Something is balanced when clockwise moments equal anticlockwise moments.","Force spread over an area: p=F/A. Smaller area means higher pressure. Pressure in a liquid increases with depth (p=ρgh).","Energy is the ability to do work (measured in joules). Work = force × distance moved, power = work ÷ time, and energy is never lost, only changed from one form to another.","All matter is made of tiny moving particles. Solids, liquids and gases differ in how the particles are arranged and move, which explains gas pressure and temperature.","Heat travels by conduction (through solids), convection (in liquids and gases) and radiation (as waves, with no medium needed).","Waves carry energy without carrying matter along. They are described by wavelength, frequency, amplitude and speed (v=fλ).","Light travels in straight lines. It reflects off surfaces and bends (refracts) when it enters a different material, which is how lenses work.","Sound is a wave of vibrating particles. Pitch depends on frequency and loudness on amplitude. It needs a medium to travel through.","The flow of electric charge. Current (A), voltage (V) and resistance (Ω) are linked by V=IR. Components can be joined in series or in parallel.","Magnets attract iron. A wire carrying current also makes a magnetic field, which is how electromagnets and motors work."],
chem:["Safe lab skills: apparatus, separating mixtures (filtration, distillation, chromatography), and testing purity.","All matter is made of tiny moving particles. Their arrangement and energy explain solids, liquids, gases, diffusion and changes of state.","Atoms have protons and neutrons in the nucleus and electrons around it. The proton number decides which element it is.","How atoms join: ionic (electrons transferred, usually metal and non-metal), covalent (electrons shared), and metallic.","How bonding and structure explain melting point, conductivity and hardness of ionic, simple molecular, giant covalent and metallic substances.","A formula shows what a substance is made of (H₂O). An equation shows a reaction and must be balanced so the number of each atom is the same on both sides.","The mole is a counting unit for tiny particles (6.02×10²³), like a dozen but much bigger. It lets you convert between mass, gas volume and number of particles in an equation.","Acids release H⁺ ions and alkalis release OH⁻ ions. pH measures how acidic or alkaline something is. An acid and a base react to give a salt and water.","Ionic compounds formed when an acid reacts with a base, metal or carbonate. Includes solubility rules and how to prepare a salt.","Identifying unknown ions and gases using chemical tests, e.g. the colour of the precipitate formed with sodium hydroxide.","Elements are arranged by proton number. Groups (columns) have similar properties and periods (rows) show trends.","Properties of metals, the reactivity series, extraction and rusting. A more reactive metal displaces a less reactive one.","What air is made of (about 78% nitrogen, 21% oxygen), air pollutants, and the greenhouse effect.","Energy changes in reactions (exothermic gives out heat, endothermic takes it in) and how fast reactions go (temperature, concentration, surface area, catalyst).","The chemistry of carbon compounds: alkanes, alkenes, alcohols and acids, their reactions, and polymers."]
