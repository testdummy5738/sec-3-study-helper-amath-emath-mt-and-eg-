obj:["Find trigonometric ratios of angles of any size using the ASTC rule and reference angles.","Convert between degrees and radians and use the exact values for 30°, 45° and 60°.","Sketch and read the graphs of sin, cos and tan, and state amplitude and period.","Use the fundamental identities to simplify expressions and prove identities.","Solve trigonometric equations in a given interval."],
terms:[["Reference angle","The acute angle between the terminal side of an angle and the x-axis."],["Radian","An angle whose arc has length equal to the radius. π radians = 180°."],["Amplitude","Half the distance between the maximum and minimum values of a wave."],["Period","The length of one complete cycle of a graph."],["Identity","An equation that is true for every value of the variable."],["Reciprocal functions","sec θ = 1/cos θ, cosec θ = 1/sin θ, cot θ = 1/tan θ."]],
body:[
["h","1. Angles of any magnitude"],
["p","SOH CAH TOA only works for angles inside right-angled triangles, between 0° and 90°. To extend sine, cosine and tangent to any angle, draw the angle on a coordinate grid, measured anticlockwise from the positive x-axis. A point P(x, y) on a circle of radius r gives sin θ = y/r, cos θ = x/r and tan θ = y/x. These are positive or negative depending on the signs of x and y, which depend on the **quadrant**."],
["svg","astc"],
["p","The memory aid **ASTC** (All, Sine, Tan, Cos) tells you which ratios are positive in each quadrant, going anticlockwise from the first. In quadrant 1 all are positive, in quadrant 2 only sine, in quadrant 3 only tangent, and in quadrant 4 only cosine."],
["p","**How to find a ratio of any angle.** (1) Find the quadrant. (2) Find the acute **reference angle** to the x-axis. (3) Use the ratio of the reference angle, with the sign for that quadrant. For sin 210°: it is in quadrant 3, the reference angle is 30°, sine is negative there, so sin 210° = −sin 30° = −1/2."],
["h","2. Radians"],
["p","One **radian** is the angle at the centre of a circle subtended by an arc equal in length to the radius. The full circle has circumference 2πr, so a full turn is 2π radians."],
["f","π radians = 180°\nradians = degrees × π/180     degrees = radians × 180/π"],
["tbl",[["Degrees","0°","30°","45°","60°","90°","180°","360°"],["Radians","0","π/6","π/4","π/3","π/2","π","2π"]]],
["h","3. Exact values"],
["tbl",[["θ","30°","45°","60°"],["sin θ","1/2","√2/2","√3/2"],["cos θ","√3/2","√2/2","1/2"],["tan θ","1/√3 (= √3/3)","1","√3"]]],
["p","These come from two triangles: a right-angled isosceles triangle with sides 1, 1, √2 (for 45°) and half of an equilateral triangle with sides 1, 2, √3 (for 30° and 60°). Learn the table, or learn to rebuild the triangles quickly."],
["h","4. Graphs of sin, cos and tan"],
["svg","sincos"],
["p","The graphs of y = sin x and y = cos x are waves that repeat every 360° (2π). They oscillate between −1 and 1, so the amplitude is 1. The cosine graph is the sine graph shifted 90° to the left. The graph of y = tan x repeats every 180°, has no maximum or minimum, and has vertical asymptotes at 90°, 270° and so on."],
["f","y = a sin(bx) + c:  amplitude |a|,  period 360°/b (or 2π/b),  midline y = c\nmaximum = c + |a|,  minimum = c − |a|"],
["h","5. Fundamental identities"],
["f","sin²θ + cos²θ = 1\ntan θ = sin θ/cos θ\n1 + tan²θ = sec²θ\n1 + cot²θ = cosec²θ"],
["p","The first comes straight from Pythagoras on the unit circle: x² + y² = 1 with x = cos θ and y = sin θ. Dividing it by cos²θ gives the second, and dividing it by sin²θ gives the third. These are true for every θ, so we can use them to switch between functions."],
["p","**How to prove an identity.** Work on one side (usually the more complicated one) and change it step by step until it matches the other side. Useful moves: write tan as sin/cos, put everything over a common denominator, replace sin² by 1 − cos² or the reverse, and factorise. Never move terms across the equals sign, because that assumes what you are trying to prove."],
["h","6. Solving trigonometric equations"],
["ol",["Get the equation into the form sin (something) = k, cos (something) = k or tan (something) = k. Use an identity first if two different functions appear.","Find the **principal value** using the calculator (the reference angle comes from the positive value of k).","Use the ASTC diagram to find all the angles in the interval.","If the angle is multiplied, such as 2x, solve for 2x over the longer interval (0° to 720°), then divide by 2."]],
["tip","Check the calculator mode (degrees or radians) before you start. Many lost marks come from the wrong mode."]
],
ex:[
["Angles of any size","Find the exact value of sin 210° and cos 300°.",["210° is in quadrant 3 and the reference angle is 30°. Sine is negative there: sin 210° = −sin 30° = −1/2.","300° is in quadrant 4 and the reference angle is 60°. Cosine is positive there: cos 300° = cos 60° = 1/2."],"−1/2 and 1/2"],
["Radians","Convert 150° to radians and 3π/4 to degrees.",["150° × π/180 = 5π/6.","3π/4 × 180/π = 135°."],"5π/6; 135°"],
["Amplitude and period","For y = 3 sin 2x + 1, state the amplitude, the period, and the maximum and minimum values.",["Amplitude = 3.","Period = 360° ÷ 2 = 180°.","Maximum = 1 + 3 = 4; minimum = 1 − 3 = −2."],"Amplitude 3; period 180°; max 4; min −2"],
["Prove an identity","Prove that tan²x − sin²x ≡ tan²x sin²x.",["LHS = sin²x/cos²x − sin²x.","Take out sin²x: sin²x(1/cos²x − 1) = sin²x(1 − cos²x)/cos²x.","1 − cos²x = sin²x, so LHS = sin²x · sin²x/cos²x.","= sin²x · tan²x = RHS."],"Proved"],
["A basic equation","Solve 2 cos x = 1 for 0° ≤ x ≤ 360°.",["cos x = 1/2. The principal value is 60°.","Cosine is positive in quadrants 1 and 4: x = 60° or x = 360° − 60° = 300°."],"x = 60° or 300°"],
["Using an identity","Solve 2 sin²x + cos x − 1 = 0 for 0° ≤ x ≤ 360°.",["Replace sin²x by 1 − cos²x: 2(1 − cos²x) + cos x − 1 = 0.","1 + cos x − 2cos²x = 0, so 2cos²x − cos x − 1 = 0.","(2 cos x + 1)(cos x − 1) = 0, so cos x = −1/2 or cos x = 1.","cos x = −1/2: reference angle 60°, quadrants 2 and 3, x = 120° or 240°.","cos x = 1: x = 0° or 360°."],"x = 0°, 120°, 240°, 360°"],
["A multiple angle","Solve sin 2x = 0.5 for 0° ≤ x ≤ 360°.",["Let u = 2x, so 0° ≤ u ≤ 720°. sin u = 0.5, principal value 30°.","Sine is positive in quadrants 1 and 2: u = 30°, 150°, then add 360°: 390°, 510°.","x = u/2 = 15°, 75°, 195°, 255°."],"x = 15°, 75°, 195°, 255°"]
],
mis:["Calculator in the wrong mode (degrees versus radians).","Forgetting the second solution from the ASTC diagram.","Not extending the interval when the angle is multiplied, such as 2x or 3x.","Writing sin²x as sin x². The notation sin²x means (sin x)².","Dividing both sides of an equation by sin x or cos x, which can lose solutions. Factorise instead.","Proving an identity by moving terms across the equals sign.","Using degrees formulas in radians questions, such as arc length with degrees."],
qs:[["Find the exact value of tan 135°.","Quadrant 2, reference angle 45°, tangent is negative: tan 135° = −1."],["Convert π/6 radians to degrees.","30°."],["Solve tan x = 1 for 0° ≤ x ≤ 360°.","x = 45° or 225° (tangent is positive in quadrants 1 and 3)."],["Simplify (1 − cos²x)/sin x.","sin²x/sin x = sin x."]],
sum:["ASTC tells which ratios are positive in each quadrant; use the reference angle to find the size.","π rad = 180°. Learn the exact values for 30°, 45°, 60°.","y = a sin(bx) + c has amplitude |a|, period 360°/b, midline y = c.","Key identities: sin²θ + cos²θ = 1, tan θ = sin θ/cos θ, 1 + tan²θ = sec²θ.","To solve an equation: reduce to one function, find the principal value, use ASTC, and widen the interval for multiple angles."]
},
"amath-6":{
obj:["Find the gradient, length and midpoint of a line segment, and the equation of a straight line.","Use gradients to decide whether lines are parallel or perpendicular, and find perpendicular bisectors.","Find the area of a polygon from the coordinates of its vertices.","Find the equation of a circle and the centre and radius from an equation.","Use the discriminant to find tangents to circles, and reduce curves to straight-line form (linear law)."],
terms:[["Gradient","The steepness of a line: change in y divided by change in x."],["Midpoint","The point halfway between two points."],["Perpendicular bisector","The line that cuts a segment in half at a right angle."],["Locus","The set of all points that satisfy a condition."],["Tangent","A line touching a circle at one point; it is perpendicular to the radius there."],["Linear law","Rewriting a non-linear relationship so that it plots as a straight line."]],
body:[
["h","1. Gradient, distance and midpoint"],
["p","Coordinate geometry turns geometry problems into algebra. For two points (x₁, y₁) and (x₂, y₂), the three basic quantities all come from the differences in x and y: the vertical change and the horizontal change."],
["f","gradient m = (y₂ − y₁) ÷ (x₂ − x₁)\ndistance = √[(x₂ − x₁)² + (y₂ − y₁)²]\nmidpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2)"],
["p","The distance formula is just Pythagoras’ theorem applied to the horizontal and vertical changes. The midpoint is the average of the x-coordinates and the average of the y-coordinates."],
["h","2. Equation of a straight line"],
["p","A line is fixed by its gradient m and one point on it. Use whichever form fits the information you have."],
["f","y = mx + c        (gradient m, y-intercept c)\ny − y₁ = m(x − x₁)   (gradient m, passes through (x₁, y₁))\nax + by + c = 0       (general form)"],
["h","3. Parallel and perpendicular lines"],
["p","**Parallel** lines have the same gradient, m₁ = m₂. **Perpendicular** lines have gradients whose product is −1, so m₁ × m₂ = −1. To see why, rotate a line with gradient m (run 1, rise m) by 90°: the run and rise swap and one changes sign, giving gradient −1/m."],
["f","parallel: m₁ = m₂        perpendicular: m₁ m₂ = −1"],
["p","The **perpendicular bisector** of a segment AB passes through the midpoint of AB and has gradient −1/(gradient of AB). Every point on it is the same distance from A and B."],
["svg","coord"],
["h","4. Area of a polygon"],
["p","For a polygon with vertices listed in order (anticlockwise or clockwise) as (x₁, y₁), (x₂, y₂), …, (xₙ, yₙ), write the coordinates in a column, repeat the first at the bottom, then multiply diagonally."],
["f","Area = ½ | (x₁y₂ + x₂y₃ + … + xₙy₁) − (y₁x₂ + y₂x₃ + … + yₙx₁) |"],
["h","5. The circle"],
["p","A **circle** is the set of points at a fixed distance r (the radius) from a fixed point (the centre). Using the distance formula, a point (x, y) is on the circle with centre (a, b) when (x − a)² + (y − b)² = r²."],
["f","(x − a)² + (y − b)² = r²      centre (a, b), radius r\nx² + y² + 2gx + 2fy + c = 0   centre (−g, −f), radius √(g² + f² − c)"],
["p","To find the centre and radius from a general equation, complete the square in x and in y."],
["h","6. Tangents to a circle"],
["p","A tangent touches the circle at exactly one point and is perpendicular to the radius at that point. Two methods find a tangent. **Method 1 (discriminant):** substitute the line into the circle to get a quadratic, then set b² − 4ac = 0. **Method 2 (gradient):** find the gradient of the radius to the point of contact, then use the perpendicular gradient."],
["h","7. Linear law"],
["p","Experimental data often follow a curve such as y = pqˣ or y = axⁿ, which are hard to read. If you can rewrite the relationship in the form Y = mX + c, where X and Y are functions of x and y, then plotting Y against X gives a straight line. The gradient and intercept then give the unknown constants."],
["tbl",[["Relationship","Take logs or rearrange","Plot","Gradient","Intercept"],["y = pqˣ","lg y = x lg q + lg p","lg y against x","lg q","lg p"],["y = axⁿ","lg y = n lg x + lg a","lg y against lg x","n","lg a"],["y = ax² + b","","y against x²","a","b"]]]
],
ex:[
["Gradient, length, midpoint","A is (1, 2) and B is (7, 10). Find the gradient of AB, the length of AB and the midpoint M.",["Gradient = (10 − 2)/(7 − 1) = 8/6 = 4/3.","Length = √(6² + 8²) = √100 = 10.","M = ((1 + 7)/2, (2 + 10)/2) = (4, 6)."],"Gradient 4/3; length 10; M(4, 6)"],
["Equation of a line","Find the equation of the line through (2, 3) with gradient −1/2.",["y − 3 = −1/2(x − 2).","y = −x/2 + 1 + 3 = −x/2 + 4.","Multiply by 2: 2y = −x + 8, so x + 2y = 8."],"x + 2y = 8"],
["Perpendicular bisector","Find the equation of the perpendicular bisector of AB, where A is (1, 2) and B is (7, 10).",["The midpoint is M(4, 6). The gradient of AB is 4/3.","The perpendicular gradient is −3/4.","y − 6 = −3/4(x − 4), so 4y − 24 = −3x + 12.","3x + 4y = 36."],"3x + 4y = 36"],
["Area of a triangle","Find the area of the triangle with vertices (0, 0), (6, 0) and (2, 5).",["Write the coordinates and repeat the first: (0, 0), (6, 0), (2, 5), (0, 0).","Down-right products: 0×0 + 6×5 + 2×0 = 30.","Down-left products: 0×6 + 0×2 + 5×0 = 0.","Area = ½ |30 − 0| = 15."],"15 square units"],
["Centre and radius","Find the centre and radius of x² + y² − 6x + 4y − 12 = 0.",["Complete the square: (x − 3)² − 9 + (y + 2)² − 4 − 12 = 0.","(x − 3)² + (y + 2)² = 25.","Centre (3, −2), radius 5."],"Centre (3, −2), radius 5"],
["Tangent to a circle","Find the values of k for which the line y = x + k is a tangent to the circle x² + y² = 8.",["Substitute: x² + (x + k)² = 8, so 2x² + 2kx + k² − 8 = 0.","Tangent: b² − 4ac = 4k² − 8(k² − 8) = 0.","−4k² + 64 = 0, so k² = 16 and k = ±4.","Check: distance from the origin to y = x + 4 is 4/√2 = 2√2 = radius. ✓"],"k = 4 or k = −4"],
["Linear law","Variables x and y are related by y = pqˣ. A graph of lg y against x is a straight line through (0, 0.3) and (2, 1.1). Find p and q.",["Take logs: lg y = x lg q + lg p. This is Y = mX + c.","Gradient = (1.1 − 0.3)/(2 − 0) = 0.4 = lg q, so q = 10^0.4 = 2.51.","Intercept 0.3 = lg p, so p = 10^0.3 = 2.0."],"p ≈ 2.0, q ≈ 2.5"]
],
mis:["Subtracting coordinates in different orders on top and bottom of the gradient formula.","Using m₁m₂ = 1 instead of −1 for perpendicular lines, or forgetting to flip and negate the gradient.","Writing the circle as (x − a)² + (y − b)² = r instead of r².","Reading the centre of (x + 3)² + (y − 2)² = 25 as (3, −2). It is (−3, 2).","Taking the radius as the right-hand side without square-rooting.","Using the area formula with the vertices in the wrong order, which gives the wrong area.","In linear law, forgetting that the intercept and gradient are logs and must be converted back."],
qs:[["Find the gradient of the line through (−1, 3) and (4, 13).","(13 − 3)/(4 + 1) = 2."],["A line has gradient 2/3. What is the gradient of a line perpendicular to it?","−3/2."],["State the centre and radius of (x − 1)² + (y + 4)² = 36.","Centre (1, −4), radius 6."],["Find the midpoint of (−2, 5) and (6, 1).","(2, 3)."],["Does the point (3, 4) lie on the circle x² + y² = 25?","9 + 16 = 25, so yes."]],
sum:["m = Δy/Δx; length = √(Δx² + Δy²); midpoint is the average of the coordinates.","Parallel: same gradient. Perpendicular: product of gradients is −1.","Circle: (x − a)² + (y − b)² = r²; complete the square to find centre and radius.","Tangent: discriminant = 0, or use the perpendicular to the radius.","Linear law: rearrange into Y = mX + c and read off the constants."]
},
"amath-7":{
obj:["State and use the tests for congruent triangles and similar triangles.","State and prove the midpoint theorem and its converse.","State the tangent-chord (alternate segment) theorem and use it in calculations and proofs.","Write a clear geometric proof with a reason for every step."],
terms:[["Congruent","Identical in shape and size. All matching sides and angles are equal."],["Similar","Same shape, but possibly different size. Matching angles are equal and matching sides are in the same ratio."],["Midpoint theorem","The line joining the midpoints of two sides of a triangle is parallel to the third side and half as long."],["Tangent-chord theorem","The angle between a tangent and a chord equals the angle in the alternate segment."],["Alternate segment","The segment of the circle on the other side of the chord from the angle."],["Proof","A logical chain of statements, each justified, that starts from what is given and ends at what you must show."]],
body:[
["h","1. What makes a proof?"],
["p","In a **proof**, each statement must follow from something you were told (the ‘given’) or from a result already known. Examination proofs are marked line by line, so every line has a statement and a reason. Start by redrawing the diagram, marking everything you know with equal signs and equal angle marks. Then ask what you need to show, and work towards it."],
["ul",["**Given:** what the question tells you.","**To prove:** what you must show.","**Proof:** numbered statements, each with a reason in brackets such as (alt. angles, AB ∥ CD), (angles in the same segment), (common side)."]],
["h","2. Congruent triangles"],
["p","Two triangles are **congruent** if one can be moved on top of the other. You do not need to check all six measurements. These four tests are enough."],
["tbl",[["Test","Meaning"],["SSS","Three pairs of equal sides"],["SAS","Two pairs of equal sides and the **included** angle equal"],["ASA or AAS","Two pairs of equal angles and one pair of equal sides"],["RHS","A right angle, equal hypotenuses, and one other pair of equal sides"]]],
["warn","SSA (two sides and a non-included angle) does not prove congruence, because it can fit two different triangles."],
["p","When triangles are congruent, all their matching parts are equal (corresponding parts of congruent triangles). That is how congruence proves that two lengths or angles are equal."],
["h","3. Similar triangles"],
["tbl",[["Test","Meaning"],["AA (or AAA)","Two pairs of equal angles (the third pair then must be equal)"],["SSS ratio","All three pairs of sides in the same ratio"],["SAS ratio","Two pairs of sides in the same ratio and the included angles equal"]]],
["p","If two triangles are similar with scale factor k (lengths in ratio 1 : k), then the ratio of areas is 1 : k², and the ratio of volumes of similar solids is 1 : k³. Write the similar triangles with their vertices in matching order (for example ΔADE ~ ΔABC), so the correct sides pair up."],
["h","4. The midpoint theorem"],
["f","In ΔABC, if D is the midpoint of AB and E is the midpoint of AC, then DE ∥ BC and DE = ½ BC."],
["p","**Proof.** In ΔADE and ΔABC: AD/AB = 1/2 and AE/AC = 1/2 (D and E are midpoints), and ∠A is common. So ΔADE ~ ΔABC by the SAS ratio test. Hence ∠ADE = ∠ABC, and these are corresponding angles, so DE ∥ BC. Also DE/BC = AD/AB = 1/2, so DE = ½ BC. ∎"],
["p","The **converse** is also true: if a line through the midpoint of one side of a triangle is parallel to a second side, it passes through the midpoint of the third side."],
["h","5. Circle facts you need as tools"],
["ul",["The tangent to a circle is perpendicular to the radius at the point of contact.","The angle in a semicircle is 90°.","Angles in the same segment (subtended by the same chord) are equal.","The angle at the centre is twice the angle at the circumference on the same arc.","Opposite angles of a cyclic quadrilateral add up to 180°.","Two tangents drawn from an external point are equal in length."]],
["h","6. The tangent-chord (alternate segment) theorem"],
["f","The angle between a tangent and a chord at the point of contact equals the angle in the alternate segment."],
["svg","tangent"],
["p","In the diagram, TA is a tangent at A and AB is a chord. The angle TAB = x is equal to the angle ACB in the segment on the other side of the chord from the angle."],
["p","**Why it is true (proof).** Draw the diameter AD and join BD. Let ∠TAB = x. Because the tangent is perpendicular to the radius, ∠TAD = 90°, so ∠BAD = 90° − x. The angle in a semicircle is 90°, so ∠ABD = 90°. In ΔABD, ∠ADB = 180° − 90° − (90° − x) = x. Angles in the same segment are equal, so ∠ACB = ∠ADB = x. So ∠ACB = ∠TAB. ∎"],
["tip","In a proof, always state the name of the theorem as the reason, for example (tangent-chord theorem / angle in alternate segment). Avoid vague reasons such as ‘circle rules’."]
],
ex:[
["Congruent triangles","ABCD is a parallelogram. Prove that ΔABC is congruent to ΔCDA.",["AB = CD (opposite sides of a parallelogram are equal).","BC = DA (opposite sides of a parallelogram are equal).","AC = CA (common side).","So ΔABC ≅ ΔCDA by SSS. ∎"],"Proved by SSS"],
["Similar triangles","In ΔABC, D is on AB and E is on AC with DE ∥ BC. AD = 4 cm, DB = 2 cm and DE = 6 cm. Find BC and the ratio of the area of ΔADE to the area of ΔABC.",["∠ADE = ∠ABC (corresponding angles, DE ∥ BC) and ∠A is common, so ΔADE ~ ΔABC (AA).","AB = 4 + 2 = 6, so AD/AB = 4/6 = 2/3.","DE/BC = 2/3, so 6/BC = 2/3 and BC = 9 cm.","Area ratio = (2/3)² = 4/9."],"BC = 9 cm; area ratio 4 : 9"],
["Using the midpoint theorem","In ΔPQR, A is the midpoint of PQ and B is the midpoint of PR. AB = 7 cm. Find QR and state the relationship between AB and QR.",["By the midpoint theorem, AB ∥ QR and AB = ½ QR.","So QR = 2 × 7 = 14 cm."],"QR = 14 cm; AB ∥ QR"],
["Tangent-chord calculation","TA is a tangent to a circle at A. B and C are points on the circle with ∠TAB = 48°, with C in the alternate segment. Find ∠ACB.",["The angle between the tangent and chord AB is 48°.","By the tangent-chord theorem, the angle in the alternate segment is equal.","∠ACB = 48°."],"∠ACB = 48°"],
["A short proof","The two tangents from an external point P touch a circle with centre O at A and B. Prove that PA = PB.",["OA = OB (radii).","∠OAP = ∠OBP = 90° (tangent ⟂ radius).","OP = OP (common side, the hypotenuse).","So ΔOAP ≅ ΔOBP by RHS, and therefore PA = PB (corresponding sides). ∎"],"Proved by RHS"]
],
mis:["Giving no reason for a line, or a vague reason. Every statement needs a reason.","Matching the wrong vertices in similar triangles, so the ratios are wrong.","Using SSA as a congruence test.","Forgetting to say the common side or angle in a congruence proof.","Mixing up the alternate segment. It is on the opposite side of the chord from the angle you started with.","Assuming what you are trying to prove, instead of deriving it.","Squaring the length ratio for areas but not squaring for volumes (it should be cubed)."],
qs:[["State the four tests for congruent triangles.","SSS, SAS, ASA (or AAS), RHS."],["Two similar triangles have a scale factor of 3. What is the ratio of their areas?","1 : 9."],["State the midpoint theorem.","The line joining the midpoints of two sides of a triangle is parallel to the third side and equal to half of it."],["TA is a tangent. Angle TAB = 35° and C is in the alternate segment. What is angle ACB?","35°."]],
sum:["A proof has a statement and a reason on every line, starting from the given.","Congruence tests: SSS, SAS, ASA/AAS, RHS. Not SSA.","Similarity tests: AA, SSS ratio, SAS ratio. Area ratio is k², volume ratio k³.","Midpoint theorem: DE ∥ BC and DE = ½ BC.","Tangent-chord theorem: the angle between a tangent and a chord equals the angle in the alternate segment."]
},
"phy-1":{
obj:["Distinguish between distance and displacement, and between speed and velocity.","Define acceleration and calculate it.","Draw and interpret distance-time and speed-time graphs.","Use gradients and areas on graphs to find speed, acceleration and distance.","Describe free fall and terminal velocity."],
terms:[["Scalar","A quantity with size only, such as distance, speed, mass and energy."],["Vector","A quantity with size and direction, such as displacement, velocity, acceleration and force."],["Displacement","How far an object is from its starting point in a straight line, with direction."],["Acceleration","The rate of change of velocity, measured in m/s²."],["Terminal velocity","The constant maximum speed reached when air resistance equals the weight of a falling object."]],
body:[
["h","1. Describing motion"],
["p","**Distance** is the total length of the path travelled. It is a scalar, so it has size but no direction. **Displacement** is the straight-line distance from the start to the finish in a given direction. It is a vector. If you run one complete 400 m lap and finish where you started, your distance is 400 m but your displacement is 0 m."],
["p","In the same way, **speed** is the distance travelled per unit time, while **velocity** is the displacement per unit time and includes direction."],
["f","speed = distance ÷ time\nacceleration = change in velocity ÷ time taken = (v − u) ÷ t"],
["p","Here u is the initial velocity and v is the final velocity. Acceleration is measured in m/s², which means the velocity changes by that many m/s every second. A negative acceleration means the object is slowing down (deceleration) if it is moving in the positive direction."],
["tip","Convert to SI units first. To change km/h to m/s, divide by 3.6. So 72 km/h = 20 m/s."],
["h","2. Distance-time graphs"],
["ul",["The **gradient** of a distance-time graph is the **speed**.","A horizontal line means the object is stationary.","A straight sloping line means constant speed. A steeper line means a higher speed.","A curve getting steeper means the object is speeding up (accelerating)."]],
["h","3. Speed-time graphs"],
["ul",["The **gradient** of a speed-time graph is the **acceleration**.","A horizontal line means constant speed (zero acceleration).","A sloping straight line means constant acceleration. A downward slope means deceleration.","The **area under the graph** is the **distance travelled**."]],
["svg","vt"],
["p","The graph above shows a car that speeds up for 6 s (region A), travels at constant speed for 10 s (region B) and slows to rest in 4 s (region C). The total area of the three regions is the total distance travelled. Split the area into triangles and rectangles: triangle area = ½ × base × height, rectangle area = base × height."],
["h","4. Equations of motion for constant acceleration"],
["p","If acceleration is constant, these equations connect the quantities. They follow from the definition of acceleration and the area under a speed-time graph. Check whether your school expects you to use them."],
["f","v = u + at\ns = ut + ½at²\nv² = u² + 2as"],
["h","5. Free fall and terminal velocity"],
["p","Near the Earth’s surface, an object falling with no air resistance accelerates at about g = 10 m/s² (the value used in the Singapore syllabus, equivalent to 10 N/kg). In real life air resistance acts upwards and grows with speed. As the object speeds up, air resistance increases until it equals the weight. The resultant force is then zero, the acceleration is zero, and the object falls at a constant **terminal velocity**."]
],
ex:[
["Average speed","A runner completes one 400 m lap in 80 s. Find the average speed and the displacement after the lap.",["Average speed = 400 ÷ 80 = 5 m/s.","The runner finishes at the starting point, so the displacement is 0 m."],"Speed 5 m/s; displacement 0 m"],
["Speed-time graph","A car speeds up uniformly from rest to 15 m/s in 6 s, travels at 15 m/s for 10 s, then slows uniformly to rest in 4 s. Find the acceleration in each stage, the total distance and the average speed.",["Stage A: a = (15 − 0) ÷ 6 = 2.5 m/s².","Stage B: constant speed, so a = 0.","Stage C: a = (0 − 15) ÷ 4 = −3.75 m/s² (deceleration of 3.75 m/s²).","Distance = areas: ½ × 6 × 15 = 45 m, 10 × 15 = 150 m, ½ × 4 × 15 = 30 m. Total = 225 m.","Total time = 20 s, so average speed = 225 ÷ 20 = 11.25 m/s."],"2.5 m/s², 0, −3.75 m/s²; 225 m; 11.25 m/s"],
["Equations of motion","A car moving at 8 m/s accelerates uniformly at 2 m/s² for 5 s. Find its final speed and the distance travelled.",["v = u + at = 8 + 2(5) = 18 m/s.","s = ut + ½at² = 8(5) + ½(2)(25) = 40 + 25 = 65 m.","Check: average speed (8 + 18) ÷ 2 = 13 m/s, and 13 × 5 = 65 m. ✓"],"18 m/s; 65 m"],
["Free fall","A stone is dropped from rest from a cliff 45 m high. Ignoring air resistance, find the time to hit the ground and its speed on impact.",["s = ½gt²: 45 = ½(10)t² = 5t², so t² = 9 and t = 3 s.","v = gt = 10 × 3 = 30 m/s."],"3 s; 30 m/s"],
["Explaining terminal velocity","Explain why a skydiver reaches a constant speed.",["At first only weight acts, so the skydiver accelerates downwards.","As speed increases, air resistance increases.","Eventually air resistance equals the weight, so the forces are balanced.","The resultant force is zero, so there is no acceleration. The skydiver falls at constant terminal velocity."],"Balanced forces give zero acceleration at terminal velocity"]
],
mis:["Using the gradient of a distance-time graph as the acceleration. It gives speed. Use a speed-time graph for acceleration.","Forgetting to convert units, such as minutes to seconds or km/h to m/s.","Confusing the gradient with the area on a speed-time graph. Gradient = acceleration, area = distance.","Thinking that zero velocity means zero acceleration. A ball at the top of its flight has zero velocity for an instant but still accelerates downward at 10 m/s².","Saying the skydiver stops accelerating because gravity stops. Gravity is the same; the resultant force becomes zero.","Describing a negative gradient as ‘stationary’."],
qs:[["Convert 90 km/h to m/s.","90 ÷ 3.6 = 25 m/s."],["A car goes from 5 m/s to 20 m/s in 6 s. Find its acceleration.","(20 − 5) ÷ 6 = 2.5 m/s²."],["What does a horizontal line on a speed-time graph show?","Constant speed (zero acceleration)."],["A train slows from 30 m/s to rest at a uniform deceleration of 1.5 m/s². How far does it travel?","v² = u² + 2as: 0 = 900 + 2(−1.5)s, so s = 300 m."]],
sum:["Distance and speed are scalars. Displacement and velocity are vectors.","Distance-time graph: gradient = speed. Speed-time graph: gradient = acceleration, area = distance.","a = (v − u) ÷ t. Free-fall acceleration is 10 m/s².","At terminal velocity weight = air resistance, so the acceleration is zero."]
},
"phy-2":{
obj:["State Newton’s three laws of motion and apply them.","Use F = ma and W = mg correctly, and tell mass from weight.","Find the resultant force and describe the motion it causes.","Explain friction and terminal velocity in terms of forces."],
terms:[["Force","A push or pull, measured in newtons (N). It is a vector."],["Resultant force","The single force that has the same effect as all the forces acting together."],["Inertia","The tendency of an object to resist any change in its motion."],["Mass","The amount of matter in an object, measured in kg. It does not change with location."],["Weight","The gravitational force on an object, measured in N."]],
body:[
["h","1. Forces and the resultant force"],
["p","A **force** is a push or pull. Several forces can act on an object at once. The **resultant force** is their combined effect. Forces in the same direction add, and forces in opposite directions subtract. If the resultant force is zero, the forces are **balanced**."],
["h","2. Newton’s first law"],
["p","An object stays at rest, or moves at constant velocity in a straight line, unless a resultant force acts on it. This means that a resultant force is needed to change the motion, but not to keep it going. The property of resisting changes in motion is called **inertia**. The bigger the mass, the bigger the inertia. This is why passengers lurch forward when a bus brakes suddenly: their bodies tend to keep moving at the old velocity."],
["h","3. Newton’s second law"],
["f","F = ma\nresultant force (N) = mass (kg) × acceleration (m/s²)"],
["p","A resultant force makes an object accelerate in the direction of the force. The acceleration is bigger when the force is bigger, and smaller when the mass is bigger. One newton is the force that gives a 1 kg mass an acceleration of 1 m/s²."],
["h","4. Mass and weight"],
["f","W = mg\nweight (N) = mass (kg) × gravitational field strength (N/kg)"],
["p","Mass is the amount of matter and stays the same everywhere. Weight is a force and depends on gravity. On Earth g = 10 N/kg, so a 45 kg student weighs 450 N. On the Moon g is about 1.6 N/kg, so the same student weighs 72 N but still has a mass of 45 kg."],
["h","5. Newton’s third law"],
["p","If object A exerts a force on object B, then B exerts an equal and opposite force on A. These two forces are the same type, act on different objects and are equal in size. When you push a wall, the wall pushes back with the same size force."],
["warn","The weight of a book and the normal reaction from the table are equal and opposite, but they are NOT a third-law pair. They act on the same object and are different types of force. The third-law partner of the book’s weight is the book’s gravitational pull on the Earth."],
["h","6. Friction and terminal velocity"],
["p","**Friction** is a force that opposes motion between surfaces in contact. It acts opposite to the direction of motion and depends on the roughness of the surfaces. Air resistance is a similar force for objects moving through air. When a falling object reaches the speed at which air resistance equals weight, it moves at constant terminal velocity."],
["tip","In ‘explain’ questions, name each force, say which is bigger, state the resultant force, and then link it to the change in motion."]
],
ex:[
["Resultant force","A 1200 kg car has an engine force of 3000 N forward and resistive forces of 600 N backward. Find its acceleration.",["Resultant force = 3000 − 600 = 2400 N forward.","a = F ÷ m = 2400 ÷ 1200 = 2 m/s²."],"2 m/s² forward"],
["Mass and weight","An astronaut has a weight of 450 N on Earth (g = 10 N/kg). Find her mass and her weight on the Moon, where g = 1.6 N/kg.",["m = W ÷ g = 450 ÷ 10 = 45 kg.","Mass is the same on the Moon: 45 kg.","Weight on the Moon = 45 × 1.6 = 72 N."],"Mass 45 kg; weight on the Moon 72 N"],
["Friction","A 5 kg block is pulled across a table with a force of 20 N. The friction force is 8 N. Find the acceleration.",["Resultant force = 20 − 8 = 12 N.","a = 12 ÷ 5 = 2.4 m/s²."],"2.4 m/s²"],
["Force from motion","A 0.50 kg ball moving at 12 m/s is brought to rest in 0.20 s by a goalkeeper. Find the average force on the ball.",["a = (0 − 12) ÷ 0.20 = −60 m/s².","F = ma = 0.50 × (−60) = −30 N.","The force has size 30 N, directed opposite to the ball’s motion."],"30 N opposite to the motion"],
["Reading a lift","A 60 kg person stands in a lift accelerating upwards at 2 m/s². Find the force from the floor on the person (g = 10 N/kg).",["Forces: normal reaction N upward, weight mg = 600 N downward.","Resultant upward = N − 600 = ma = 60 × 2 = 120 N.","N = 600 + 120 = 720 N."],"720 N"]
],
mis:["Using mass in grams in F = ma. Convert to kg first.","Confusing mass and weight, or giving weight in kilograms.","Forgetting to subtract opposing forces such as friction before using F = ma.","Thinking a moving object needs a constant resultant force to keep moving. Constant velocity means zero resultant force.","Calling the weight and the normal reaction a third-law pair.","Saying ‘the object stops accelerating because forces stop’ at terminal velocity. The forces become balanced."],
qs:[["What resultant force gives a 4.0 kg trolley an acceleration of 3.0 m/s²?","F = 4.0 × 3.0 = 12 N."],["A 2 kg book rests on a table. State its weight and the normal reaction on it (g = 10 N/kg).","Weight = 20 N. The book is in equilibrium so the normal reaction is 20 N upward."],["Why does a passenger move forward when a car brakes sharply?","Inertia: the passenger tends to keep moving at the original velocity while the car slows."],["A 1500 kg car accelerates from rest to 20 m/s in 8 s. Find the resultant force.","a = 20 ÷ 8 = 2.5 m/s². F = 1500 × 2.5 = 3750 N."]],
sum:["Resultant force zero ⇒ constant velocity (or at rest). Resultant force non-zero ⇒ acceleration, F = ma.","Mass (kg) is constant. Weight (N) = mg, with g = 10 N/kg on Earth.","Third-law forces are equal, opposite, same type and act on different objects.","Friction and air resistance oppose motion. At terminal velocity weight = air resistance."]
},
"phy-4":{
obj:["Define the moment of a force and calculate it.","State and apply the principle of moments.","State the two conditions for equilibrium and use them to find unknown forces.","Explain centre of gravity and stability."],
terms:[["Moment of a force","The turning effect of a force about a pivot, equal to the force multiplied by the perpendicular distance from the pivot."],["Pivot","The fixed point about which an object can turn."],["Equilibrium","The state of an object when it is not accelerating and not rotating."],["Centre of gravity","The point where the whole weight of an object seems to act."],["Stable","An object that returns to its original position after a small tilt."]],
body:[
["h","1. The moment of a force"],
["p","A force can make an object turn about a pivot. This turning effect is called the **moment** of the force. It depends on how big the force is and on how far from the pivot the force acts. This is why it is easier to open a door by pushing at the handle than near the hinges."],
["f","moment = force × perpendicular distance from the pivot\nunit: newton-metre (N m)"],
["p","The distance must be measured at right angles to the line of action of the force. If the force acts at an angle, use the perpendicular distance, not the length along the object."],
["h","2. The principle of moments"],
["p","A moment can be clockwise or anticlockwise. When an object is balanced, the total clockwise moment about any point equals the total anticlockwise moment about that point."],
["f","sum of clockwise moments = sum of anticlockwise moments"],
["h","3. Conditions for equilibrium"],
["ol",["The resultant force is zero (the upward forces equal the downward forces), so the object does not accelerate.","The resultant moment about any point is zero, so the object does not rotate."]],
["p","For problems with unknown forces, take moments about a convenient pivot, often the point where an unknown force acts, because that force then has zero moment and drops out of the equation."],
["h","4. Centre of gravity"],
["p","The **centre of gravity** of an object is the point where its entire weight appears to act. For a uniform beam it is at the middle. For an irregular flat shape (a lamina) it can be found by hanging the shape from different points with a plumb line: the lines drawn along the plumb line meet at the centre of gravity."],
["h","5. Stability"],
["p","An object is **stable** if, when tilted slightly, its weight produces a moment that turns it back. This happens while the vertical line through the centre of gravity stays inside the base. To make an object more stable, lower its centre of gravity and widen its base. Racing cars are low and wide for this reason."],
["tip","Draw the beam and mark every force with its distance from your chosen pivot before writing any equations."]
],
ex:[
["A single moment","A force of 50 N acts at 0.40 m from a pivot at right angles. Find the moment.",["Moment = force × perpendicular distance.","= 50 × 0.40 = 20 N m."],"20 N m"],
["Balancing a seesaw","A child of mass 30 kg sits 2.0 m from the pivot of a seesaw. Where must a 40 kg child sit on the other side to balance it? (g = 10 N/kg)",["Weights: 30 × 10 = 300 N and 40 × 10 = 400 N.","Clockwise moment = anticlockwise moment: 300 × 2.0 = 400 × d.","600 = 400d, so d = 1.5 m."],"1.5 m from the pivot"],
["Beam supported at two points","A uniform plank 6.0 m long has weight 300 N. It rests on supports at each end, A and B. A load of 600 N is placed 2.0 m from A. Find the force on each support.",["Take moments about A so that the unknown force at A drops out.","Clockwise moments about A: 300 × 3.0 (plank’s weight at its centre) + 600 × 2.0 = 900 + 1200 = 2100 N m.","Anticlockwise moment: R_B × 6.0. So R_B = 2100 ÷ 6.0 = 350 N.","Upward forces equal downward forces: R_A + R_B = 300 + 600 = 900 N, so R_A = 550 N."],"R_A = 550 N, R_B = 350 N"],
["A lever","A crowbar is pivoted so that an effort of 40 N acts 0.60 m from the pivot. The load is 0.15 m from the pivot on the other side. Find the largest load that can just be lifted.",["Clockwise = anticlockwise: 40 × 0.60 = load × 0.15.","24 = 0.15 × load, so load = 160 N."],"160 N"],
["Stability","Explain why a bus with passengers sitting on the lower deck is more stable than one with passengers upstairs.",["Passengers on the lower deck lower the centre of gravity of the whole bus.","The vertical line through the centre of gravity then stays inside the base even when the bus tilts further.","So the weight gives a restoring moment and the bus is less likely to topple."],"Lower centre of gravity gives greater stability"]
],
mis:["Using the length along the object rather than the perpendicular distance from the pivot.","Forgetting that the weight of a uniform beam acts at its centre.","Mixing units, such as cm for one distance and m for another. Convert before calculating.","Measuring distances from different pivots in the same equation. Use one pivot for all moments.","Checking only moments and forgetting that the forces must also balance.","Saying an object topples when its centre of gravity is high. It topples when the vertical line through its centre of gravity falls outside the base."],
qs:[["State the principle of moments.","When an object is in equilibrium, the sum of the clockwise moments about any point equals the sum of the anticlockwise moments about that point."],["Calculate the moment of a 12 N force acting 25 cm from a pivot.","25 cm = 0.25 m, so the moment = 12 × 0.25 = 3.0 N m."],["A uniform 1.0 m rule balances at the 40 cm mark with a 2.0 N weight at 10 cm. What is the weight of the rule?","The rule’s weight acts at 50 cm, which is 10 cm from the pivot on one side. 2.0 × 0.30 = W × 0.10, so W = 6.0 N."],["Why are racing cars built low and wide?","A low centre of gravity and wide base make them more stable, so they are harder to tip over when turning."]],
sum:["Moment = force × perpendicular distance, measured in N m.","Principle of moments: clockwise = anticlockwise in equilibrium.","Equilibrium needs zero resultant force and zero resultant moment.","The weight of a uniform object acts at its centre of gravity.","Lower centre of gravity and wider base give more stability."]
},
"phy-6":{
obj:["List the forms of energy and describe energy conversions.","State the principle of conservation of energy.","Calculate work done, kinetic energy, gravitational potential energy, power and efficiency.","Use energy conservation to solve problems."],
terms:[["Energy","The ability to do work, measured in joules (J)."],["Work done","The energy transferred when a force moves an object in the direction of the force."],["Kinetic energy","The energy an object has because it is moving."],["Gravitational potential energy","The energy stored in an object because of its height above the ground."],["Power","The rate at which work is done or energy is transferred, in watts (W)."],["Efficiency","The fraction of the input energy that becomes useful output energy."]],
body:[
["h","1. Energy and its forms"],
["p","**Energy** is the ability to do work. It exists in many forms: kinetic, gravitational potential, elastic potential, chemical, thermal (heat), electrical, light, sound and nuclear. Energy is measured in **joules (J)**. A joule is a small amount: lifting a 100 g apple by 1 m needs about 1 J."],
["h","2. Conservation of energy"],
["p","Energy cannot be created or destroyed. It can only change from one form to another or be transferred from one object to another. The total amount of energy in a closed system stays the same. When we say energy is ‘wasted’, we mean that it ends up as heat or sound that is not useful, spreading into the surroundings."],
["h","3. Work done"],
["f","work done = force × distance moved in the direction of the force\nW = Fs"],
["p","Work is done when a force makes something move. If you carry a heavy bag horizontally, the force you apply is upward but the movement is horizontal, so you do no work on the bag in the physics sense. One joule is the work done when a force of 1 N moves an object 1 m in the direction of the force."],
["h","4. Kinetic and gravitational potential energy"],
["f","kinetic energy: KE = ½mv²\ngravitational potential energy: GPE = mgh"],
["p","In KE = ½mv², the energy depends on the square of the speed, so doubling the speed makes the kinetic energy four times bigger. In GPE = mgh, h is the **vertical** height above the chosen reference level, not the length of a slope, and g = 10 N/kg."],
["h","5. Power"],
["f","power = work done ÷ time taken = energy transferred ÷ time\nP = W/t   (unit: watt, W = J/s)"],
["p","Power tells you how fast energy is transferred. Two machines may do the same work, but the one that does it in less time has more power."],
["h","6. Efficiency"],
["f","efficiency = (useful energy output ÷ total energy input) × 100%"],
["p","Efficiency can never be more than 100%, because some energy is always wasted as heat or sound. A filament bulb that turns 6 J of every 60 J of electrical energy into light has an efficiency of 10%. The other 54 J becomes thermal energy."],
["tip","Write down the energy store at the start and the end of the process. Then equate them, for example loss of GPE = gain of KE when air resistance is ignored."]
],
ex:[
["Work done","A student pushes a box with a force of 50 N through 8.0 m along the floor. How much work is done?",["W = Fs = 50 × 8.0 = 400 J."],"400 J"],
["GPE and KE","(a) Find the GPE gained when a 2.0 kg book is lifted 1.5 m. (b) Find the kinetic energy of a 1200 kg car travelling at 20 m/s. (g = 10 N/kg)",["(a) GPE = mgh = 2.0 × 10 × 1.5 = 30 J.","(b) KE = ½mv² = ½ × 1200 × 20² = ½ × 1200 × 400 = 240 000 J = 240 kJ."],"(a) 30 J (b) 240 kJ"],
["Conservation of energy","A ball is dropped from a height of 5.0 m. Ignoring air resistance, find its speed just before it hits the ground.",["Loss in GPE = gain in KE: mgh = ½mv².","The mass cancels: gh = ½v², so v² = 2gh = 2 × 10 × 5.0 = 100.","v = 10 m/s."],"10 m/s"],
["Power and efficiency","A motor lifts a 500 kg load through 12 m in 20 s. The motor takes in 5000 W of electrical power. Find the useful power output and the efficiency. (g = 10 N/kg)",["Work done = mgh = 500 × 10 × 12 = 60 000 J.","Useful power = 60 000 ÷ 20 = 3000 W.","Efficiency = 3000 ÷ 5000 × 100% = 60%."],"3000 W; 60%"],
["Energy conversion","A bulb takes 60 J of electrical energy and gives out 6 J of light. State the efficiency and the amount of energy wasted.",["Efficiency = 6 ÷ 60 × 100% = 10%.","Wasted energy = 60 − 6 = 54 J, mostly as thermal energy."],"Efficiency 10%; wasted 54 J"]
],
mis:["Using the length of a slope instead of the vertical height in mgh.","Using mass in grams in energy formulae. Convert to kg.","Forgetting to square the speed in KE = ½mv².","Mixing up power and energy. Power is the rate, in watts; energy is the amount, in joules.","Writing an efficiency above 100%.","Saying work is done when a force acts but nothing moves in the direction of the force."],
qs:[["How much GPE does a 60 kg student gain climbing stairs of total height 3.0 m? (g = 10 N/kg)","GPE = 60 × 10 × 3.0 = 1800 J."],["A 0.20 kg ball moves at 6.0 m/s. Find its KE.","½ × 0.20 × 36 = 3.6 J."],["A machine does 4500 J of work in 30 s. Find its power.","4500 ÷ 30 = 150 W."],["If the speed of a car doubles, what happens to its KE?","KE depends on v², so it increases by a factor of 4."]],
sum:["Energy is conserved. It changes form but the total stays the same.","W = Fs, KE = ½mv², GPE = mgh, P = W/t.","Efficiency = (useful output ÷ total input) × 100% and is always below 100%.","Use vertical height for GPE and SI units throughout."]
},
"chem-2":{
obj:["Describe the structure of an atom and the properties of protons, neutrons and electrons.","Use proton number and nucleon number to work out the numbers of subatomic particles in atoms and ions.","Explain isotopes and calculate relative atomic mass.","Write the electronic configuration of the first 20 elements and link it to the Periodic Table."],
terms:[["Proton number (atomic number, Z)","The number of protons in the nucleus of an atom. It identifies the element."],["Nucleon number (mass number, A)","The total number of protons and neutrons in the nucleus."],["Isotopes","Atoms of the same element with the same number of protons but different numbers of neutrons."],["Relative atomic mass (Ar)","The average mass of an atom of an element compared with 1/12 of the mass of a carbon-12 atom."],["Valence electrons","The electrons in the outermost shell of an atom."],["Ion","A charged particle formed when an atom gains or loses electrons."]],
body:[
["h","1. Inside the atom"],
["p","An atom has a tiny, dense, positively charged **nucleus** containing **protons** and **neutrons**. Electrons move around the nucleus in regions called shells. Almost all of the mass of an atom is in the nucleus, but almost all of its volume is empty space occupied by the electrons."],
["tbl",[["Particle","Relative charge","Relative mass","Where found"],["Proton","+1","1","Nucleus"],["Neutron","0","1","Nucleus"],["Electron","−1","1/1840 (negligible)","Shells around the nucleus"]]],
["p","An atom is neutral because the number of protons equals the number of electrons, so the charges cancel."],
["h","2. Proton number and nucleon number"],
["f","proton number = number of protons\nnucleon number = protons + neutrons\nneutrons = nucleon number − proton number"],
["p","The **proton number** tells you which element it is: all atoms with 11 protons are sodium. The **nucleon number** is written at the top left and the proton number at the bottom left of the symbol. Sodium-23 is written ²³₁₁Na: 11 protons, 11 electrons and 23 − 11 = 12 neutrons."],
["p","In an ion the number of electrons is different. Potassium-39 (³⁹₁₉K) has 19 protons and 20 neutrons. The ion K⁺ has lost one electron, so it has 19 protons, 20 neutrons and 18 electrons."],
["h","3. Isotopes"],
["p","**Isotopes** are atoms of the same element with the same proton number but different nucleon numbers, because they have different numbers of neutrons. Chlorine-35 and chlorine-37 are isotopes. They have the same number of electrons, so they have the same chemical properties. They have different masses, so their physical properties (such as density) differ slightly."],
["p","Some isotopes are radioactive. Examples of uses include carbon-14 for dating ancient objects and cobalt-60 for treating cancer and sterilising medical equipment."],
["h","4. Relative atomic mass"],
["p","Because most elements are a mixture of isotopes, the relative atomic mass is a weighted average. Multiply each isotope’s mass number by its percentage abundance, add them up and divide by 100."],
["f","Ar = Σ (mass number × percentage abundance) ÷ 100"],
["h","5. Electronic configuration"],
["p","Electrons occupy shells, and each shell holds a maximum number of electrons. The first shell holds 2, the second 8 and the third 8 (for the first 20 elements). Fill the shells from the inside out. Sodium has 11 electrons, so its configuration is 2,8,1. Chlorine has 17 electrons: 2,8,7."],
["svg","shells"],
["p","The Periodic Table can be read from the configuration: the **number of outer-shell electrons** gives the group number (for groups I to VII), and the **number of shells** gives the period. Sodium, 2,8,1, is in Group I and Period 3. Chlorine, 2,8,7, is in Group VII, Period 3. Noble gases such as neon (2,8) and argon (2,8,8) have full outer shells, which makes them very stable and unreactive."],
["tip","When you write an ion’s configuration, remove or add electrons to the outer shell. Na⁺ is 2,8 (the same as neon) and Cl⁻ is 2,8,8 (the same as argon)."]
],
ex:[
["Counting particles","State the number of protons, neutrons and electrons in ³⁹₁₉K and in K⁺.",["Protons = proton number = 19.","Neutrons = 39 − 19 = 20.","The neutral atom has 19 electrons. K⁺ has lost one electron, so it has 18 electrons.","Protons and neutrons are unchanged in the ion."],"Atom: 19p, 20n, 19e. Ion K⁺: 19p, 20n, 18e"],
["Relative atomic mass","Chlorine consists of 75% chlorine-35 and 25% chlorine-37. Calculate its relative atomic mass.",["Ar = (35 × 75 + 37 × 25) ÷ 100.","= (2625 + 925) ÷ 100 = 3550 ÷ 100 = 35.5."],"35.5"],
["Relative atomic mass of magnesium","Magnesium has isotopes 24Mg (79%), 25Mg (10%) and 26Mg (11%). Calculate its relative atomic mass.",["Ar = (24 × 79 + 25 × 10 + 26 × 11) ÷ 100.","= (1896 + 250 + 286) ÷ 100 = 2432 ÷ 100 = 24.32."],"24.3 (to 3 s.f.)"],
["Electronic configuration","Write the electronic configuration of magnesium and state its group and period.",["Magnesium has 12 electrons.","Fill the shells: 2 + 8 + 2, so the configuration is 2,8,2.","Two outer electrons means Group II; three shells means Period 3."],"2,8,2; Group II, Period 3"],
["Isotopes","Explain why two isotopes of the same element have the same chemical properties but different physical properties.",["Isotopes have the same number of electrons, and chemical properties depend on the electrons, especially the outer ones.","They have different numbers of neutrons, so different masses.","So physical properties that depend on mass, such as density, differ."],"Same electrons, different neutrons"]
],
mis:["Saying that the nucleon number is the number of neutrons. It is protons + neutrons.","Confusing the proton number with the number of electrons in ions. Ions have lost or gained electrons.","Writing the electron configuration of an ion as if it were the atom.","Using a simple average instead of a weighted average for Ar.","Saying isotopes have different numbers of protons.","Putting more than 8 electrons in the third shell for the first 20 elements, such as writing potassium as 2,8,9. Potassium is 2,8,8,1."],
qs:[["How many neutrons are in ²⁷₁₃Al?","27 − 13 = 14 neutrons."],["Write the electronic configuration of the oxide ion O²⁻ (oxygen has 8 electrons).","O²⁻ has 10 electrons: 2,8."],["Define isotopes.","Atoms of the same element with the same number of protons but different numbers of neutrons."],["Copper has 69% 63Cu and 31% 65Cu. Calculate its relative atomic mass.","(63 × 69 + 65 × 31) ÷ 100 = (4347 + 2015) ÷ 100 = 63.62."]],
sum:["Atoms have a nucleus of protons and neutrons, with electrons in shells.","Proton number identifies the element; nucleon number = protons + neutrons.","Isotopes have the same protons but different neutrons.","Ar is a weighted average of isotope masses.","Shells fill 2,8,8. Outer electrons give the group; number of shells gives the period."]
},
"chem-3":{
obj:["Describe how ionic bonds form by electron transfer and covalent bonds by electron sharing.","Draw and interpret dot-and-cross diagrams for simple ionic and covalent compounds.","Work out the formula of an ionic compound from its ions.","Explain the properties of ionic and simple molecular substances in terms of their bonding and structure."],
terms:[["Ionic bond","The strong electrostatic attraction between oppositely charged ions."],["Covalent bond","A bond formed by the sharing of a pair of electrons between two atoms."],["Lone pair","A pair of outer electrons not used in bonding."],["Lattice","The regular repeating arrangement of ions in an ionic solid."],["Intermolecular forces","The weak forces of attraction between molecules."]],
body:[
["h","1. Why atoms bond"],
["p","Atoms of noble gases have full outer shells and are very stable. Other atoms react to reach the same stable electronic configuration, either by transferring electrons to form ions or by sharing electrons."],
["h","2. Ionic bonding"],
["p","Ionic bonding usually occurs between a **metal** and a **non-metal**. The metal atom loses its outer electrons to form a positive ion (cation). The non-metal atom gains electrons to form a negative ion (anion). Sodium (2,8,1) loses one electron to become Na⁺ (2,8), and chlorine (2,8,7) gains one to become Cl⁻ (2,8,8). The **ionic bond** is the strong electrostatic attraction between these oppositely charged ions."],
["p","Magnesium chloride shows how the numbers change. A magnesium atom (2,8,2) loses two electrons to form Mg²⁺. Each chlorine atom gains only one, so two chlorine atoms are needed. The formula is MgCl₂."],
["f","Formula from ions: swap and drop the charges\nAl³⁺ and O²⁻ → Al₂O₃"],
["h","3. Covalent bonding"],
["p","Covalent bonding occurs between **non-metal** atoms. The atoms share pairs of electrons so that each atom has a full outer shell. Each shared pair is one covalent bond. In water, H₂O, oxygen has 6 outer electrons and shares one with each of two hydrogen atoms. The oxygen atom ends up with 8 outer electrons: two bonding pairs and two lone pairs."],
["tbl",[["Molecule","Bonds","Pairs of electrons shared"],["H₂ (hydrogen)","H–H single bond","1"],["Cl₂ (chlorine)","Cl–Cl single bond","1"],["H₂O (water)","two O–H single bonds","2 (and 2 lone pairs on O)"],["NH₃ (ammonia)","three N–H single bonds","3 (and 1 lone pair on N)"],["CH₄ (methane)","four C–H single bonds","4"],["O₂ (oxygen)","O=O double bond","2"],["CO₂ (carbon dioxide)","two C=O double bonds","4 (2 per double bond)"],["N₂ (nitrogen)","N≡N triple bond","3"]]],
["h","4. Properties of ionic compounds"],
["ul",["**High melting and boiling points.** A lot of energy is needed to overcome the strong electrostatic attraction between many oppositely charged ions in the giant lattice.","**Conduct electricity when molten or dissolved in water, but not as solids.** In a solid the ions are fixed in position. When molten or in solution the ions are free to move and carry the charge.","**Often soluble in water.** Water molecules attract the ions and pull them out of the lattice.","**Brittle.** If the lattice is hit, layers shift and ions of the same charge become neighbours and repel."]],
["h","5. Properties of simple molecular substances"],
["ul",["**Low melting and boiling points.** Little energy is needed to overcome the weak forces between molecules (intermolecular forces).","**Do not conduct electricity.** There are no free ions or free electrons.","**Usually insoluble in water** but soluble in organic solvents."]],
["warn","When a simple molecular substance melts or boils, the covalent bonds do NOT break. Only the weak intermolecular forces are overcome. Writing that ‘strong covalent bonds are broken’ is a very common mistake."],
["tip","In ‘explain’ answers, name the particles, name the forces between them, and say whether the forces are strong or weak: ‘strong electrostatic attraction between oppositely charged ions’."]
],
ex:[
["Electron transfer","Describe how magnesium and chlorine atoms form magnesium chloride.",["Magnesium (2,8,2) loses two outer electrons to form Mg²⁺ (2,8).","Each chlorine atom (2,8,7) gains one electron to form Cl⁻ (2,8,8).","Two chloride ions are needed to take the two electrons from one magnesium atom.","The oppositely charged ions attract by electrostatic forces: formula MgCl₂."],"MgCl₂ with Mg²⁺ and 2 Cl⁻ ions"],
["Writing a formula","Write the formulae of (a) aluminium oxide, (b) calcium nitrate (nitrate is NO₃⁻), (c) sodium sulfate (sulfate is SO₄²⁻).",["(a) Al³⁺ and O²⁻: swap the numbers to get Al₂O₃.","(b) Ca²⁺ needs two NO₃⁻, so put the nitrate in brackets: Ca(NO₃)₂.","(c) Two Na⁺ balance one SO₄²⁻: Na₂SO₄."],"Al₂O₃; Ca(NO₃)₂; Na₂SO₄"],
["Covalent bonding","Describe the bonding in a molecule of water.",["Oxygen has six outer electrons and needs two more to fill its shell.","Each hydrogen has one electron and needs one more.","Oxygen shares one pair with each hydrogen, forming two single covalent bonds.","Oxygen has two bonding pairs and two lone pairs; each hydrogen has a full shell of 2."],"Two single covalent bonds; two lone pairs on O"],
["Explaining a property","Explain why sodium chloride conducts electricity when molten but not when solid.",["Sodium chloride is made of Na⁺ and Cl⁻ ions in a giant lattice.","In the solid, the ions are held in fixed positions and cannot move.","When molten, the ions are free to move and carry electric charge."],"Mobile ions only when molten"],
["Comparing melting points","Explain why sodium chloride has a much higher melting point than methane.",["NaCl has a giant ionic lattice with strong electrostatic attraction between oppositely charged ions. A large amount of energy is needed to overcome it.","Methane is a simple molecule with only weak intermolecular forces between molecules.","Only a small amount of energy is needed to overcome weak forces."],"Strong ionic attraction vs weak intermolecular forces"]
],
mis:["Saying the ionic bond is the attraction between atoms. It is between oppositely charged ions.","Writing that covalent bonds break when simple molecular substances melt or boil.","Forgetting the brackets in formulae like Ca(NO₃)₂.","Saying ‘ionic compounds conduct electricity because they contain electrons’. They conduct when molten or dissolved because ions are free to move.","Forgetting that a covalent bond is a shared pair, so a double bond is two pairs.","Showing the electrons on an ion as if it were an atom (an ion should show the brackets and the charge)."],
qs:[["Write the formula of magnesium oxide.","Mg²⁺ and O²⁻ give MgO."],["How many electrons are shared in an N₂ molecule?","A triple bond: 3 shared pairs, so 6 electrons."],["Why does a simple molecular substance not conduct electricity?","It has no free ions or free electrons to carry charge."],["State why ionic compounds have high melting points.","Large amount of energy needed to overcome the strong electrostatic attraction between many oppositely charged ions in the giant lattice."]],
sum:["Ionic bond: transfer of electrons from metal to non-metal; strong attraction between ions.","Covalent bond: sharing of electron pairs between non-metal atoms.","Ionic compounds: high melting point, conduct when molten or dissolved.","Simple molecules: low melting point, no conduction, weak intermolecular forces (the covalent bonds do not break)."]
},
"chem-6":{
obj:["Define the mole and use the Avogadro constant.","Calculate relative formula mass and the amount of substance in moles.","Use moles with mass, gas volume and concentration.","Use balanced equations to work out reacting masses, volumes and concentrations, including limiting reagent, percentage yield and empirical formula."],
terms:[["Mole","The amount of substance that contains 6.02 × 10²³ particles."],["Avogadro constant","6.02 × 10²³ per mole."],["Relative formula mass (Mr)","The sum of the relative atomic masses of all the atoms in the formula."],["Concentration","The amount of solute per unit volume of solution, in mol/dm³ or g/dm³."],["Limiting reagent","The reactant that is completely used up first, so it limits the amount of product."]],
body:[
["h","1. The mole"],
["p","Atoms and molecules are far too small to count, so chemists count them in large groups called **moles**. One **mole** is 6.02 × 10²³ particles (the Avogadro constant). The reason this number is chosen is that one mole of a substance has a mass in grams equal to its relative atomic or formula mass. So 1 mol of carbon atoms (Ar = 12) has a mass of 12 g."],
["h","2. Relative formula mass"],
["p","To work out **Mr**, add up the Ar values of every atom in the formula. For Ca(OH)₂: Ca = 40, O = 16 and H = 1, and the bracket is multiplied by 2. So Mr = 40 + 2(16 + 1) = 74. Useful values: H 1, C 12, N 14, O 16, Na 23, Mg 24, Al 27, S 32, Cl 35.5, K 39, Ca 40, Fe 56, Cu 64, Zn 65."],
["h","3. The mole formulae"],
["f","moles = mass (g) ÷ Mr\nmoles of gas = volume (dm³) ÷ 24     (at room temperature and pressure)\nmoles of solute = concentration (mol/dm³) × volume (dm³)"],
["p","Remember to convert cm³ to dm³ by dividing by 1000. Concentration in g/dm³ = concentration in mol/dm³ × Mr."],
["h","4. Calculations from equations"],
["p","The coefficients in a balanced equation give the ratio of moles of each substance. This is the key link in every calculation."],
["ol",["Write the balanced equation.","Convert the given quantity to moles.","Use the mole ratio from the equation to find the moles of the substance you want.","Convert moles to the quantity asked for (mass, volume or concentration)."]],
["h","5. Limiting reagent, percentage yield and empirical formula"],
["p","When quantities of both reactants are given, work out the moles of each. Divide each by its coefficient: the smaller value is the **limiting reagent**, and it decides how much product forms."],
["f","percentage yield = (actual yield ÷ theoretical yield) × 100%"],
["p","For an **empirical formula** (the simplest whole-number ratio of atoms), divide the mass or percentage of each element by its Ar to get moles, then divide all by the smallest, and round to whole numbers. If the question gives the Mr, find the molecular formula by dividing Mr by the empirical formula mass."],
["tip","Set out every calculation as: equation, moles given, ratio, moles wanted, answer with unit. Marks are given for each step."]
],
ex:[
["Moles and Mr","Calculate the number of moles in 5.6 g of iron (Ar of Fe = 56) and the Mr of Ca(OH)₂.",["Moles = 5.6 ÷ 56 = 0.10 mol.","Mr = 40 + 2(16 + 1) = 74."],"0.10 mol; Mr = 74"],
["Mass and gas volume","25 g of calcium carbonate decomposes: CaCO₃ → CaO + CO₂. Find the mass and the volume of CO₂ formed at room temperature and pressure. (Mr CaCO₃ = 100)",["Moles of CaCO₃ = 25 ÷ 100 = 0.25 mol.","Ratio CaCO₃ : CO₂ is 1 : 1, so 0.25 mol of CO₂ forms.","Mass = 0.25 × 44 = 11 g.","Volume = 0.25 × 24 = 6.0 dm³."],"11 g; 6.0 dm³"],
["Concentration","4.0 g of sodium hydroxide is dissolved to make 500 cm³ of solution. Find the concentration in mol/dm³ and g/dm³. (Mr NaOH = 40)",["Moles = 4.0 ÷ 40 = 0.10 mol.","Volume = 500 ÷ 1000 = 0.500 dm³.","Concentration = 0.10 ÷ 0.500 = 0.20 mol/dm³.","In g/dm³: 0.20 × 40 = 8.0 g/dm³."],"0.20 mol/dm³ (8.0 g/dm³)"],
["Titration","25.0 cm³ of sodium hydroxide solution is neutralised by 20.0 cm³ of 0.100 mol/dm³ hydrochloric acid. NaOH + HCl → NaCl + H₂O. Find the concentration of the NaOH.",["Moles of HCl = 0.100 × 20.0/1000 = 0.00200 mol.","The ratio HCl : NaOH is 1 : 1, so moles of NaOH = 0.00200 mol.","Concentration = 0.00200 ÷ (25.0/1000) = 0.0800 mol/dm³."],"0.0800 mol/dm³"],
["Limiting reagent","2.4 g of magnesium is added to 100 cm³ of 1.0 mol/dm³ hydrochloric acid. Mg + 2HCl → MgCl₂ + H₂. Find which reagent is limiting and the volume of hydrogen formed. (Ar Mg = 24)",["Moles of Mg = 2.4 ÷ 24 = 0.10 mol.","Moles of HCl = 1.0 × 0.100 = 0.10 mol.","Mg needs 2 × 0.10 = 0.20 mol of HCl, but only 0.10 mol is present, so HCl is limiting.","Moles of H₂ = 0.10 ÷ 2 = 0.050 mol.","Volume = 0.050 × 24 = 1.2 dm³."],"HCl is limiting; 1.2 dm³ of H₂"],
["Percentage yield","10.0 g of calcium carbonate is heated and 4.8 g of calcium oxide is obtained. Find the percentage yield. (Mr CaCO₃ = 100, CaO = 56)",["Moles of CaCO₃ = 10.0 ÷ 100 = 0.100 mol.","Theoretical moles of CaO = 0.100, so the theoretical mass = 0.100 × 56 = 5.6 g.","Percentage yield = 4.8 ÷ 5.6 × 100 = 85.7%."],"85.7%"],
["Empirical formula","A hydrocarbon contains 80% carbon and 20% hydrogen by mass. Its Mr is 30. Find its empirical formula and molecular formula.",["Moles: C = 80 ÷ 12 = 6.67; H = 20 ÷ 1 = 20.","Divide by the smallest (6.67): C = 1; H = 3.","Empirical formula = CH₃ (mass 15).","Mr ÷ 15 = 30 ÷ 15 = 2, so the molecular formula is C₂H₆."],"CH₃; C₂H₆"]
],
mis:["Forgetting to divide by 1000 when converting cm³ to dm³.","Using the mass ratio instead of the mole ratio from the equation.","Using the equation without balancing it first.","Forgetting that diatomic elements (H₂, O₂, Cl₂) have Mr of 2 × Ar.","Using 24 dm³ for the volume of a solid or liquid. It only applies to gases at room temperature and pressure.","Rounding Ar or intermediate answers too early.","Using the first reagent to calculate the product when the other one is limiting."],
qs:[["Calculate the Mr of H₂SO₄.","2 × 1 + 32 + 4 × 16 = 98."],["How many moles are in 11 g of CO₂?","11 ÷ 44 = 0.25 mol."],["What volume does 0.10 mol of oxygen gas occupy at room temperature and pressure?","0.10 × 24 = 2.4 dm³."],["Find the concentration (mol/dm³) when 0.050 mol of solute is in 250 cm³ of solution.","0.050 ÷ 0.250 = 0.20 mol/dm³."]],
sum:["1 mol = 6.02 × 10²³ particles, with mass Mr (or Ar) in grams.","moles = mass ÷ Mr; gas volume = moles × 24 dm³; moles = concentration × volume (dm³).","Always use the mole ratio from the balanced equation.","The limiting reagent decides the amount of product.","Percentage yield = actual ÷ theoretical × 100%. Empirical formula: divide moles by the smallest."]
},
"chem-7":{
obj:["Define acids, bases and alkalis in terms of ions, and describe the pH scale and indicators.","Distinguish between strong and weak acids, and between concentrated and dilute solutions.","Write word and symbol equations for the reactions of acids with metals, bases and carbonates.","Write the ionic equation for neutralisation and classify oxides as acidic, basic, amphoteric or neutral."],
terms:[["Acid","A substance that produces hydrogen ions, H⁺, when dissolved in water."],["Base","A substance that neutralises an acid, such as a metal oxide or metal hydroxide."],["Alkali","A soluble base. It produces hydroxide ions, OH⁻, in water."],["pH","A number from 0 to 14 that shows how acidic or alkaline a solution is."],["Neutralisation","The reaction between an acid and a base to form a salt and water."],["Amphoteric oxide","An oxide that reacts with both acids and bases, such as Al₂O₃ and ZnO."]],
body:[
["h","1. Acids, bases and alkalis"],
["p","An **acid** produces hydrogen ions, H⁺, when dissolved in water. A **base** is a substance that can neutralise an acid. Most bases are metal oxides and metal hydroxides. An **alkali** is a base that dissolves in water, producing hydroxide ions, OH⁻. So all alkalis are bases, but only some bases (the soluble ones) are alkalis. Sodium hydroxide is an alkali, while copper(II) oxide is a base but not an alkali."],
["h","2. The pH scale and indicators"],
["p","The pH scale runs from 0 to 14. A pH below 7 is acidic, 7 is neutral and above 7 is alkaline. Each step of one pH unit means a tenfold change in the concentration of H⁺ ions. So a solution with pH 2 has 100 times more H⁺ than a solution with pH 4. Universal indicator turns red in strong acid, green at neutral and purple in strong alkali. Litmus is red in acid and blue in alkali."],
["tbl",[["Indicator","In acid","In alkali"],["Litmus","Red","Blue"],["Methyl orange","Red","Yellow"],["Phenolphthalein","Colourless","Pink"]]],
["h","3. Strong and weak acids"],
["p","A **strong acid** such as HCl, HNO₃ and H₂SO₄ ionises completely in water, so there is a high concentration of H⁺. A **weak acid** such as ethanoic acid only ionises partially, so it has a lower H⁺ concentration and a higher pH at the same concentration. Do not confuse this with concentrated and dilute, which tell you how much acid is dissolved in the solution."],
["warn","‘Strong’ and ‘concentrated’ do not mean the same thing. Strength is about how much the acid ionises; concentration is about how much acid is dissolved per dm³."],
["h","4. Reactions of acids"],
["ul",["**Acid + metal → salt + hydrogen.** Mg + 2HCl → MgCl₂ + H₂. Test hydrogen with a lighted splint: a ‘pop’.","**Acid + base (metal oxide or hydroxide) → salt + water.** CuO + H₂SO₄ → CuSO₄ + H₂O.","**Acid + carbonate → salt + water + carbon dioxide.** CaCO₃ + 2HNO₃ → Ca(NO₃)₂ + H₂O + CO₂. Test carbon dioxide with limewater: it turns milky."]],
["h","5. Neutralisation"],
["p","When an acid reacts with an alkali, the H⁺ ions from the acid combine with the OH⁻ ions from the alkali to form water. The salt’s ions stay in solution."],
["f","H⁺(aq) + OH⁻(aq) → H₂O(l)"],
["h","6. Classifying oxides"],
["tbl",[["Type of oxide","Examples","Behaviour"],["Acidic","CO₂, SO₂, P₄O₁₀ (non-metal oxides)","React with bases and alkalis to form salts"],["Basic","CaO, CuO, MgO (metal oxides)","React with acids to form salts"],["Amphoteric","Al₂O₃, ZnO","React with both acids and alkalis"],["Neutral","H₂O, CO, NO","React with neither"]]],
["tip","In an equation question, check that it is balanced and include state symbols: (s), (l), (g), (aq)."]
],
ex:[
["Predict the products","Write balanced equations for the reaction of (a) magnesium with hydrochloric acid, (b) copper(II) oxide with sulfuric acid, (c) calcium carbonate with nitric acid.",["(a) Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g).","(b) CuO(s) + H₂SO₄(aq) → CuSO₄(aq) + H₂O(l).","(c) CaCO₃(s) + 2HNO₃(aq) → Ca(NO₃)₂(aq) + H₂O(l) + CO₂(g)."],"See equations (a), (b) and (c)"],
["Ionic equation","Write the ionic equation for the reaction between hydrochloric acid and sodium hydroxide.",["Full equation: HCl + NaOH → NaCl + H₂O.","Ions that do not change (spectator ions): Na⁺ and Cl⁻.","H⁺(aq) + OH⁻(aq) → H₂O(l)."],"H⁺(aq) + OH⁻(aq) → H₂O(l)"],
["Comparing pH","How many times more H⁺ ions are in a solution of pH 2 compared with pH 4?",["The pH difference is 2 units.","Each unit is a factor of 10, so the factor is 10 × 10 = 100.","The pH 2 solution has 100 times as many H⁺ ions."],"100 times"],
["Strong vs weak","Explain why 0.1 mol/dm³ hydrochloric acid has a lower pH than 0.1 mol/dm³ ethanoic acid.",["Both have the same concentration of acid.","HCl is a strong acid and ionises completely, giving a high concentration of H⁺ ions.","Ethanoic acid is a weak acid and only partially ionises, giving a lower concentration of H⁺ ions.","A higher H⁺ concentration means a lower pH."],"HCl ionises completely; ethanoic acid only partially"],
["Test for the gas","A student adds a metal carbonate to dilute acid and bubbles gas through limewater. State what she sees and the gas.",["Effervescence (bubbles) is seen in the acid.","The limewater turns cloudy (milky).","The gas is carbon dioxide."],"The gas is CO₂ (limewater turns milky)"]
],
mis:["Saying ‘strong acid’ means ‘concentrated’. They are different ideas.","Mixing up bases and alkalis. An alkali is a soluble base.","Saying acid + carbonate gives hydrogen. It gives carbon dioxide.","Forgetting to balance the equation and give state symbols.","Writing the ionic equation without removing spectator ions.","Thinking that pH 0 means ‘no acid’. pH 0 is very strongly acidic.","Forgetting that universal indicator colours can differ in shade. Say the colour range, not an exact shade."],
qs:[["What ion is present in all acidic solutions?","Hydrogen ions, H⁺."],["What is the colour of methyl orange in an alkali?","Yellow."],["Write the word equation for zinc with sulfuric acid.","Zinc + sulfuric acid → zinc sulfate + hydrogen."],["Aluminium oxide reacts with both hydrochloric acid and sodium hydroxide. What type of oxide is it?","Amphoteric oxide."]],
sum:["Acids give H⁺ in water; alkalis give OH⁻ in water; bases neutralise acids.","pH < 7 acidic, 7 neutral, > 7 alkaline; each unit is a factor of 10.","Strong acids ionise completely; weak acids only partly. Strength is not the same as concentration.","Acid + metal → salt + H₂; acid + base → salt + water; acid + carbonate → salt + water + CO₂.","Neutralisation ionic equation: H⁺ + OH⁻ → H₂O."]
},
};

  for(var i=0;i<=60;i++){var x=-2+i*0.1,y=x*x-2*x-3;d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)+' '}
  var dot=function(x,y,l,dx,dy,a){return'<circle cx="'+X(x)+'" cy="'+Y(y)+'" r="4" fill="var(--ink)"/><text x="'+(X(x)+dx)+'" y="'+(Y(y)+dy)+'" font-size="11" text-anchor="'+(a||'start')+'" fill="var(--ink)">'+l+'</text>'};
