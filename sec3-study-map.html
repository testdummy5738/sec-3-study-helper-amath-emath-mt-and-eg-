<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sec 3 G3 Study Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EDF1F7; --grid:#DCE3EF; --card:#FFFFFF; --ink:#16203A; --ink2:#51607F; --line:#C5CFE2; --focus:#2547D0;
  --emath:#2F5BEA; --amath:#7A3FD1; --phy:#E06A1F; --chem:#0E9484; --eng:#CF2F4A; --chi:#B98A00;
  --display:'Bricolage Grotesque','Noto Sans SC',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11172A; --grid:#1B2440; --card:#1A2240; --ink:#E8ECF7; --ink2:#9AA7C7; --line:#2E3A5F; --focus:#8EA4FF;
    --emath:#6D8DFF; --amath:#A57BEF; --phy:#F28A47; --chem:#2CC4B1; --eng:#F2647C; --chi:#E2B72E;
  }
}
:root[data-theme="dark"]{
  --paper:#11172A; --grid:#1B2440; --card:#1A2240; --ink:#E8ECF7; --ink2:#9AA7C7; --line:#2E3A5F; --focus:#8EA4FF;
  --emath:#6D8DFF; --amath:#A57BEF; --phy:#F28A47; --chem:#2CC4B1; --eng:#F2647C; --chi:#E2B72E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;line-height:1.5;font-size:16px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.85rem}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:4px solid transparent;padding:8px 12px 6px;font-weight:700;color:var(--ink2);white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
.lede{max-width:56ch;color:var(--ink2);margin:10px 0 0}
.hero{padding:28px 0 18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border:2px solid var(--ink);display:inline-block}
.card{background:var(--card);border:2px solid var(--ink);padding:16px;box-shadow:4px 4px 0 var(--ink)}
.stack{display:grid;gap:18px}
.subjrow{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--c)}
.subjrow:hover{transform:translate(-1px,-1px)}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rowhead strong{font-family:var(--display);font-size:1.25rem}
.rowhead .pct{font-weight:700;color:var(--c)}
.rowhead small{color:var(--ink2)}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:22px;height:22px;border:2px solid var(--c);background:transparent;display:inline-block}
.cell.s1{background:color-mix(in srgb,var(--c) 30%,var(--card))}
.cell.s2{background:color-mix(in srgb,var(--c) 65%,var(--card))}
.cell.s3{background:var(--c)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.muted{color:var(--ink2)}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:8px 14px;font-weight:700}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
.chip{background:var(--card);border:2px solid var(--ink);padding:6px 12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.topic{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;margin-bottom:10px}
.topic .name{font-weight:700}
.topic .tools{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{background:var(--card);border:0;border-right:2px solid var(--ink);padding:6px 10px;font-size:.85rem;font-weight:700}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
@media (max-width:700px){.topic{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1;padding:8px 2px}}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input,select,textarea{background:var(--paper);border:2px solid var(--ink);padding:8px 10px;width:100%;border-radius:0}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.list{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.list li{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chartbox{overflow-x:auto;background:var(--card);border:2px solid var(--ink);padding:10px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:18px;border:2px solid var(--ink);background:var(--paper)}
.bar .fill{height:100%;background:var(--c)}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5rem);letter-spacing:-.02em;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.timer{box-shadow:4px 4px 0 var(--c)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-top:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
#mini{font-variant-numeric:tabular-nums}
a.btn{text-decoration:none;display:inline-block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;font-weight:700;display:none;z-index:20;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(10,14,30,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .card{max-width:560px;width:100%}
.note{font-size:.9rem;color:var(--ink2);margin-top:26px;max-width:70ch}
.warn{background:var(--card);border:2px solid #B3261E;padding:8px 12px;margin-top:12px;font-size:.9rem}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Sec 3 Study Map</b><span id="mini">G3 · Singapore</span></div>
  <nav aria-label="Sections" id="nav">
    <button data-a="tab" data-t="map">Map</button>
    <button data-a="tab" data-t="topics">Topics</button>
    <button data-a="tab" data-t="scores">Test scores</button>
    <button data-a="tab" data-t="time">Study time</button>
    <button data-a="tab" data-t="backup">Backup</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status"></div>
<div id="sheet"></div>

<script>
(function(){
'use strict';
var SUBJECTS=[
 {id:'emath',name:'E Math',c:'var(--emath)',topics:[
  'Quadratic equations: completing the square and formula','Fractional equations and graphical solutions','Graphs of quadratic functions and applications','Linear inequalities','Indices: laws, zero, negative and rational','Compound interest','Standard form','Coordinate geometry: gradient, length and equation of a line','Functions and graphs','Congruence and similarity','Sine and cosine of obtuse angles, area of triangle','Sine rule and cosine rule','Applications of trigonometry: bearings, elevation, 3D','Arc length, sector area and radian measure','Properties of circles']},
 {id:'amath',name:'A Math',c:'var(--amath)',topics:[
  'Surds','Quadratic functions','Quadratic equations: completing the square, formula, nature of roots','Simultaneous equations (linear and non-linear)','Quadratic inequalities','Polynomials','Partial fractions','Binomial theorem','Exponential and logarithmic functions','Coordinate geometry','Linear law','Trigonometric functions and identities (may be Sec 4)','Differentiation (may be Sec 4)']},
 {id:'phy',name:'Physics',c:'var(--phy)',topics:[
  'Measurement','Kinematics','Dynamics','Mass, weight and density','Turning effects of forces','Pressure','Energy, work and power','Kinetic particle model of matter','Thermal processes: conduction, convection, radiation','Waves (may be Sec 4)','Light (may be Sec 4)','Sound (may be Sec 4)','Electricity (may be Sec 4)','Magnetism and electromagnetism (may be Sec 4)']},
 {id:'chem',name:'Chemistry',c:'var(--chem)',topics:[
  'Experimental chemistry','Kinetic particle theory','Atomic structure','Chemical bonding','Structure and properties of materials','Chemical formulae and equations','Mole concept and stoichiometry','Acids and bases','Salts','Qualitative analysis','Periodic table (may be Sec 4)','Metals (may be Sec 4)','Air and atmosphere (may be Sec 4)','Energetics and rate of reaction (may be Sec 4)','Organic chemistry (may be Sec 4)']},
 {id:'eng',name:'English',c:'var(--eng)',topics:[
  'Situational writing: emails, letters and reports','Narrative and descriptive writing','Expository and argumentative writing','Reading comprehension: narrative','Reading comprehension: non-narrative and summary','Editing','Grammar: tenses and agreement','Vocabulary in context','Listening comprehension','Oral: reading aloud','Oral: stimulus-based conversation']},
 {id:'chi',name:'Chinese 华文',c:'var(--chi)',topics:[
  '应用文 (Functional writing and emails)','作文: 记叙文 (Narrative)','作文: 议论文 (Argumentative)','阅读理解 (Reading comprehension)','听力 (Listening)','语文应用 (Language use and grammar)','成语和词汇 (Idioms and vocabulary)','口试: 朗读 (Reading aloud)','口试: 口语交际 (Conversation)']}
];
var STATUS=['Not yet','Learning','Revising','Confident'];
var KEY='sec3-g3-tracker-v1';
var storageOk=true;
function blank(){return{v:2,status:{},custom:[],scores:[],sessions:[],timer:null}}
function migrate(b){if(b.v!==2){for(var k in b.status){if(/^[a-z]+-\d+$/.test(k))delete b.status[k]}b.v=2}return b}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);var b=blank();for(var k in b){if(s&&s[k]!==undefined)b[k]=s[k]}b.v=s?s.v:undefined;return migrate(b)}}catch(e){storageOk=false}
  return blank();
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}}
try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storageOk=false}

var ui={tab:'map',subj:'emath',filter:'all',scoreSubj:'all',confirmReset:false,exportText:''};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function subj(id){return SUBJECTS.filter(function(s){return s.id===id})[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return n<10?'0'+n:''+n}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dstr(new Date())}
function topicsFor(sid){
  var s=subj(sid);
  var base=s.topics.map(function(n,i){return{id:sid+'-'+i,name:n,custom:false}});
  var extra=state.custom.filter(function(t){return t.subject===sid}).map(function(t){return{id:t.id,name:t.name,custom:true}});
  return base.concat(extra);
}
function stat(sid){
  var ts=topicsFor(sid),sum=0,conf=0;
  ts.forEach(function(t){var v=state.status[t.id]||0;sum+=v;if(v===3)conf++});
  return{n:ts.length,conf:conf,pct:ts.length?Math.round(sum/(3*ts.length)*100):0};
}
function cells(sid){
  return topicsFor(sid).map(function(t){var v=state.status[t.id]||0;return'<span class="cell s'+v+'" title="'+esc(t.name)+': '+STATUS[v]+'"></span>'}).join('');
}
function weekMins(){
  var cut=new Date();cut.setDate(cut.getDate()-6);var c=dstr(cut);var out={};
  state.sessions.forEach(function(x){if(x.date>=c){out[x.subject]=(out[x.subject]||0)+x.mins}});
  return out;
}
function streak(){
  var days={};state.sessions.forEach(function(x){days[x.date]=1});
  var d=new Date(),n=0;
  if(!days[dstr(d)])d.setDate(d.getDate()-1);
  while(days[dstr(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function fmt(m){return m>=60?Math.floor(m/60)+'h '+(m%60?m%60+'m':''):m+'m'}
function subjOpts(sel,all){
  return(all?'<option value="all"'+(sel==='all'?' selected':'')+'>All subjects</option>':'')+SUBJECTS.map(function(s){return'<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+'</option>'}).join('');
}

function ytUrl(id){
  var sid=id.split('-')[0],s=subj(sid);
  var tp=topicsFor(sid).filter(function(t){return t.id===id})[0];
  var q=sid==='chi'?'华文 中学 新加坡 '+tp.name.split(' (')[0]:'Singapore Secondary 3 '+s.name+' '+tp.name;
  return'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
}
function elapsed(){var t=state.timer;if(!t)return 0;return t.acc+(t.running?Date.now()-t.startedAt:0)}
function clockText(){var s=Math.floor(elapsed()/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+pad(m):pad(m))+':'+pad(r)}
function updateMini(){var m=document.getElementById('mini');if(!m)return;m.textContent=state.timer?(state.timer.running?'Studying ':'Paused ')+clockText():'G3 · Singapore'}
function tick(){
  var c=document.getElementById('clock');if(c)c.textContent=clockText();
  updateMini();
  var t=state.timer;
  document.title=t&&t.running?clockText()+' Studying':'Sec 3 G3 Study Map';
  if(t&&t.running&&t.target&&!t.notified&&elapsed()>=t.target*60000){t.notified=true;save();toast('Goal reached: '+t.target+' minutes. Nice work!')}
}
function timerCard(){
  var t=state.timer,body;
  if(!t){
    body='<div class="fgrid"><label>Subject<select id="tsub">'+subjOpts('emath',false)+'</select></label><label>Goal<select id="ttar"><option value="0">No goal</option><option value="25">25 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option></select></label><button class="btn" data-a="tstart">Start timer</button></div>';
  }else{
    body='<p class="muted" style="margin:6px 0 12px">'+esc(subj(t.subject).name)+(t.target?', goal '+t.target+' minutes':'')+'</p><div class="btnrow">'+(t.running?'<button class="btn" data-a="tpause">Pause</button>':'<button class="btn" data-a="tresume">Resume</button>')+'<button class="btn alt" data-a="tfinish">Finish and save</button><button class="btn alt" data-a="tdiscard">Discard</button></div>';
  }
  return'<div class="card timer" style="margin-top:18px;--c:'+(t?subj(t.subject).c:'var(--ink)')+'"><h3>Study timer</h3><div class="clock" id="clock">'+clockText()+'</div>'+body+'<p class="note" style="margin-top:12px">The timer keeps counting if you switch tabs or close this page, as long as this browser keeps its saved data.</p></div>';
}

var views={
map:function(){
  var total=0,conf=0;SUBJECTS.forEach(function(s){var t=stat(s.id);total+=t.n;conf+=t.conf});
  var low=SUBJECTS.slice().sort(function(a,b){return stat(a.id).pct-stat(b.id).pct})[0];
  var next=topicsFor(low.id).filter(function(t){return(state.status[t.id]||0)<3})[0];
  var wk=weekMins(),wtot=0;for(var k in wk)wtot+=wk[k];
  var rows=SUBJECTS.map(function(s){var t=stat(s.id);
    return'<button class="subjrow" style="--c:'+s.c+'" data-a="open" data-id="'+s.id+'" aria-label="Open '+esc(s.name)+' topics">'+
    '<div class="rowhead"><strong>'+esc(s.name)+'</strong><span class="pct">'+t.pct+'% done</span><small>'+t.conf+' of '+t.n+' topics confident</small></div>'+
    '<div class="cells">'+cells(s.id)+'</div></button>'}).join('');
  var legend=[0,1,2,3].map(function(v){return'<span><i class="sw cell s'+v+'" style="--c:var(--emath);width:16px;height:16px;border-width:2px"></i>'+STATUS[v]+'</span>'}).join('');
  return'<section class="hero"><h1>Your Sec 3 study map</h1>'+
    '<p class="lede">Each square is one topic. The darker it gets, the more confident you are. You are confident in '+conf+' of '+total+' topics so far.</p>'+
    '<div class="legend">'+legend+'</div>'+
    (storageOk?'':'<div class="warn">This browser is blocking storage, so progress will be lost when you close the page. Use the Backup tab to save a copy.</div>')+
    '</section><div class="stack">'+rows+'</div>'+
    '<div class="cols"><div class="card"><h3>Start here next</h3><p class="muted">'+esc(low.name)+' has the most room to grow.</p>'+
    (next?'<p><b>'+esc(next.name)+'</b></p>':'<p>Every topic is marked confident. Nice work.</p>')+
    '<button class="btn" data-a="open" data-id="'+low.id+'">Open '+esc(low.name)+'</button></div>'+
    '<div class="card"><h3>Last 7 days</h3><p class="big">'+fmt(wtot)+'</p><p class="muted">Study streak: '+streak()+' day'+(streak()===1?'':'s')+'</p>'+
    '<button class="btn alt" data-a="tab" data-t="time">Log study time</button></div></div>'+
    '<p class="note">Topic lists are based on Sec 3 G3 schemes of work published by several Singapore secondary schools. Your school may teach topics in a different order, so check with your teacher and use Topics to add your own.</p>';
},
topics:function(){
  var s=subj(ui.subj),t=stat(s.id);
  var chips=SUBJECTS.map(function(x){return'<button class="chip" style="--c:'+x.c+'" aria-pressed="'+(x.id===ui.subj)+'" data-a="subj" data-id="'+x.id+'">'+esc(x.name)+'</button>'}).join('');
  var list=topicsFor(s.id).filter(function(tp){var v=state.status[tp.id]||0;return ui.filter==='all'||String(v)===ui.filter});
  var items=list.map(function(tp){var v=state.status[tp.id]||0;
    var seg=STATUS.map(function(l,i){return'<button aria-pressed="'+(i===v)+'" data-a="set" data-id="'+tp.id+'" data-v="'+i+'">'+l+'</button>'}).join('');
    return'<div class="topic" style="--c:'+s.c+'"><div class="name">'+esc(tp.name)+'</div><div class="seg" role="group" aria-label="Status for '+esc(tp.name)+'">'+seg+'</div>'+
    '<div class="tools"><a class="btn alt small" href="'+ytUrl(tp.id)+'" target="_blank" rel="noopener">Find videos on YouTube</a><button class="btn alt small" data-a="ask" data-id="'+tp.id+'">Copy a study prompt for Claude</button>'+
    (tp.custom?'<button class="btn alt small" data-a="deltopic" data-id="'+tp.id+'">Remove topic</button>':'')+'</div></div>'}).join('');
  return'<div class="hero" style="padding-bottom:0"><h2>Topics</h2><p class="lede">Set where you are on each topic. Topics marked "may be Sec 4" are taught later by some schools. Use the prompt button to get a lesson and practice questions from Claude.</p></div>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="toolbar"><div><b style="color:'+s.c+'">'+t.pct+'% done</b> <span class="muted">('+t.conf+' of '+t.n+' confident)</span></div>'+
    '<label style="display:flex;align-items:center;gap:8px">Show<select data-change="filter" style="width:auto"><option value="all"'+(ui.filter==='all'?' selected':'')+'>All topics</option>'+
    STATUS.map(function(l,i){return'<option value="'+i+'"'+(ui.filter===String(i)?' selected':'')+'>'+l+'</option>'}).join('')+'</select></label></div>'+
    (items||'<p class="muted">No topics with this status yet.</p>')+
    '<div class="card" style="margin-top:22px"><h3>Add a topic to '+esc(s.name)+'</h3><form class="grid" data-form="topic" style="margin-top:12px"><label>Topic name<input name="name" required maxlength="80"></label><button class="btn" type="submit">Add topic</button></form></div>';
},
scores:function(){
  var sel=ui.scoreSubj;
  var data=state.scores.filter(function(x){return sel==='all'||x.subject===sel}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var W=640,H=220,L=36,B=26,T=12,R=12;
  var dates=data.map(function(x){return x.date});
  var uniq=dates.filter(function(d,i){return dates.indexOf(d)===i});
  var xs=function(d){return uniq.length<2?(L+(W-L-R)/2):L+(W-L-R)*uniq.indexOf(d)/(uniq.length-1)};
  var ys=function(p){return T+(H-T-B)*(1-p/100)};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:420px" role="img" aria-label="Test scores over time">';
  [0,25,50,75,100].forEach(function(g){svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(g)+'" y2="'+ys(g)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(ys(g)+4)+'" text-anchor="end" font-size="11" fill="var(--ink2)">'+g+'</text>'});
  SUBJECTS.forEach(function(s){
    var pts=data.filter(function(x){return x.subject===s.id});if(!pts.length)return;
    var path=pts.map(function(x,i){return(i?'L':'M')+xs(x.date)+' '+ys(x.pct)}).join(' ');
    svg+='<path d="'+path+'" fill="none" stroke="'+s.c+'" stroke-width="3"/>';
    pts.forEach(function(x){svg+='<rect x="'+(xs(x.date)-5)+'" y="'+(ys(x.pct)-5)+'" width="10" height="10" fill="'+s.c+'" stroke="var(--ink)" stroke-width="2"><title>'+esc(s.name+' '+x.name+': '+x.pct+'%')+'</title></rect>'});
  });
  if(uniq.length){svg+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--ink2)">'+uniq[0]+'</text>';if(uniq.length>1)svg+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--ink2)">'+uniq[uniq.length-1]+'</text>'}
  svg+='</svg>';
  var rows=data.slice().reverse().map(function(x){var s=subj(x.subject);
    return'<li style="--c:'+s.c+'"><span><b>'+esc(x.name)+'</b> <span class="muted">'+esc(s.name)+', '+x.date+'</span></span><span><b>'+x.score+'/'+x.total+'</b> ('+x.pct+'%) <button class="btn alt small" data-a="delscore" data-id="'+x.id+'" aria-label="Delete score">Delete</button></span></li>'}).join('');
  var avg=data.length?Math.round(data.reduce(function(a,b){return a+b.pct},0)/data.length):null;
  return'<div class="hero" style="padding-bottom:0"><h2>Test scores</h2><p class="lede">Log every quiz, WA and prelim paper to see your trend by subject.</p></div>'+
    '<div class="card" style="margin-top:18px"><form class="grid" data-form="score"><label>Subject<select name="subject">'+subjOpts(sel==='all'?'emath':sel,false)+'</select></label>'+
    '<label>Test name<input name="name" required maxlength="60" placeholder="WA1 Paper 1"></label>'+
    '<label>Marks<input name="score" type="number" min="0" step="any" required></label><label>Out of<input name="total" type="number" min="1" step="any" required></label>'+
    '<label>Date<input name="date" type="date" value="'+today()+'" required></label><button class="btn" type="submit">Save score</button></form></div>'+
    '<div class="toolbar" style="margin-top:22px"><label style="display:flex;align-items:center;gap:8px">Chart<select data-change="scoresubj" style="width:auto">'+subjOpts(sel,true)+'</select></label>'+(avg!==null?'<span><b>Average '+avg+'%</b> <span class="muted">over '+data.length+' test'+(data.length===1?'':'s')+'</span></span>':'')+'</div>'+
    (data.length?'<div class="chartbox">'+svg+'</div><ul class="list">'+rows+'</ul>':'<p class="muted">No scores yet. Add your first test above.</p>');
},
time:function(){
  var wk=weekMins(),mx=Math.max.apply(null,[30].concat(SUBJECTS.map(function(s){return wk[s.id]||0})));
  var bars=SUBJECTS.map(function(s){var m=wk[s.id]||0;return'<div class="bar" style="--c:'+s.c+'"><span>'+esc(s.name)+'</span><div class="track"><div class="fill" style="width:'+Math.round(m/mx*100)+'%"></div></div><b>'+fmt(m)+'</b></div>'}).join('');
  var rows=state.sessions.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0}).slice(0,15).map(function(x){var s=subj(x.subject);
    return'<li style="--c:'+s.c+'"><span><b>'+esc(s.name)+'</b> <span class="muted">'+x.date+'</span></span><span><b>'+fmt(x.mins)+'</b> <button class="btn alt small" data-a="delsession" data-id="'+x.id+'" aria-label="Delete session">Delete</button></span></li>'}).join('');
  return'<div class="hero" style="padding-bottom:0"><h2>Study time</h2><p class="lede">Start the timer when you sit down to study. Finished sessions are saved here and count toward your streak.</p></div>'+timerCard()+
    '<div class="cols" style="margin-top:18px"><div class="card"><h3>Study streak</h3><p class="big">'+streak()+' day'+(streak()===1?'':'s')+'</p></div>'+
    '<div class="card"><h3>Add a session by hand</h3><form class="grid" data-form="session" style="margin-top:12px"><label>Subject<select name="subject">'+subjOpts('emath',false)+'</select></label>'+
    '<label>Minutes<input name="mins" type="number" min="5" max="600" step="5" value="30" required></label><label>Date<input name="date" type="date" value="'+today()+'" required></label><button class="btn" type="submit">Save session</button></form></div></div>'+
    '<h3 style="margin-top:26px">Last 7 days by subject</h3><div class="card bars" style="margin-top:10px">'+bars+'</div>'+
    (rows?'<h3 style="margin-top:26px">Recent sessions</h3><ul class="list">'+rows+'</ul>':'');
},
backup:function(){
  return'<div class="hero" style="padding-bottom:0"><h2>Backup</h2><p class="lede">Your progress is saved in this browser only. Copy the backup text somewhere safe to move it to another phone or computer.</p></div>'+
    '<div class="card" style="margin-top:18px"><h3>Export</h3><p class="muted">Creates text you can paste into a note or message to yourself.</p><button class="btn" data-a="export">Show backup text</button>'+
    (ui.exportText?'<textarea id="exp" readonly style="margin-top:12px">'+esc(ui.exportText)+'</textarea>':'')+'</div>'+
    '<div class="card" style="margin-top:18px"><h3>Import</h3><p class="muted">Paste backup text below. This replaces what is saved now.</p><textarea id="imp" placeholder="Paste backup text here"></textarea><div style="margin-top:10px"><button class="btn" data-a="import">Restore from backup</button></div></div>'+
    '<div class="card" style="margin-top:18px"><h3>Start over</h3><p class="muted">Deletes all progress, scores and study sessions from this browser.</p>'+
    (ui.confirmReset?'<button class="btn danger" data-a="reset">Tap again to delete everything</button> <button class="btn alt" data-a="cancelreset">Cancel</button>':'<button class="btn alt" data-a="reset">Delete all data</button>')+'</div>';
}};

function render(){
  document.getElementById('app').innerHTML=views[ui.tab]();
  updateMini();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){
    if(b.dataset.t===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
function go(tab){ui.tab=tab;render();window.scrollTo(0,0)}

function promptFor(id){
  var sid=id.split('-')[0];var s=subj(sid);var tp=topicsFor(sid).filter(function(t){return t.id===id})[0];
  var sname=s.name.replace(' 华文','');
  return'I am a Singapore Sec 3 G3 student studying '+sname+'. Teach me "'+tp.name+'" step by step in simple language, show 2 worked examples in the style of MOE exam questions, then give me 5 practice questions one at a time and mark my answers.';
}
function showSheet(text){
  var sh=document.getElementById('sheet');
  sh.innerHTML='<div class="sheet"><div class="card" role="dialog" aria-label="Study prompt"><h3>Copy this prompt into Claude</h3><textarea id="pt" readonly style="margin:12px 0">'+esc(text)+'</textarea><button class="btn" data-a="closesheet">Done</button></div></div>';
  var ta=document.getElementById('pt');ta.focus();ta.select();
}

var actions={
  tab:function(d){go(d.t)},
  tstart:function(){var s=document.getElementById('tsub'),g=document.getElementById('ttar');state.timer={subject:s.value,target:Number(g.value),acc:0,startedAt:Date.now(),running:true,notified:false};save();render();tick()},
  tpause:function(){var t=state.timer;if(!t||!t.running)return;t.acc+=Date.now()-t.startedAt;t.running=false;save();render();tick()},
  tresume:function(){var t=state.timer;if(!t||t.running)return;t.startedAt=Date.now();t.running=true;save();render();tick()},
  tfinish:function(){var t=state.timer;if(!t)return;var m=Math.round(elapsed()/60000);state.timer=null;if(m<1){toast('Under a minute, so nothing was saved.')}else{state.sessions.push({id:uid(),subject:t.subject,mins:m,date:today()});toast('Saved '+fmt(m)+' of '+subj(t.subject).name+'.')}save();render();tick()},
  tdiscard:function(){state.timer=null;save();render();tick()},
  open:function(d){ui.subj=d.id;ui.filter='all';go('topics')},
  subj:function(d){ui.subj=d.id;ui.filter='all';render()},
  set:function(d){state.status[d.id]=Number(d.v);save();render()},
  ask:function(d){var text=promptFor(d.id);
    try{navigator.clipboard.writeText(text).then(function(){toast('Prompt copied. Paste it into Claude.')},function(){showSheet(text)})}catch(e){showSheet(text)}},
  closesheet:function(){document.getElementById('sheet').innerHTML=''},
  deltopic:function(d){state.custom=state.custom.filter(function(t){return t.id!==d.id});delete state.status[d.id];save();render()},
  delscore:function(d){state.scores=state.scores.filter(function(x){return x.id!==d.id});save();render()},
  delsession:function(d){state.sessions=state.sessions.filter(function(x){return x.id!==d.id});save();render()},
  export:function(){ui.exportText=JSON.stringify(state);render();var e=document.getElementById('exp');if(e){e.focus();e.select()}},
  import:function(){
    var v=document.getElementById('imp').value.trim();
    try{var o=JSON.parse(v);if(!o||typeof o!=='object'||Array.isArray(o)||typeof o.status!=='object')throw 0;
      var b=blank();for(var k in b){if(o[k]!==undefined&&typeof o[k]===typeof b[k])b[k]=o[k]}
      b.v=o.v;b=migrate(b);state=b;save();ui.exportText='';toast('Backup restored.');go('map')}
    catch(e){toast('That text is not a valid backup.')}
  },
  reset:function(){if(!ui.confirmReset){ui.confirmReset=true;render();return}state=blank();save();ui.confirmReset=false;ui.exportText='';toast('All data deleted.');go('map')},
  cancelreset:function(){ui.confirmReset=false;render()}
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b&&actions[b.dataset.a])actions[b.dataset.a](b.dataset)});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.change)return;
  if(t.dataset.change==='filter'){ui.filter=t.value;render()}
  if(t.dataset.change==='scoresubj'){ui.scoreSubj=t.value;render()}
});
var forms={
  topic:function(f){var n=String(f.get('name')).trim();if(!n)return;state.custom.push({id:'c-'+uid(),subject:ui.subj,name:n});
    state.custom[state.custom.length-1].id=ui.subj+'-c'+uid();save();render();toast('Topic added.')},
  score:function(f){var sc=Number(f.get('score')),tt=Number(f.get('total'));
    if(!(tt>0)||sc<0||sc>tt){toast('Marks must be between 0 and the total.');return}
    state.scores.push({id:uid(),subject:f.get('subject'),name:String(f.get('name')).trim(),score:sc,total:tt,pct:Math.round(sc/tt*100),date:f.get('date')});
    save();render();toast('Score saved.')},
  session:function(f){var m=Math.round(Number(f.get('mins')));if(!(m>0))return;
    state.sessions.push({id:uid(),subject:f.get('subject'),mins:m,date:f.get('date')});save();render();toast('Session saved.')}
};
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();forms[f.dataset.form](new FormData(f))});
render();
tick();
setInterval(tick,1000);
})();
</script>
</body>
</html>
