<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EDF1F7; --grid:#DCE3EF; --card:#FFFFFF; --ink:#16203A; --ink2:#51607F; --line:#C5CFE2; --focus:#2547D0;
  --emath:#2F5BEA; --amath:#7A3FD1; --phy:#E06A1F; --chem:#0E9484; --eng:#CF2F4A; --chi:#B98A00;
  --display:'Bricolage Grotesque','Noto Sans SC',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11172A; --grid:#1B2440; --card:#1A2240; --ink:#E8ECF7; --ink2:#9AA7C7; --line:#2E3A5F; --focus:#8EA4FF;
    --emath:#6D8DFF; --amath:#A57BEF; --phy:#F28A47; --chem:#2CC4B1; --eng:#F2647C; --chi:#E2B72E;
  }
}
:root[data-theme="dark"]{
  --paper:#11172A; --grid:#1B2440; --card:#1A2240; --ink:#E8ECF7; --ink2:#9AA7C7; --line:#2E3A5F; --focus:#8EA4FF;
  --emath:#6D8DFF; --amath:#A57BEF; --phy:#F28A47; --chem:#2CC4B1; --eng:#F2647C; --chi:#E2B72E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;line-height:1.5;font-size:16px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.85rem}
.navrow{display:flex;align-items:stretch;gap:6px}
nav{display:flex;gap:2px;overflow-x:auto;position:relative;flex:1;min-width:0;scrollbar-width:thin;scrollbar-color:var(--ink2) transparent;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{height:6px}
nav::-webkit-scrollbar-thumb{background:var(--ink2)}
nav::-webkit-scrollbar-track{background:transparent}
.navarrow{flex:none;width:34px;background:var(--card);border:2px solid var(--ink);font-weight:800;font-size:1.3rem;line-height:1;margin-bottom:8px;padding:0}
.navarrow:disabled{opacity:.3;cursor:default}
nav button{flex:none;background:none;border:0;border-bottom:4px solid transparent;padding:8px 12px 6px;font-weight:700;color:var(--ink2);white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
.lede{max-width:56ch;color:var(--ink2);margin:10px 0 0}
.hero{padding:28px 0 18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border:2px solid var(--ink);display:inline-block}
.card{background:var(--card);border:2px solid var(--ink);padding:16px;box-shadow:4px 4px 0 var(--ink)}
.stack{display:grid;gap:18px}
.subjrow{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--c)}
.subjrow:hover{transform:translate(-1px,-1px)}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rowhead strong{font-family:var(--display);font-size:1.25rem}
.rowhead .pct{font-weight:700;color:var(--c)}
.rowhead small{color:var(--ink2)}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:22px;height:22px;border:2px solid var(--c);background:transparent;display:inline-block}
.cell.s1{background:color-mix(in srgb,var(--c) 30%,var(--card))}
.cell.s2{background:color-mix(in srgb,var(--c) 65%,var(--card))}
.cell.s3{background:var(--c)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.muted{color:var(--ink2)}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:8px 14px;font-weight:700}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
.chip{background:var(--card);border:2px solid var(--ink);padding:6px 12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.topic{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;margin-bottom:10px}
.topic .name{font-weight:700}
.topic .tools{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{background:var(--card);border:0;border-right:2px solid var(--ink);padding:6px 10px;font-size:.85rem;font-weight:700}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
@media (max-width:700px){.topic{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1;padding:8px 2px}}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input,select,textarea{background:var(--paper);border:2px solid var(--ink);padding:8px 10px;width:100%;border-radius:0}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.list{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.list li{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chartbox{overflow-x:auto;background:var(--card);border:2px solid var(--ink);padding:10px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:18px;border:2px solid var(--ink);background:var(--paper)}
.bar .fill{height:100%;background:var(--c)}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5rem);letter-spacing:-.02em;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.timer{box-shadow:4px 4px 0 var(--c)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-top:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
#mini{font-variant-numeric:tabular-nums}
a.btn{text-decoration:none;display:inline-block}
.vframe{border:2px solid var(--ink);background:#000;margin:0 auto;max-width:100%;box-shadow:4px 4px 0 var(--ink)}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vframe.tt{width:340px;height:min(740px,80vh)}
.vframe.yt{width:100%;aspect-ratio:16/9}
.bframe{width:100%;height:70vh;border:2px solid var(--ink);background:#fff;display:block;margin-top:12px}
a.lnk{color:var(--ink);font-weight:700}
.vres{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.vcard{background:var(--card);border:2px solid var(--ink);padding:10px;display:grid;gap:6px;align-content:start}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--ink);background:#000}
.vcard b{font-size:.95rem;line-height:1.25}
.setup ol{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.setup li{margin:3px 0}
.ch h4{font-family:var(--display);font-size:1.15rem;margin:22px 0 6px}
.ch p{margin:8px 0;line-height:1.7;max-width:72ch}
.ch ul,.ch ol{margin:8px 0 8px 22px;padding:0;line-height:1.65}
.ch li{margin-bottom:5px}
.fbox{border:2px solid var(--ink);border-left:10px solid var(--c);background:var(--paper);padding:10px 14px;margin:12px 0;font-weight:700;font-size:1.02rem;line-height:1.75;overflow-x:auto}
.callout{border:2px solid var(--ink);padding:10px 14px;margin:12px 0;background:var(--card);line-height:1.6}
.callout.tip{border-color:var(--c)}
.callout.warn{border-color:#B3261E}
.exb{border:2px solid var(--ink);background:var(--card);margin:14px 0;padding:12px 14px;box-shadow:4px 4px 0 var(--c)}
.exb summary{cursor:pointer;font-weight:700;margin-top:8px}
.exb ol{margin:8px 0 8px 22px}
.ans{background:var(--paper);border-left:6px solid var(--c);padding:6px 10px;margin-top:8px;font-weight:700}
.terms{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;margin:8px 0}
.terms dt{font-weight:700}.terms dd{margin:0}
@media (max-width:600px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:6px}}
table.tb{border-collapse:collapse;margin:10px 0;min-width:60%}
table.tb th,table.tb td{border:2px solid var(--ink);padding:6px 10px;text-align:left;vertical-align:top}
table.tb th{background:var(--paper)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border:2px solid var(--c);color:var(--c);padding:0 6px;margin-left:6px;vertical-align:middle}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;font-weight:700;display:none;z-index:20;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(10,14,30,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .card{max-width:560px;width:100%}
.note{font-size:.9rem;color:var(--ink2);margin-top:26px;max-width:70ch}
.warn{background:var(--card);border:2px solid #B3261E;padding:8px 12px;margin-top:12px;font-size:.9rem}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.vocab-item{background:var(--paper);border:2px solid var(--ink);padding:10px 12px}
.quiz-card{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:16px;margin-bottom:16px}
.quiz-options{display:grid;gap:8px;margin-top:10px}
.quiz-opt{background:var(--paper);border:2px solid var(--ink);padding:8px 12px;text-align:left;font-weight:700}
.quiz-opt:hover{background:color-mix(in srgb,var(--c) 15%,var(--paper))}
.quiz-opt.correct{background:#2E7D32;color:#fff;border-color:#2E7D32}
.quiz-opt.wrong{background:#B3261E;color:#fff;border-color:#B3261E}
.kb{background:#fff;color:#1e293b;line-height:1.65;border-left:10px solid var(--emath);overflow-wrap:anywhere}
.kb h4{font-size:1.15rem;margin:20px 0 10px;color:#334155}
.kb p,.kb ul,.kb ol{margin:0 0 14px}
.kb ul{padding-left:24px;list-style:disc}.kb ol{padding-left:24px;list-style:decimal}.kb li{margin-bottom:6px}
.kb strong{color:#0f172a}
.kb .box-example,.kb .box-trap,.kb .box-tip{padding:14px 16px;margin:18px 0;border-left:4px solid #3b82f6;background:#f8fafc;border-radius:0 6px 6px 0}
.kb .box-trap{background:#fff1f2;border-left-color:#f43f5e}.kb .box-tip{background:#f0fdf4;border-left-color:#22c55e}
.kb .badge{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-bottom:8px}
.kb .badge-trap{background:#ffe4e6;color:#e11d48}.kb .badge-tip{background:#dcfce7;color:#15803d}.kb .badge-example{background:#dbeafe;color:#1d4ed8}
.kb table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.95rem;display:block;overflow-x:auto}
.kb th,.kb td{border:1px solid #e2e8f0;padding:8px 12px;text-align:left}.kb th{background:#f1f5f9;color:#334155}
.kb .svg-container{display:flex;justify-content:center;margin:20px 0;overflow-x:auto}
.kb svg{background:#fff;border:1px solid #e2e8f0;border-radius:6px;max-width:100%;height:auto}
.kb mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
input[type=range]{padding:0;border:0;background:none}
@keyframes blink{50%{opacity:0}}
.ccur{display:inline-block;height:1em;border-left:2px solid var(--ink);vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
#calc{position:fixed;width:264px;z-index:25;background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
#calc[hidden]{display:none}
#calch{cursor:move;touch-action:none;user-select:none;background:var(--ink);color:var(--paper);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
#calch button{background:none;border:0;color:inherit;font-weight:700;padding:2px 6px}
#cdisp{padding:8px 10px;text-align:right;min-height:64px;overflow:hidden}
#cexp{color:var(--ink2);font-size:.85rem;word-break:break-all;min-height:1.2em}
#cres{font-family:var(--display);font-size:1.7rem;font-weight:800}
#ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px 8px}
#ckeys button{background:var(--paper);border:2px solid var(--ink);padding:8px 0;font-weight:700;font-size:.8rem}
#calcbtn{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Sec 3 Study Map</b><span id="mini">G3 · Singapore</span></div>
  <div class="navrow"><button class="navarrow" id="navL" type="button" aria-label="Scroll tabs left">&#8249;</button><nav aria-label="Sections" id="nav">

  </nav><button class="navarrow" id="navR" type="button" aria-label="Scroll tabs right">&#8250;</button></div>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status"></div>
<div id="sheet"></div>

var storageOk=true;
function blank(){return{v:4,status:{},custom:[],scores:[],sessions:[],topicQuizAnswers:{},videos:[],timer:null}}
function migrate(b){
  if(!(b.v>=4)){
    var map={0:1,1:0,2:0,3:0,4:0,5:2,6:2,7:3,8:4,9:6,11:5},ns={},k,m,t;
    for(k in (b.status||{})){m=k.match(/^amath-(\d+)$/);
      if(m){t=map[m[1]];if(t!==undefined)ns['amath-'+t]=Math.max(ns['amath-'+t]||0,b.status[k])}
      else ns[k]=b.status[k]}
    b.status=ns;
    if(b.topicQuizAnswers){for(k in b.topicQuizAnswers){if(/^amath-\d+-/.test(k))delete b.topicQuizAnswers[k]}}
    b.v=4;
  }
  return b;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);var b=blank();for(var k in b){if(s&&s[k]!==undefined)b[k]=s[k]}b.v=s?s.v:undefined;return migrate(b)}}catch(e){storageOk=false}
  return blank();
}
var state=load();
function save(){cloudSoon();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}}
try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storageOk=false}

var ui={tab:'map',subj:'emath',filter:'all',scoreSubj:'all',activeTopicId:null,confirmReset:false,exportText:''};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function subj(id){return SUBJECTS.filter(function(s){return s.id===id})[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return n<10?'0'+n:''+n}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dstr(new Date())}
function topicsFor(sid){
  var s=subj(sid);
  if(!s) return [];
  var base=s.topics.map(function(n,i){return{id:sid+'-'+i,name:n,custom:false}});
  var extra=state.custom.filter(function(t){return t.subject===sid}).map(function(t){return{id:t.id,name:t.name,custom:true}});
  return base.concat(extra);
}
function allTopicsList(){
  var list=[];
  SUBJECTS.forEach(function(s){list=list.concat(topicsFor(s.id))});
  return list;
}
function findTopic(id){
  if(!id) return {id:'emath-0',name:'Topic',custom:false};
  var ts=allTopicsList();
  for(var i=0;i<ts.length;i++){if(ts[i].id===id)return ts[i];}
  return {id:id,name:'Topic Study Hub',custom:false};
}

"emath-0":{
obj:["Recognise a quadratic equation and write it in the standard form ax² + bx + c = 0.","Solve quadratic equations by factorisation, by completing the square and by the quadratic formula.","Use the discriminant b² − 4ac to know whether real solutions exist.","Choose the quickest method for a given question.","Form quadratic equations from word problems and reject answers that do not make sense."],
terms:[["Quadratic equation","An equation whose highest power of the unknown is 2, such as x² − 5x + 6 = 0."],["Root (solution)","A value of x that makes the equation true."],["Coefficient","The number multiplying a letter. In 3x² + x − 12 = 0 the coefficients are 3, 1 and −12 (−12 is the constant term)."],["Factorise","Write an expression as a product of brackets, for example x² − 5x + 6 = (x − 2)(x − 3)."],["Completing the square","Rewriting x² + bx + c as (x + p)² + q."],["Discriminant","The quantity b² − 4ac. It decides how many real roots the equation has."]],
body:[
["h","1. What is a quadratic equation?"],
["p","A **quadratic equation** contains an unknown whose highest power is 2. Every quadratic equation can be rearranged into the **standard form** ax² + bx + c = 0, where a, b and c are numbers and a ≠ 0. If a were 0 the x² term would vanish and the equation would only be linear."],
["p","For example, 3x² = 12 − x is rearranged to 3x² + x − 12 = 0, so a = 3, b = 1 and c = −12. Always move every term to one side so that the other side is exactly 0. Almost every method below depends on that zero."],
["p","A quadratic equation can have up to two solutions, because the graph of y = ax² + bx + c is a U-shaped curve that can cross the x-axis at two points. The solutions are the x-values where the curve meets the axis, which is why they are also called roots."],
["h","2. Method 1: factorisation"],
["p","Factorisation relies on the **zero product rule**: if two numbers multiply to give 0, at least one of them must be 0."],
["f","If A × B = 0, then A = 0 or B = 0"],
["p","To use it, factorise the quadratic into two brackets, set each bracket equal to 0, and solve two simple linear equations. When a = 1, look for two numbers that multiply to give c and add to give b. For x² − 5x + 6 = 0, the numbers −2 and −3 multiply to 6 and add to −5, so (x − 2)(x − 3) = 0 and x = 2 or x = 3."],
["p","When a is not 1, find two numbers that multiply to give a × c and add to give b, split the middle term, then factorise by grouping. For 6x² + x − 2 = 0: a × c = −12, and 4 and −3 multiply to −12 and add to 1. So 6x² + 4x − 3x − 2 = 2x(3x + 2) − 1(3x + 2) = (2x − 1)(3x + 2), giving x = 1/2 or x = −2/3."],
["warn","The zero product rule only works when one side is 0. If (x − 3)(x + 2) = 6 you cannot say x − 3 = 6 or x + 2 = 6. Expand, move 6 across and start again."],
["h","3. Method 2: completing the square"],
["p","Completing the square turns a quadratic into a perfect square plus or minus a number. The idea comes from the identity (x + p)² = x² + 2px + p². To turn x² + bx into a perfect square you need to add the square of half the coefficient of x."],
["f","x² + bx = (x + b/2)² − (b/2)²"],
["p","Here is the method for x² + 6x + 1 = 0. Half of 6 is 3, so x² + 6x = (x + 3)² − 9. The equation becomes (x + 3)² − 9 + 1 = 0, so (x + 3)² = 8, x + 3 = ±√8 and x = −3 ± √8. That is x = −0.17 or x = −5.83 to 2 decimal places."],
["p","If a is not 1, first take out the factor a from the x² and x terms. The form (x + p)² + q also reveals the **turning point** of the curve y = x² + bx + c, which is (−p, q). That is why completing the square also appears in graph questions."],
["h","4. Method 3: the quadratic formula"],
["p","The formula comes from completing the square on the general equation. Divide ax² + bx + c = 0 by a to get x² + (b/a)x + c/a = 0. Completing the square gives (x + b/2a)² = (b² − 4ac)/4a². Taking square roots gives the formula below, which therefore works for every quadratic equation."],
["f","x = [−b ± √(b² − 4ac)] ÷ 2a"],
["p","The expression b² − 4ac under the square root is the **discriminant**. If it is positive there are two different real roots, if it is 0 there is exactly one repeated root, and if it is negative there is no real root because you cannot take the square root of a negative number. Check the discriminant first when a question says ‘show that there are no real roots’."],
["warn","Put brackets around negative values when you substitute. For b = −7, write (−7)² = 49 and −b = 7. Writing −7² gives −49 and ruins the answer."],
["h","5. Choosing a method"],
["tbl",[["Situation","Best method"],["Whole-number factors are easy to spot","Factorisation"],["Question says ‘give your answer to 2 decimal places’ or ‘leave in surd form’","Quadratic formula"],["Question says ‘express in the form (x + p)² + q’, or asks for the minimum point","Completing the square"],["You are not sure it factorises","Check b² − 4ac. If it is a perfect square it factorises; otherwise use the formula"]]],
["h","6. Word problems"],
["ol",["Let x stand for the unknown and say what it represents, with units.","Use the information to write an equation.","Rearrange to standard form and solve.","Reject any answer that does not make sense, such as a negative length or a non-integer number of people.","Answer the actual question in a sentence."]]
],
ex:[
["Factorisation with a ≠ 1","Solve 2x² − 5x − 12 = 0.",["a × c = −24. We need two numbers that multiply to −24 and add to −5: they are −8 and 3.","Split the middle term: 2x² − 8x + 3x − 12 = 0.","Group: 2x(x − 4) + 3(x − 4) = 0, so (2x + 3)(x − 4) = 0.","Set each bracket to 0: x = −3/2 or x = 4.","Check x = 4: 2(16) − 20 − 12 = 0. ✓"],"x = −1.5 or x = 4"],
["Quadratic formula","Solve 3x² − 7x + 1 = 0, giving your answers correct to 2 decimal places.",["a = 3, b = −7, c = 1.","b² − 4ac = (−7)² − 4(3)(1) = 49 − 12 = 37.","x = [7 ± √37] ÷ 6 and √37 = 6.0828 (keep the full calculator value).","x = 13.0828 ÷ 6 = 2.18 or x = 0.9172 ÷ 6 = 0.15."],"x = 2.18 or x = 0.15"],
["Completing the square","Express x² − 8x + 3 in the form (x − p)² + q. Hence solve x² − 8x + 3 = 0 and state the minimum value of x² − 8x + 3.",["Half of −8 is −4, so x² − 8x = (x − 4)² − 16.","x² − 8x + 3 = (x − 4)² − 16 + 3 = (x − 4)² − 13.","Solve: (x − 4)² = 13, so x − 4 = ±√13 and x = 4 ± 3.6056.","x = 7.61 or x = 0.39 (2 d.p.).","Since (x − 4)² ≥ 0, the smallest value of the expression is −13, reached when x = 4."],"(x − 4)² − 13; x = 7.61 or 0.39; minimum value −13"],
["Rearrange first","Solve (2x − 1)(x + 3) = 5, giving answers to 2 decimal places.",["Expand: 2x² + 6x − x − 3 = 2x² + 5x − 3.","Set the equation equal to 5: 2x² + 5x − 3 = 5, so 2x² + 5x − 8 = 0.","a = 2, b = 5, c = −8: b² − 4ac = 25 + 64 = 89, √89 = 9.4340.","x = (−5 + 9.4340) ÷ 4 = 1.11 or x = (−5 − 9.4340) ÷ 4 = −3.61."],"x = 1.11 or x = −3.61"],
["Word problem","A rectangular garden is 3 m longer than it is wide. Its area is 40 m². Find its width and length.",["Let the width be w metres. The length is (w + 3) metres.","Area: w(w + 3) = 40, so w² + 3w − 40 = 0.","Factorise: (w + 8)(w − 5) = 0, so w = −8 or w = 5.","A width cannot be negative, so reject w = −8.","Width = 5 m, length = 8 m. Check: 5 × 8 = 40. ✓"],"Width 5 m, length 8 m"]
],
mis:["Setting each bracket equal to the non-zero number, for example (x − 3)(x + 2) = 6 so x − 3 = 6. Always make one side 0 first.","Dividing both sides by x. For x² = 5x this loses the answer x = 0. Move everything to one side and factorise: x(x − 5) = 0.","Losing the second root by forgetting the ± sign in the formula or when taking square roots.","Writing −7² instead of (−7)² when b is negative.","Forgetting to subtract (b/2)² when completing the square.","Rounding in the middle of the working. Keep the full calculator value until the last line.","Not rejecting impossible answers in word problems, such as a negative length."],
qs:[["Solve x² − 7x + 12 = 0.","(x − 3)(x − 4) = 0, so x = 3 or x = 4."],["Solve 2x² + x − 10 = 0 by factorisation.","a × c = −20, and 5 and −4 multiply to −20 and add to 1. 2x² + 5x − 4x − 10 = x(2x + 5) − 2(2x + 5) = (2x + 5)(x − 2). So x = −5/2 or x = 2."],["Solve x² − 4x − 3 = 0, giving answers to 2 decimal places.","b² − 4ac = 16 + 12 = 28, √28 = 5.2915. x = (4 + 5.2915)/2 = 4.65 or x = (4 − 5.2915)/2 = −0.65."],["Express x² + 10x + 7 in the form (x + p)² + q. State the minimum value.","(x + 5)² − 25 + 7 = (x + 5)² − 18. Minimum value −18 at x = −5."],["The product of two consecutive positive integers is 156. Find them.","n(n + 1) = 156 → n² + n − 156 = 0 → (n + 13)(n − 12) = 0. n = 12 (reject −13). The integers are 12 and 13."]],
sum:["Standard form is ax² + bx + c = 0, and one side must be 0 before you factorise.","Factorisation uses the zero product rule. Completing the square uses x² + bx = (x + b/2)² − (b/2)². The formula works every time.","The discriminant b² − 4ac tells you if there are two, one or no real roots.","Keep exact values until the end, then round as instructed.","In word problems, define x, form the equation, solve, then reject impossible answers."]
},

terms:[["Parabola","The U-shaped (or ∩-shaped) curve that is the graph of a quadratic function."],["Axis of symmetry","The vertical line through the turning point that splits the parabola into two mirror-image halves."],["Turning point (vertex)","The lowest point of a U-shaped curve (minimum) or the highest point of a ∩-shaped curve (maximum)."],["Intercept","A point where the graph crosses an axis. The x-intercepts are the roots of the equation y = 0."]],
body:[
["h","1. The shape of the graph"],
["p","The graph of y = ax² + bx + c is a **parabola**. The sign of a decides which way it opens. If a > 0 the curve opens upwards and has a lowest point (a **minimum**). If a < 0 it opens downwards and has a highest point (a **maximum**). The larger the size of a, the narrower the parabola."],
["svg","parabola"],
["p","The graph above is y = x² − 2x − 3. It opens upwards because a = 1 is positive. It crosses the x-axis at x = −1 and x = 3, crosses the y-axis at y = −3, and has its turning point at (1, −4)."],
["h","2. Key features and how to find them"],
["tbl",[["Feature","How to find it"],["y-intercept","Put x = 0. The answer is c."],["x-intercepts","Put y = 0 and solve ax² + bx + c = 0 by factorising or by the formula."],["Axis of symmetry","x = −b ÷ 2a. It also lies exactly halfway between the two x-intercepts."],["Turning point","Substitute the axis value into the equation to get y. Or complete the square: y = a(x − p)² + q has turning point (p, q)."],["Number of x-intercepts","Two if b² − 4ac > 0, one (the curve just touches) if it equals 0, none if it is negative."]]],
["f","y = a(x − p)² + q  →  turning point (p, q), axis x = p"],
["p","The completed-square form is very useful because (x − p)² can never be negative. If a > 0 the smallest value of y is q, reached when x = p. If a < 0 the largest value of y is q."],
["h","3. Drawing a graph from a table of values"],
["p","Choose several x-values on either side of the axis of symmetry, work out y for each, plot the points and join them with a smooth curve (not straight line segments). For y = x² − 2x − 3, the points are (−2, 5), (−1, 0), (0, −3), (1, −4), (2, −3), (3, 0) and (4, 5). Notice the y-values repeat symmetrically around x = 1."],
["tip","In a sketch, label the intercepts, the turning point and the axis of symmetry. Draw a smooth curve that bends gradually at the turning point, not a pointed V."],
["h","4. Solving equations using a graph"],
["p","The roots of ax² + bx + c = 0 are where the graph meets the line y = 0 (the x-axis). To solve ax² + bx + c = k, draw the horizontal line y = k on the same axes and read off the x-values where the curve and the line cross. For a more complicated equation, rearrange it until one side matches the graph you already have, and the other side becomes the line to draw."],
["h","5. Finding the equation from a graph"],
["p","If you know the x-intercepts p and q, write y = a(x − p)(x − q). Then use another point, usually the y-intercept, to find a. If you know the turning point (h, k), write y = a(x − h)² + k and use another point to find a."]
],
ex:[
["Key features","For y = x² − 2x − 3, find the intercepts, the equation of the axis of symmetry and the turning point.",["y-intercept: x = 0 gives y = −3.","x-intercepts: x² − 2x − 3 = 0 → (x − 3)(x + 1) = 0 → x = 3 or x = −1.","Axis of symmetry: halfway between −1 and 3, so x = 1. (Check: −b ÷ 2a = 2 ÷ 2 = 1.)","Turning point: y = 1 − 2 − 3 = −4, so (1, −4). It is a minimum because a > 0."],"y-intercept −3; x-intercepts −1 and 3; axis x = 1; turning point (1, −4)"],
["A downward parabola","For y = −x² + 4x + 5, find the maximum value of y and the x-intercepts.",["Complete the square: y = −(x² − 4x) + 5 = −[(x − 2)² − 4] + 5 = −(x − 2)² + 9.","Turning point (2, 9). Since a < 0 this is a maximum, so the maximum value of y is 9.","x-intercepts: −x² + 4x + 5 = 0 → x² − 4x − 5 = 0 → (x − 5)(x + 1) = 0 → x = 5 or x = −1."],"Maximum value 9 at x = 2; x-intercepts −1 and 5"],
["Solving with a graph","The graph of y = x² − 2x − 3 is drawn. By drawing a suitable line, solve x² − 2x − 3 = 2.",["The equation says the curve’s y-value equals 2, so draw the line y = 2.","Read the x-values where the line meets the curve. Check algebraically: x² − 2x − 5 = 0.","x = [2 ± √(4 + 20)] ÷ 2 = 1 ± √6 = 1 ± 2.449.","x = 3.45 or x = −1.45 (2 d.p.)."],"x = 3.45 or x = −1.45"],
["A real situation","A ball is thrown up. Its height after t seconds is h = 20t − 5t² metres. Find when it hits the ground and its greatest height.",["h = 5t(4 − t). The ball is at ground level when h = 0: t = 0 (launch) or t = 4.","It hits the ground after 4 s.","The turning point is halfway: t = 2 s.","h = 20(2) − 5(4) = 40 − 20 = 20."],"It lands after 4 s; greatest height 20 m (at t = 2 s)"],
["Finding the equation","A parabola crosses the x-axis at x = −2 and x = 3 and passes through (0, −12). Find its equation.",["Write y = a(x + 2)(x − 3).","Substitute (0, −12): −12 = a(2)(−3) = −6a, so a = 2.","y = 2(x + 2)(x − 3) = 2(x² − x − 6) = 2x² − 2x − 12."],"y = 2x² − 2x − 12"]
],
mis:["Joining plotted points with straight lines instead of a smooth curve.","Using the wrong sign when finding the axis: it is x = −b ÷ 2a, so for y = x² − 6x + 1 the axis is x = +3.","Giving the minimum point as (p, −q) from y = (x − p)² + q. The turning point of y = (x − 3)² + 5 is (3, 5), not (−3, 5).","Forgetting that a negative a gives a maximum, not a minimum.","Reading the value of x when the question asks for the value of y at the turning point."],
qs:[["State whether y = 3 − 2x² has a maximum or a minimum, and find its value.","a = −2 is negative so it has a maximum. The maximum value is 3, at x = 0."],["Find the turning point of y = x² + 6x + 4.","(x + 3)² − 9 + 4 = (x + 3)² − 5. Turning point (−3, −5)."],["Find the x-intercepts of y = x² − 5x + 4.","(x − 1)(x − 4) = 0. x = 1 and x = 4."],["The curve y = x² − 4x + k touches the x-axis. Find k.","It has one repeated root, so b² − 4ac = 0: 16 − 4k = 0, so k = 4."]],
sum:["a > 0 gives a ∪ shape with a minimum, a < 0 gives a ∩ shape with a maximum.","Axis of symmetry: x = −b ÷ 2a. Turning point: substitute that x into the equation.","y = a(x − p)² + q has turning point (p, q).","To solve an equation with a graph, draw the line that represents the other side and read the crossing points.","In real problems, the turning point gives the greatest or smallest value."]
},
"emath-4":{
obj:["State and apply the laws of indices.","Explain why a⁰ = 1 and a⁻ⁿ = 1/aⁿ, and why fractional powers are roots.","Evaluate and simplify expressions with negative and fractional indices.","Solve simple equations in which the unknown is in the power."],
terms:[["Index (power, exponent)","The small raised number that tells you how many times the base is multiplied. In 2⁵, the index is 5."],["Base","The number or letter being multiplied. In 2⁵ the base is 2."],["Reciprocal","1 divided by a number. The reciprocal of 4 is 1/4."],["Root","The reverse of a power. ∛27 = 3 because 3³ = 27."]],
body:[
["h","1. What an index means"],
["p","An **index** tells you how many copies of the **base** are multiplied together. So a⁴ = a × a × a × a. Most laws of indices are just this idea written in short form."],
["h","2. The laws of indices"],
["tbl",[["Law","Rule","Example"],["Multiplying","aᵐ × aⁿ = aᵐ⁺ⁿ","3² × 3⁴ = 3⁶"],["Dividing","aᵐ ÷ aⁿ = aᵐ⁻ⁿ","x⁷ ÷ x² = x⁵"],["Power of a power","(aᵐ)ⁿ = aᵐⁿ","(2³)² = 2⁶ = 64"],["Power of a product","(ab)ⁿ = aⁿbⁿ","(2x)³ = 8x³"],["Power of a quotient","(a/b)ⁿ = aⁿ/bⁿ","(3/y)² = 9/y²"],["Zero index","a⁰ = 1 (a ≠ 0)","7⁰ = 1"],["Negative index","a⁻ⁿ = 1/aⁿ","2⁻³ = 1/8"],["Fractional index","a^(m/n) = (ⁿ√a)ᵐ","8^(2/3) = 4"]]],
["p","Why do they work? a³ × a² = (a × a × a)(a × a) = a⁵, which is a³⁺². Dividing cancels common factors: a⁵ ÷ a² = (a × a × a × a × a)/(a × a) = a³. For a power of a power, (a²)³ = a² × a² × a² = a⁶."],
["h","3. Zero and negative indices"],
["p","The laws force the meaning of a⁰. Using the division law, aⁿ ÷ aⁿ = aⁿ⁻ⁿ = a⁰. But anything divided by itself is 1, so a⁰ = 1. The same idea gives negative indices: a⁰ ÷ aⁿ = a⁻ⁿ, and a⁰ = 1, so a⁻ⁿ = 1/aⁿ. You can also see the pattern in powers of 2: 2³ = 8, 2² = 4, 2¹ = 2, 2⁰ = 1, 2⁻¹ = 1/2, 2⁻² = 1/4. Each step divides by 2."],
["warn","A negative index does not make the answer negative. 2⁻³ = 1/8, not −8. It means ‘take the reciprocal’."],
["h","4. Fractional indices"],
["p","Since a^(1/2) × a^(1/2) = a¹ = a, the number a^(1/2) must be the square root of a. In the same way a^(1/3) is the cube root. For a general fraction, a^(m/n) = (ⁿ√a)ᵐ. Take the root first and then the power, because the root makes the numbers smaller."],
["f","a^(m/n) = (ⁿ√a)ᵐ = ⁿ√(aᵐ)"],
["h","5. Solving equations with unknown indices"],
["p","Write both sides as a power of the same base. Then the indices must be equal. For example 2^(x + 1) = 32 becomes 2^(x + 1) = 2⁵, so x + 1 = 5 and x = 4. Writing numbers as powers of a small prime (2, 3, 5) is the key step."],
["tip","Learn the powers of 2 (up to 2¹⁰), of 3 (up to 3⁵) and of 5 (up to 5⁴). Many questions are built from them."]
],
ex:[
["Fractional index","Evaluate 27^(2/3).",["Take the cube root first: ∛27 = 3.","Then square: 3² = 9."],"9"],
["Negative and fractional","Evaluate 16^(−3/4) and (1/4)^(−3/2).",["16^(−3/4) = 1/16^(3/4). ⁴√16 = 2 and 2³ = 8, so 16^(−3/4) = 1/8.","(1/4)^(−3/2) = 4^(3/2), because a negative index flips the fraction.","√4 = 2 and 2³ = 8."],"1/8 and 8"],
["Simplifying","Simplify (2a³b⁻²)³ ÷ (4a⁵b), giving your answer with positive indices.",["Numerator: (2a³b⁻²)³ = 8a⁹b⁻⁶.","Divide: 8a⁹b⁻⁶ ÷ 4a⁵b = 2a⁹⁻⁵b⁻⁶⁻¹ = 2a⁴b⁻⁷.","Positive indices: 2a⁴/b⁷."],"2a⁴/b⁷"],
["Equating powers","Solve 9ˣ = 27^(x − 1).",["Write both with base 3: 9 = 3² and 27 = 3³.","(3²)ˣ = (3³)^(x − 1) → 3^(2x) = 3^(3x − 3).","Equate indices: 2x = 3x − 3 → x = 3.","Check: 9³ = 729 and 27² = 729. ✓"],"x = 3"],
["Using a given value","Given that 3ˣ = 5, find the value of 3^(x + 2).",["3^(x + 2) = 3ˣ × 3².","= 5 × 9 = 45."],"45"]
],
mis:["Thinking (a + b)ⁿ = aⁿ + bⁿ. For example (2 + 3)² = 25, not 4 + 9 = 13.","Multiplying the base instead of adding the indices: 2³ × 2⁴ = 2⁷, not 4⁷.","Applying a power to only part of a bracket: (3a)² = 9a², not 3a².","Confusing −3² = −9 with (−3)² = 9.","Combining different bases: 2³ × 3² cannot be written as 6⁵.","Treating a negative index as a negative number."],
qs:[["Evaluate 8^(−2/3).","8^(1/3) = 2, then 2² = 4, then take the reciprocal: 1/4."],["Simplify x⁵ × x⁻² ÷ x³.","x⁵⁻²⁻³ = x⁰ = 1."],["Solve 2^(x + 1) = 32.","32 = 2⁵ so x + 1 = 5 and x = 4."],["Solve 5^(2x − 1) = 1/125.","1/125 = 5⁻³, so 2x − 1 = −3 and x = −1."]],
sum:["Index laws: add when multiplying like bases, subtract when dividing, multiply for a power of a power.","a⁰ = 1, a⁻ⁿ = 1/aⁿ, a^(1/n) = ⁿ√a, a^(m/n) = (ⁿ√a)ᵐ.","To solve an equation with the unknown in the index, write both sides with the same base and equate indices.","Only apply the laws to the same base."]
},
"emath-11":{
obj:["Label a triangle correctly and use the sine rule to find a side or an angle.","Use the cosine rule to find a side or an angle.","Decide which rule to use for each set of given information.","Recognise when the sine rule can give two possible triangles (the ambiguous case)."],
terms:[["Sine rule","A rule linking each side of a triangle to the sine of the opposite angle."],["Cosine rule","A rule that links all three sides to one angle. It extends Pythagoras’ theorem to any triangle."],["Ambiguous case","Information (two sides and a non-included angle) that can fit two different triangles."],["Included angle","The angle between two given sides."]],
body:[
["h","1. Labelling a triangle"],
["p","Right-angled trigonometry (SOH CAH TOA) only works when a triangle has a 90° angle. For any other triangle we use the sine rule and the cosine rule. First, label the triangle in the standard way: each side is named with the small letter of the angle opposite it."],
["svg","triangle"],
["h","2. The sine rule"],
["f","a/sin A = b/sin B = c/sin C\nor equivalently  sin A/a = sin B/b = sin C/c"],
["p","Use the sine rule when you know a side and the angle opposite it (a ‘matching pair’) plus one more piece of information. To find a side, put the unknown side on top. To find an angle, put the sine on top. Always check that your calculator is in degree mode."],
["h","3. The ambiguous case"],
["p","Two angles with the same sine add up to 180°: sin θ = sin(180° − θ). So when you find an angle using the sine rule, the angle may be acute or obtuse. If you are given two sides and an angle that is not between them (SSA), there may be two possible triangles. Test the obtuse angle: if it plus the given angle is less than 180°, both triangles exist."],
["h","4. The cosine rule"],
["f","a² = b² + c² − 2bc cos A\ncos A = (b² + c² − a²) ÷ 2bc"],
["p","Use the cosine rule when you know two sides and the angle between them (SAS) and want the third side, or when you know all three sides (SSS) and want an angle. If A = 90° then cos A = 0 and the rule becomes Pythagoras’ theorem. If the value of cos A comes out negative, the angle is obtuse, which is how this rule finds obtuse angles reliably."],
["h","5. Which rule should I use?"],
["tbl",[["You know","Use"],["Two angles and any side (AAS or ASA)","Sine rule (find the third angle first if needed)"],["Two sides and a non-included angle (SSA)","Sine rule, and check for the ambiguous case"],["Two sides and the included angle (SAS)","Cosine rule for the third side"],["Three sides (SSS)","Cosine rule for an angle"]]],
["tip","To find the largest angle in an SSS triangle, apply the cosine rule to the largest side. A negative cosine tells you the angle is obtuse."]
],
ex:[
["Sine rule: find a side","In triangle ABC, A = 48°, B = 65° and a = 12 cm. Find b.",["Matching pair: a = 12 opposite A = 48°. b is opposite B = 65°.","b/sin 65° = 12/sin 48°.","b = 12 × sin 65° ÷ sin 48° = 12 × 0.9063 ÷ 0.7431 = 14.63.","b = 14.6 cm (3 s.f.)."],"b = 14.6 cm"],
["Sine rule: the ambiguous case","In triangle ABC, a = 9 cm, b = 12 cm and A = 35°. Find angle B.",["sin B/12 = sin 35°/9, so sin B = 12 × 0.5736 ÷ 9 = 0.7648.","B = sin⁻¹(0.7648) = 49.9°, or B = 180° − 49.9° = 130.1°.","Test the obtuse value: 35° + 130.1° = 165.1° < 180°, so it is possible.","Both triangles exist."],"B = 49.9° or B = 130.1°"],
["Cosine rule: find a side","In triangle ABC, b = 7 cm, c = 10 cm and A = 52°. Find a.",["a² = 7² + 10² − 2(7)(10) cos 52°.","a² = 49 + 100 − 140 × 0.6157 = 149 − 86.19 = 62.81.","a = √62.81 = 7.93."],"a = 7.93 cm"],
["Cosine rule: find an angle","The sides of a triangle are 5 cm, 7 cm and 9 cm. Find its largest angle.",["The largest angle is opposite the longest side, 9 cm. Call it C.","cos C = (5² + 7² − 9²) ÷ (2 × 5 × 7) = (25 + 49 − 81) ÷ 70 = −7/70 = −0.1.","C = cos⁻¹(−0.1) = 95.7°."],"95.7° (obtuse)"]
],
mis:["Calculator in radian mode instead of degree mode.","Putting a side opposite the wrong angle in the sine rule. Always check each side is paired with its opposite angle.","Forgetting the second (obtuse) answer when finding an angle by the sine rule in an SSA problem.","Using sine rule for SAS or SSS, where there is no matching pair.","In the cosine rule, forgetting to square-root at the end, or doing (b² + c² − 2bc) × cos A in the wrong order. Compute 2bc cos A first, then subtract.","Rounding too early."],
qs:[["Which rule would you use to find a side when you are given two sides and the included angle?","The cosine rule."],["In triangle PQR, p = 8, P = 40° and Q = 75°. Find q.","q/sin 75° = 8/sin 40°, so q = 8 × 0.9659 ÷ 0.6428 = 12.0 (3 s.f.)."],["Find the smallest angle in a triangle with sides 6, 8 and 10.","The smallest angle is opposite 6: cos A = (64 + 100 − 36) ÷ 160 = 0.8, A = 36.9°."],["Triangle ABC has a = 6 cm, b = 9 cm and angle A = 30°. Does the sine rule give one triangle or two?","sin B = 9 sin 30° ÷ 6 = 0.75, so B = 48.6° or 131.4°. Both satisfy A + B < 180°, so there are two triangles."]],
sum:["Sine rule: a/sin A = b/sin B = c/sin C. Needs a matching side–angle pair.","Cosine rule: a² = b² + c² − 2bc cos A. Use for SAS and SSS.","SSA can be ambiguous: the sine rule may give an acute and an obtuse angle.","A negative cosine means an obtuse angle.","Keep calculator in degree mode and avoid early rounding."]
},
"amath-0":{
obj:["Rewrite a quadratic in completed-square form and read off its turning point, maximum or minimum value and range.","Solve quadratic equations by factorising, completing the square and the formula, and explain why each method works.","Use the discriminant to decide how many real roots there are, and to show that a line cuts, touches or misses a curve.","Solve simultaneous equations when one is linear and the other is not.","Solve quadratic inequalities with a sketch and write the answer as a range."],
terms:[["Quadratic function","A function f(x) = ax² + bx + c with a ≠ 0. Its graph is a parabola."],["Completing the square","Rewriting ax² + bx + c as a(x + p)² + q."],["Discriminant","b² − 4ac. It decides how many real roots ax² + bx + c = 0 has."],["Tangent","A line that touches a curve at exactly one point."],["Critical values","The roots of the related equation. They split the number line into regions to test in an inequality."],["Range","All the values that a function can take."]],
body:[
["h","1. Quadratic functions and their graphs"],
["p","A **quadratic function** has the form f(x) = ax² + bx + c where a ≠ 0. Its graph is a smooth U-shaped curve called a **parabola**. If a > 0 the parabola opens upwards and has a lowest point, a **minimum**. If a < 0 it opens downwards and has a highest point, a **maximum**. That single turning point is where the whole story of a quadratic is told, so we want a quick way to find it."],
["h","2. Completing the square: finding the maximum or minimum"],
["p","**Why it works.** Any real number squared is zero or positive, so (x + p)² ≥ 0 and its smallest value is 0, at x = −p. If we can rewrite a quadratic as a(x + p)² + q, then the squared bracket is the only part that changes with x, and q is the part that stays fixed. So the extreme value is exactly q, reached when x = −p."],
["f","f(x) = a(x + p)² + q\nturning point (−p, q)\nminimum value q if a > 0; maximum value q if a < 0"],
["p","**How to do it.** (1) Take out the factor a from the x² and x terms. (2) Inside the bracket, add and subtract the square of half the coefficient of x. (3) Combine the bracket into a perfect square and tidy up the constants. For 3x² − 12x + 5: take out 3 to get 3(x² − 4x) + 5. Half of −4 is −2, so x² − 4x = (x − 2)² − 4. Then 3[(x − 2)² − 4] + 5 = 3(x − 2)² − 12 + 5 = 3(x − 2)² − 7."],
["p","So the minimum value is −7, reached at x = 2, and the range of f is f(x) ≥ −7. Notice that the −12 comes from multiplying the −4 inside the bracket by 3. That is the step students most often forget."],
["h","3. Solving quadratic equations"],
["p","There are three methods, and they are connected. **Factorisation** uses the fact that if a product is zero then one factor is zero, so it is the fastest when the numbers are friendly. **Completing the square** works every time and is how the formula is proved. The **quadratic formula** is completing the square done once and for all on ax² + bx + c = 0."],
["f","x = [−b ± √(b² − 4ac)] ÷ 2a"],
["p","The formula is useful when the roots are not whole numbers or when the question asks for exact surd form or answers to a stated number of decimal places. In every method, first rearrange the equation so that one side is exactly 0."],
["h","4. The discriminant: how many real roots?"],
["p","Look at the formula. The only thing that can stop it giving a real answer is the square root. The quantity inside it, b² − 4ac, is called the **discriminant**. If it is positive, the root is real and the ± gives two different answers. If it is zero, the ± adds and subtracts nothing, so the two roots are equal. If it is negative, there is no real square root, so there is no real root."],
["tbl",[["b² − 4ac","Roots","Graph of y = ax² + bx + c"],["> 0","Two distinct real roots","Cuts the x-axis twice"],["= 0","Two equal real roots","Touches the x-axis once"],["< 0","No real roots","Does not meet the x-axis"]]],
["tip","When a question says ‘has real roots’, use b² − 4ac ≥ 0, not > 0. The equal-roots case is included."],
["h","5. When is a quadratic always positive (or always negative)?"],
["p","If the graph never meets the x-axis (discriminant < 0) it stays on one side of it. It stays above the axis if the parabola opens upwards (a > 0), and below it if it opens downwards (a < 0)."],
["f","ax² + bx + c > 0 for all x  ⟺  a > 0 and b² − 4ac < 0\nax² + bx + c < 0 for all x  ⟺  a < 0 and b² − 4ac < 0"],
["h","6. Simultaneous equations: one linear, one non-linear"],
["p","**Why substitution.** A line and a curve meet where both equations are true at the same time. When one equation is linear, you can rearrange it to make y (or x) the subject and substitute into the other. This removes one variable and leaves a quadratic in the other. Solve it, then substitute back into the **linear** equation to find the matching values."],
["p","The number of solutions follows the discriminant of that quadratic: two meeting points if it is positive, one (the line is a **tangent**) if it is zero, none if it is negative. A tangent question therefore always ends with ‘set b² − 4ac = 0’."],
["warn","Always substitute back into the linear equation to find the second variable. Using the curve can give extra pairs that do not satisfy the line."],
["h","7. Quadratic inequalities"],
["p","**Why a sketch helps.** The expression ax² + bx + c changes sign only where it equals zero. So the roots (critical values) divide the number line into regions where the expression is entirely positive or entirely negative. A quick sketch of the parabola shows which regions those are."],
["ol",["Move everything to one side so the other side is 0, and make the x² term positive if you can (multiplying by −1 flips the inequality sign).","Factorise and find the critical values.","Sketch the parabola, marking the critical values on the x-axis.","Read off the region: where the curve is above the axis for > 0, below the axis for < 0.","Write the answer as a range."]],
["f","(x − a)(x − b) > 0, a < b  ⟹  x < a or x > b   (outside the roots)\n(x − a)(x − b) < 0, a < b  ⟹  a < x < b   (between the roots)"],
["tip","For ≥ or ≤ include the critical values in the answer. Never write ‘x < a or x > b’ as a single double inequality."]
],
ex:[
["Completing the square","Express f(x) = 3x² − 12x + 5 in the form a(x + p)² + q. State the minimum value of f and the value of x where it occurs.",["Take out the 3: 3(x² − 4x) + 5.","Half of −4 is −2: x² − 4x = (x − 2)² − 4.","3[(x − 2)² − 4] + 5 = 3(x − 2)² − 12 + 5 = 3(x − 2)² − 7.","Since (x − 2)² ≥ 0, the least value is −7, when x = 2."],"f(x) = 3(x − 2)² − 7; minimum −7 at x = 2"],
["Discriminant and a constant","Find the values of k for which 2x² − kx + 8 = 0 has real roots.",["a = 2, b = −k, c = 8.","b² − 4ac = k² − 4(2)(8) = k² − 64.","Real roots need k² − 64 ≥ 0, so k² ≥ 64.","k ≤ −8 or k ≥ 8."],"k ≤ −8 or k ≥ 8"],
["Line and curve","Solve the simultaneous equations y = 2x + 1 and x² + y² = 10.",["Substitute: x² + (2x + 1)² = 10.","x² + 4x² + 4x + 1 = 10, so 5x² + 4x − 9 = 0.","(5x + 9)(x − 1) = 0, so x = 1 or x = −9/5.","Use the line: x = 1 gives y = 3. x = −1.8 gives y = −2.6.","Check (−1.8)² + (−2.6)² = 3.24 + 6.76 = 10. ✓"],"(1, 3) and (−1.8, −2.6)"],
["Tangent","The line y = 2x + k is a tangent to the curve y = x² − 4x + 7. Find k and the point where they touch.",["Equate: x² − 4x + 7 = 2x + k, so x² − 6x + (7 − k) = 0.","A tangent gives one solution: b² − 4ac = 36 − 4(7 − k) = 0.","36 − 28 + 4k = 0, so k = −2.","Then x² − 6x + 9 = 0, so x = 3 and y = 2(3) − 2 = 4."],"k = −2; point of contact (3, 4)"],
["Inequality (outside the roots)","Solve x² − x − 6 > 0.",["Factorise: (x − 3)(x + 2) > 0. The critical values are −2 and 3.","The parabola opens upwards, so it is above the axis outside the roots.","x < −2 or x > 3."],"x < −2 or x > 3"],
["Inequality with a negative x² term","Solve 12 + x − x² ≥ 0.",["Multiply by −1 and flip the sign: x² − x − 12 ≤ 0.","Factorise: (x − 4)(x + 3) ≤ 0, critical values −3 and 4.","Below or on the axis means between the roots, including both.","−3 ≤ x ≤ 4."],"−3 ≤ x ≤ 4"],
["Always positive","Show that 2x² − 4x + 5 > 0 for all real x.",["Complete the square: 2(x² − 2x) + 5 = 2[(x − 1)² − 1] + 5 = 2(x − 1)² + 3.","Since (x − 1)² ≥ 0, the expression is at least 3.","So it is always greater than 0."],"Proved: minimum value is 3"]
],
mis:["Forgetting to multiply the constant inside the bracket by the factor taken out: 3[(x − 2)² − 4] is 3(x − 2)² − 12, not 3(x − 2)² − 4.","Writing the turning point as (p, q) from a(x + p)² + q. It is (−p, q).","Using b² − 4ac > 0 when the question says real roots. That excludes the equal case.","Not rearranging the equation to equal 0 before using the formula or discriminant.","Finding x from a simultaneous equation pair but then pairing it with the wrong y. Use the linear equation to find y.","Not flipping the inequality sign when multiplying or dividing by a negative.","Writing the inequality answer between the roots when it should be outside (or the reverse). Check with the sketch."],
qs:[["Find the minimum value of x² + 6x + 4 and where it occurs.","(x + 3)² − 9 + 4 = (x + 3)² − 5. Minimum value −5 at x = −3."],["Determine the nature of the roots of 2x² − 3x + 5 = 0.","b² − 4ac = 9 − 40 = −31 < 0, so there are no real roots."],["Find the values of m for which 3x² + 2x + m = 0 has two distinct real roots.","4 − 12m > 0, so m < 1/3."],["Solve 2x² > x + 6.","2x² − x − 6 > 0 → (2x + 3)(x − 2) > 0 → x < −3/2 or x > 2."],["Does the line y = x + 5 meet the curve y = x² + 2x + 8?","x² + 2x + 8 = x + 5 → x² + x + 3 = 0, discriminant 1 − 12 = −11 < 0. No, it does not meet the curve."]],
sum:["a(x + p)² + q has turning point (−p, q) and gives the maximum or minimum value and the range.","Three methods solve quadratics: factorise, complete the square, or use the formula x = [−b ± √(b² − 4ac)] ÷ 2a.","b² − 4ac > 0, = 0, < 0 means two, one (tangent) or no real roots.","Simultaneous equations: substitute the linear equation into the other, then use the linear equation to find the second variable.","Quadratic inequality: factorise, sketch, read the region. Outside the roots for > 0 (a > 0), between for < 0."]
},
"amath-1":{
obj:["Simplify surds, rationalise denominators and find unknowns by equating rational and surd parts.","Apply the laws of indices and solve exponential equations by matching bases.","Explain why a logarithm is the reverse of a power and use the laws of logarithms.","Use the change-of-base rule and take logs of both sides to solve equations.","Solve equations with logarithms and reject answers that make a logarithm undefined."],
terms:[["Surd","A root that cannot be written as a fraction, such as √2. It is kept exact."],["Conjugate","The same two terms with the sign between them reversed: 3 + √2 and 3 − √2."],["Index","The small number that says how many times the base is multiplied."],["Logarithm","log_a b is the power to which a must be raised to give b."],["Base","The number that is raised to a power. In log₂ 8 the base is 2."],["Natural logarithm (ln)","A logarithm to base e, where e ≈ 2.718."]],
body:[
["h","Part A. Surds"],
["p","A number like √9 = 3 is rational, but √2 cannot be written as a fraction. Such roots are called **surds**. We keep surds exact (such as 3√2) because a calculator value like 4.2426… is only an approximation, and rounding early spoils later working."],
["f","√a × √b = √(ab)     √a ÷ √b = √(a/b)     √a × √a = a"],
["warn","√(a + b) is NOT √a + √b. For example √(9 + 16) = 5 but √9 + √16 = 7."],
["p","**Simplifying.** Pull out the largest square factor. √72 = √(36 × 2) = 6√2. **Adding and subtracting.** Only like surds combine, in the same way as like terms: 3√2 + 5√2 = 8√2. Simplify each surd first, because √48 + √75 = 4√3 + 5√3 = 9√3."],
["p","**Rationalising the denominator.** Leaving a surd in a denominator is untidy and hard to compare. The product of conjugates is rational, because (a + √b)(a − √b) = a² − b, so multiplying top and bottom by the conjugate removes the surd."],
["f","(a + √b)(a − √b) = a² − b"],
["p","**Equating parts.** If a + b√c = p + q√c with a, b, p, q rational and √c irrational, then a = p and b = q. This is how you find unknown rational numbers."],
["h","Part B. Indices"],
["f","aᵐ × aⁿ = aᵐ⁺ⁿ     aᵐ ÷ aⁿ = aᵐ⁻ⁿ     (aᵐ)ⁿ = aᵐⁿ\na⁰ = 1     a⁻ⁿ = 1/aⁿ     a^(m/n) = (ⁿ√a)ᵐ"],
["p","Each law is a shortcut for repeated multiplication. For example a³ × a² = (a·a·a)(a·a) = a⁵. A negative index means ‘one over’, and a fractional index means a root. To **solve an exponential equation**, write both sides as a power of the same base. Then the indices must be equal. For 4ˣ = 8^(x − 1): write 2^(2x) = 2^(3x − 3), so 2x = 3x − 3 and x = 3."],
["h","Part C. Logarithms"],
["p","**What a logarithm is.** Taking a square root undoes squaring. A logarithm undoes a power. The statement ‘2⁵ = 32’ can be turned around to ask: ‘to what power must I raise 2 to get 32?’ The answer is written log₂ 32 = 5."],
["f","log_a b = c  ⟺  aᶜ = b     (a > 0, a ≠ 1, b > 0)\nlog_a 1 = 0     log_a a = 1"],
["p","The condition b > 0 is important: a positive base raised to any power gives a positive number, so you can only take the logarithm of a positive number."],
["h","Laws of logarithms"],
["p","Each law comes from a law of indices. If x = aᵖ and y = aᵠ, then xy = aᵖ⁺ᵠ, so log_a(xy) = p + q = log_a x + log_a y. Multiplying numbers adds their logarithms, because multiplying powers adds the indices."],
["f","log_a(xy) = log_a x + log_a y\nlog_a(x/y) = log_a x − log_a y\nlog_a(xⁿ) = n log_a x"],
["h","Change of base"],
["p","Your calculator has log (base 10, written lg) and ln (base e). To work with any other base, use the change-of-base rule. It follows by letting y = log_a b, so aʸ = b, then taking log_c of both sides: y log_c a = log_c b."],
["f","log_a b = log_c b ÷ log_c a     and so     log_a b = 1 ÷ log_b a"],
["h","Solving equations with logarithms"],
["ul",["**Unknown in the index:** take logs of both sides. For 3ˣ = 20, x lg 3 = lg 20, so x = lg 20 ÷ lg 3 = 2.73.","**Logs in the equation:** use the laws to combine into a single log, convert to a power, solve, then **check** each answer in the original equation. Reject any value that makes a log of zero or a negative number."]],
["tip","Learn the laws in both directions. In ‘show that’ and ‘express in terms of p and q’ questions, you will use them backwards as often as forwards."]
],
ex:[
["Simplify and expand surds","Simplify √72 and √48 + √75 − √27. Then expand (3 + 2√5)(4 − √5).",["√72 = √(36 × 2) = 6√2.","√48 = 4√3, √75 = 5√3, √27 = 3√3, so 4√3 + 5√3 − 3√3 = 6√3.","(3 + 2√5)(4 − √5) = 12 − 3√5 + 8√5 − 2(5).","= 12 − 10 + 5√5 = 2 + 5√5."],"6√2; 6√3; 2 + 5√5"],
["Rationalise","Express (2 + √3)/(2 − √3) in the form a + b√3.",["Multiply top and bottom by the conjugate 2 + √3.","Top: (2 + √3)² = 4 + 4√3 + 3 = 7 + 4√3.","Bottom: (2 − √3)(2 + √3) = 4 − 3 = 1."],"7 + 4√3"],
["Equating parts","Given (a + √2)² = 11 + b√2 where a > 0, find a and b.",["Expand: a² + 2a√2 + 2 = (a² + 2) + 2a√2.","Rational parts: a² + 2 = 11, so a = 3.","Surd parts: 2a = b, so b = 6."],"a = 3, b = 6"],
["Exponential equation","Solve 4ˣ = 8^(x − 1).",["Write both sides with base 2: (2²)ˣ = (2³)^(x − 1), so 2^(2x) = 2^(3x − 3).","Equate the indices: 2x = 3x − 3.","x = 3. Check: 4³ = 64 and 8² = 64. ✓"],"x = 3"],
["Using the laws","Show that 2 lg 5 + lg 4 = 2. Then find log₄ 32 without a calculator.",["2 lg 5 + lg 4 = lg 5² + lg 4 = lg 25 + lg 4 = lg 100 = 2.","log₄ 32 = log₂ 32 ÷ log₂ 4 = 5 ÷ 2 = 2.5."],"2 and 2.5"],
["Solve with logs","Solve 3ˣ = 20, giving your answer to 2 decimal places.",["Take lg of both sides: x lg 3 = lg 20.","x = lg 20 ÷ lg 3 = 1.30103 ÷ 0.47712 = 2.7268.","x = 2.73."],"x = 2.73"],
["Logarithm equation","Solve log₂(x + 3) + log₂ x = 2.",["Combine: log₂[x(x + 3)] = 2, so x(x + 3) = 2² = 4.","x² + 3x − 4 = 0, so (x + 4)(x − 1) = 0, giving x = −4 or x = 1.","x = −4 makes log₂ x undefined, so reject it.","Check x = 1: log₂ 4 + log₂ 1 = 2 + 0 = 2. ✓"],"x = 1"],
["Express in terms of p and q","Given log_a 2 = p and log_a 3 = q, express log_a 12 in terms of p and q.",["12 = 2² × 3.","log_a 12 = log_a 2² + log_a 3 = 2 log_a 2 + log_a 3.","= 2p + q."],"2p + q"]
],
mis:["Writing √(a + b) = √a + √b.","Adding unlike surds, such as 3√2 + 4√3 = 7√5.","Writing log(x + y) = log x + log y. Only products turn into sums.","Writing log x ÷ log y as log(x ÷ y). The quotient of two logs is not the log of a quotient: log(x/y) = log x − log y.","Forgetting to check log equations. A log of zero or a negative number is undefined, so some solutions must be rejected.","Applying a power to only part of a bracket: (3a)² = 9a², not 3a².","Leaving a surd in the denominator, or leaving a surd partly simplified."],
qs:[["Simplify √200 and rationalise 10/√5.","√200 = 10√2. 10/√5 = 10√5 ÷ 5 = 2√5."],["Solve 2^(x + 1) = 32.","2^(x + 1) = 2⁵, so x = 4."],["Evaluate log₃ 81 − log₃ 3.","4 − 1 = 3."],["Solve 5ˣ = 12, giving 2 d.p.","x = lg 12 ÷ lg 5 = 1.5440, so x = 1.54."],["Simplify log₂ 8 + log₂ 4 − log₂ 2.","3 + 2 − 1 = 4."]],
sum:["Surds: simplify with square factors, add like surds only, rationalise with the conjugate, equate rational and surd parts.","Indices: add when multiplying, subtract when dividing, multiply for a power of a power. Equate indices once the bases are the same.","log_a b = c means aᶜ = b. Logs only exist for positive numbers.","log_a(xy) = log_a x + log_a y; log_a(x/y) = log_a x − log_a y; log_a xⁿ = n log_a x; log_a b = log_c b ÷ log_c a.","Solve exponential equations by taking logs; always check log equations for rejected answers."]
},
"amath-2":{
obj:["Divide polynomials using long division and synthetic division.","State and use the remainder theorem and the factor theorem.","Factorise cubic polynomials and solve cubic equations, and use sum and difference of cubes.","Decompose a rational expression into partial fractions for linear, repeated and quadratic denominators.","Use partial fractions to deal with improper fractions."],
terms:[["Polynomial","A sum of terms such as axⁿ with n a whole number, for example 2x³ + 3x² − 8x + 5."],["Degree","The highest power of x."],["Remainder","What is left after dividing. It has a lower degree than the divisor."],["Root (zero)","A value of x that makes the polynomial equal to 0."],["Partial fractions","Splitting a single fraction into a sum of simpler fractions."],["Improper fraction","A fraction whose numerator has degree equal to or greater than the denominator."]],
body:[
["h","1. Polynomials and division"],
["p","A **polynomial** is built from whole-number powers of x. Its **degree** is the highest power. Polynomial division works like long division of numbers: you repeatedly divide the leading terms. Every division can be written as f(x) = (divisor) × (quotient) + (remainder), where the remainder has a lower degree than the divisor."],
["ol",["Write both polynomials in descending powers, putting a 0 coefficient in for any missing power.","Divide the first term of the dividend by the first term of the divisor. This is the next term of the quotient.","Multiply the divisor by that term and subtract from the dividend.","Bring down the next term and repeat until the remainder has lower degree than the divisor."]],
["h","2. The remainder theorem"],
["p","**Why it works.** Write f(x) = (x − a)Q(x) + R. If you substitute x = a, the bracket (x − a) becomes 0 and the whole first term disappears, leaving f(a) = R. So you can find the remainder without doing the division."],
["f","Remainder theorem: the remainder when f(x) is divided by (x − a) is f(a).\nFor a divisor (px − q), use x = q/p."],
["h","3. The factor theorem"],
["p","If the remainder is 0, the division is exact, so (x − a) is a factor. This works both ways."],
["f","Factor theorem: (x − a) is a factor of f(x)  ⟺  f(a) = 0"],
["p","**How to factorise a cubic.** (1) Try values of x that divide the constant term, such as ±1, ±2, ±3, until f(a) = 0. (2) Divide f(x) by (x − a) to get a quadratic. (3) Factorise the quadratic. Then the roots of f(x) = 0 are the values that make each factor zero."],
["h","4. Sum and difference of two cubes"],
["f","a³ + b³ = (a + b)(a² − ab + b²)\na³ − b³ = (a − b)(a² + ab + b²)"],
["p","Expand the right-hand side to see why they work: (a − b)(a² + ab + b²) = a³ + a²b + ab² − a²b − ab² − b³ = a³ − b³. The quadratic factor cannot be factorised further over the real numbers."],
["h","5. Comparing coefficients"],
["p","If two polynomials are identical for every value of x, written with ≡, then the coefficients of each power of x are equal. Expand one side, then match the x², x and constant terms. This is used to find unknown constants and is the main method in partial fractions."],
["h","6. Partial fractions"],
["p","**Why we do it.** Adding fractions combines them into one over a common denominator. Partial fractions reverses that, splitting one complicated fraction into simple ones. This is very useful later, for example for integration, and it is also a standard exam skill."],
["tbl",[["Denominator contains","Form of the partial fractions"],["Distinct linear factors (x − a)(x − b)","A/(x − a) + B/(x − b)"],["A repeated linear factor (x − a)²","A/(x − a) + B/(x − a)²"],["An irreducible quadratic factor (x² + k)","(Ax + B)/(x² + k)"]]],
["ol",["If the numerator has degree equal to or greater than the denominator (an improper fraction), divide first to get a polynomial plus a proper fraction.","Factorise the denominator completely.","Write the partial fraction form with unknown constants.","Multiply both sides by the denominator, so you have an identity with no fractions.","Find the constants by substituting convenient values of x (the roots of the factors), or by comparing coefficients, or both."]],
["tip","Substituting the root of a factor is fast because it makes the other terms vanish. For a repeated factor, use substitution for one constant and comparing coefficients, or another value of x, for the rest."]
],
ex:[
["Division and remainder","Divide 2x³ + 3x² − 8x + 5 by x − 1.",["Synthetic division with root 1 and coefficients 2, 3, −8, 5.","Bring down 2. Then 3 + 2 = 5, then −8 + 5 = −3, then 5 − 3 = 2.","Quotient 2x² + 5x − 3, remainder 2.","Check: f(1) = 2 + 3 − 8 + 5 = 2. ✓"],"Quotient 2x² + 5x − 3, remainder 2"],
["Factor theorem","Factorise x³ − 2x² − 5x + 6 completely and solve x³ − 2x² − 5x + 6 = 0.",["f(1) = 1 − 2 − 5 + 6 = 0, so (x − 1) is a factor.","Divide: x³ − 2x² − 5x + 6 = (x − 1)(x² − x − 6).","x² − x − 6 = (x − 3)(x + 2).","So f(x) = (x − 1)(x − 3)(x + 2) and x = 1, 3 or −2."],"(x − 1)(x − 3)(x + 2); x = 1, 3, −2"],
["Finding unknown coefficients","f(x) = x³ + ax² + bx − 6 has factor (x − 1) and leaves remainder −12 when divided by (x + 2). Find a and b.",["f(1) = 0: 1 + a + b − 6 = 0, so a + b = 5.","f(−2) = −12: −8 + 4a − 2b − 6 = −12, so 2a − b = 1.","Adding: 3a = 6, so a = 2 and b = 3.","Check: f(1) = 1 + 2 + 3 − 6 = 0 ✓ and f(−2) = −8 + 8 − 6 − 6 = −12 ✓."],"a = 2, b = 3"],
["Sum of cubes","Factorise 8x³ − 27.",["8x³ − 27 = (2x)³ − 3³.","= (2x − 3)[(2x)² + (2x)(3) + 3²].","= (2x − 3)(4x² + 6x + 9)."],"(2x − 3)(4x² + 6x + 9)"],
["Partial fractions: distinct linear factors","Express (5x + 1)/[(x − 1)(x + 2)] in partial fractions.",["Write A/(x − 1) + B/(x + 2).","5x + 1 ≡ A(x + 2) + B(x − 1).","x = 1: 6 = 3A, so A = 2. x = −2: −9 = −3B, so B = 3.","Check: 2(x + 2) + 3(x − 1) = 5x + 1. ✓"],"2/(x − 1) + 3/(x + 2)"],
["Partial fractions: repeated factor","Express (5 + 5x − x²)/[(x − 1)(x + 2)²] in partial fractions.",["Write A/(x − 1) + B/(x + 2) + C/(x + 2)².","5 + 5x − x² ≡ A(x + 2)² + B(x − 1)(x + 2) + C(x − 1).","x = 1: 9 = 9A, so A = 1. x = −2: −9 = −3C, so C = 3.","x = 0: 5 = 4A − 2B − C = 4 − 2B − 3, so B = −2."],"1/(x − 1) − 2/(x + 2) + 3/(x + 2)²"],
["Improper fraction","Express (x² + 3)/(x² − 1) in partial fractions.",["The numerator and denominator have the same degree, so divide first.","(x² + 3) = (x² − 1) + 4, so the fraction = 1 + 4/(x² − 1).","4/[(x − 1)(x + 1)] = A/(x − 1) + B/(x + 1): 4 ≡ A(x + 1) + B(x − 1).","x = 1: A = 2. x = −1: B = −2."],"1 + 2/(x − 1) − 2/(x + 1)"],
["Irreducible quadratic factor","Express (3x + 4)/[(x + 1)(x² + 1)] in partial fractions.",["Write A/(x + 1) + (Bx + C)/(x² + 1).","3x + 4 ≡ A(x² + 1) + (Bx + C)(x + 1).","x = −1: 1 = 2A, so A = 1/2.","Compare x²: 0 = A + B, so B = −1/2. Compare constants: 4 = A + C, so C = 7/2.","Check x terms: B + C = 3. ✓"],"1/[2(x + 1)] + (7 − x)/[2(x² + 1)]"]
],
mis:["Forgetting to put a zero for a missing power in division, such as x³ + 2 = x³ + 0x² + 0x + 2.","Using f(−a) instead of f(a) for the divisor (x − a). For (x + 2) use x = −2.","For (2x − 1), using x = 2 instead of x = 1/2.","Wrong signs in the sum and difference of cubes.","Not dividing first when the fraction is improper, and trying to force partial fractions onto it.","Using A/(x + 2)² only, for a repeated factor, forgetting the A/(x + 2) term as well.","Not checking the answer by substituting a simple value of x."],
qs:[["Find the remainder when x³ − 4x + 1 is divided by x − 2.","f(2) = 8 − 8 + 1 = 1."],["Show that (x + 3) is a factor of x³ + 27.","f(−3) = −27 + 27 = 0."],["Solve x³ − 7x + 6 = 0.","f(1) = 0, so (x − 1)(x² + x − 6) = (x − 1)(x + 3)(x − 2). x = 1, −3, 2."],["Express 7/[(x − 2)(x + 5)] in partial fractions.","A(x + 5) + B(x − 2) = 7. x = 2: 7A = 7, A = 1. x = −5: −7B = 7, B = −1. So 1/(x − 2) − 1/(x + 5)."]],
sum:["f(x) = (x − a)Q(x) + R and R = f(a) (remainder theorem).","(x − a) is a factor exactly when f(a) = 0 (factor theorem).","Factorise a cubic by finding one root, dividing, then factorising the quadratic.","Partial fractions: pick the correct form, clear the denominators, then substitute roots or compare coefficients.","Always divide first when the fraction is improper."]
},
"amath-3":{
obj:["Explain where the binomial coefficients come from and read them from Pascal’s triangle.","Expand (a + b)ⁿ for a positive integer n using the binomial theorem.","Find a particular term, a coefficient, or the term independent of x using the general term.","Use a binomial expansion for an approximate calculation."],
terms:[["Binomial","An expression with two terms, such as a + b."],["Binomial coefficient ⁿCᵣ","The number of ways to choose r items from n. It is the coefficient of aⁿ⁻ʳbʳ."],["Factorial n!","n × (n − 1) × … × 2 × 1, with 0! = 1."],["General term","The formula for the (r + 1)th term of an expansion."],["Term independent of x","The term that contains no x, which is the x⁰ term."]],
body:[
["h","1. Why expand a binomial?"],
["p","Multiplying (a + b) by itself many times by hand is slow and error-prone. The **binomial theorem** gives each term directly. Look at the first few expansions: (a + b)² = a² + 2ab + b² and (a + b)³ = a³ + 3a²b + 3ab² + b³. Each time the powers of a go down while the powers of b go up, and the numbers in front follow a pattern."],
["h","2. Pascal’s triangle"],
["p","The coefficients form **Pascal’s triangle**. Each number is the sum of the two numbers above it."],
["tbl",[["n","Coefficients"],["0","1"],["1","1  1"],["2","1  2  1"],["3","1  3  3  1"],["4","1  4  6  4  1"],["5","1  5  10  10  5  1"],["6","1  6  15  20  15  6  1"]]],
["p","So (a + b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴. Pascal’s triangle is quick for small n, but for large n you need the formula."],
["h","3. Binomial coefficients"],
["p","**Why the coefficients are counts.** In (a + b)ⁿ = (a + b)(a + b)…(a + b), a term aⁿ⁻ʳbʳ is formed by choosing b from r of the n brackets and a from the rest. The number of ways to choose which r brackets give b is ⁿCᵣ. That is the coefficient."],
["f","ⁿCᵣ = n! ÷ [r!(n − r)!]\nⁿC₀ = ⁿCₙ = 1     ⁿCᵣ = ⁿCₙ₋ᵣ"],
["p","For example ⁷C₃ = 7!/(3! 4!) = (7 × 6 × 5)/(3 × 2 × 1) = 35. The symmetry ⁿCᵣ = ⁿCₙ₋ᵣ saves effort: ⁷C₄ = ⁷C₃ = 35."],
["h","4. The binomial theorem"],
["f","(a + b)ⁿ = aⁿ + ⁿC₁ aⁿ⁻¹b + ⁿC₂ aⁿ⁻²b² + … + bⁿ\ngeneral term: T(r + 1) = ⁿCᵣ aⁿ⁻ʳ bʳ"],
["p","The expansion of (a + b)ⁿ has n + 1 terms. The powers of a and b in each term add up to n. If a term contains a number or a negative, put it in brackets, for example (−3x)², so the sign and the number are both squared."],
["h","5. Finding a particular term"],
["ol",["Write the general term T(r + 1) using the correct a, b and n.","Simplify the powers of x (use the index laws).","Set the power of x equal to the one you want and solve for r.","Substitute r back to get the coefficient."]],
["p","For a **term independent of x**, you want the power of x to be 0."],
["h","6. Approximations"],
["p","When x is small, powers of x get very small very quickly, so the first few terms give a good approximation: (1 + x)ⁿ ≈ 1 + nx + (n(n − 1)/2)x²."],
["tip","In (1 + kx)ⁿ, put the whole kx in brackets before you raise it to a power: the coefficient of x² is ⁿC₂ k², not ⁿC₂ k."]
],
ex:[
["Expansion","Expand (1 + 2x)⁴.",["Pascal’s triangle row: 1, 4, 6, 4, 1.","Terms: 1 + 4(2x) + 6(2x)² + 4(2x)³ + (2x)⁴.","= 1 + 8x + 24x² + 32x³ + 16x⁴."],"1 + 8x + 24x² + 32x³ + 16x⁴"],
["First terms with a negative","Find the first three terms of (2 − 3x)⁵ in ascending powers of x.",["T1 = 2⁵ = 32.","T2 = ⁵C₁ 2⁴(−3x) = 5 × 16 × (−3x) = −240x.","T3 = ⁵C₂ 2³(−3x)² = 10 × 8 × 9x² = 720x²."],"32 − 240x + 720x² + …"],
["A particular coefficient","Find the coefficient of x³ in the expansion of (x + 2)⁷.",["General term: ⁷Cᵣ x⁷⁻ʳ 2ʳ.","x³ means 7 − r = 3, so r = 4.","Coefficient = ⁷C₄ × 2⁴ = 35 × 16 = 560."],"560"],
["Term independent of x","Find the term independent of x in (x² + 1/x)⁹.",["General term: ⁹Cᵣ (x²)⁹⁻ʳ (1/x)ʳ = ⁹Cᵣ x¹⁸⁻²ʳ⁻ʳ = ⁹Cᵣ x¹⁸⁻³ʳ.","Independent of x: 18 − 3r = 0, so r = 6.","Term = ⁹C₆ = 84."],"84"],
["Product of two expressions","Find the coefficient of x² in the expansion of (1 + x)(2 − x)⁴.",["(2 − x)⁴ = 16 − 32x + 24x² − 8x³ + x⁴.","x² terms in the product: 1 × 24x² and x × (−32x) = −32x².","Coefficient = 24 − 32 = −8."],"−8"],
["Finding n and k","In the expansion of (1 + kx)ⁿ the coefficient of x is 12 and the coefficient of x² is 60. Find n and k.",["Coefficient of x: nk = 12.","Coefficient of x²: ⁿC₂ k² = [n(n − 1)/2] k² = 60, so n(n − 1)k² = 120.","(nk)² = 144, so n²k² = 144. Divide: (n − 1)/n = 120/144 = 5/6.","6n − 6 = 5n, so n = 6, then k = 12/6 = 2."],"n = 6, k = 2"],
["Approximation","Use the expansion of (1 + 0.02)⁵ to evaluate 1.02⁵ to 4 decimal places.",["(1 + x)⁵ = 1 + 5x + 10x² + 10x³ + …, with x = 0.02.","= 1 + 0.1 + 10(0.0004) + 10(0.000008) + …","= 1 + 0.1 + 0.004 + 0.00008 = 1.10408…","To 4 d.p., 1.1041."],"1.1041"]
],
mis:["Forgetting to square or cube a number inside the bracket: (2x)² = 4x², not 2x².","Losing a negative sign: (−3x)² is positive, (−3x)³ is negative.","Using r instead of r + 1 for the term number, or mixing up r with n.","Using ⁿCᵣ with the wrong r after finding the power of x.","Expanding (a + b)ⁿ as aⁿ + bⁿ.","Missing a term when finding a coefficient in a product of two expansions."],
qs:[["Evaluate ⁸C₃.","8!/(3! 5!) = (8 × 7 × 6)/(3 × 2 × 1) = 56."],["Expand (x + 1)⁵.","x⁵ + 5x⁴ + 10x³ + 10x² + 5x + 1."],["Find the coefficient of x² in (1 − 2x)⁶.","⁶C₂(−2)² = 15 × 4 = 60."],["How many terms are in the expansion of (a + b)¹⁰?","11 terms."]],
sum:["The coefficients in (a + b)ⁿ are ⁿCᵣ = n!/[r!(n − r)!], the numbers in Pascal’s triangle.","General term T(r + 1) = ⁿCᵣ aⁿ⁻ʳ bʳ. There are n + 1 terms.","To find a given term, write the general term, simplify the power of x, and solve for r.","Always bracket numbers and negatives before raising to a power."]
},
"amath-4":{
obj:["Sketch and describe the graphs of y = aˣ, y = eˣ, y = log_a x and y = ln x, including intercepts and asymptotes.","Explain why exponential and logarithmic graphs are reflections of each other in the line y = x.","Sketch simple transformations of these graphs.","Solve exponential and logarithmic equations, including those that become quadratic.","Use exponential functions to model growth and decay."],
terms:[["Exponential function","A function of the form y = aˣ (a > 0, a ≠ 1), where the variable is in the index."],["Logarithmic function","The inverse of an exponential function, y = log_a x."],["Asymptote","A line that a curve gets closer and closer to but never touches."],["e","An irrational number, about 2.718, which is the natural base for growth."],["Inverse function","A function that undoes another. Its graph is the reflection in y = x."]],
body:[
["h","1. Exponential functions y = aˣ"],
["p","In an **exponential function** the variable is in the index. For a > 1 the curve rises steeply, because each step to the right multiplies the previous value by a. For 0 < a < 1 the curve falls, which is called exponential decay. Every graph of y = aˣ passes through (0, 1), since a⁰ = 1, and lies entirely above the x-axis, since a positive number to any power is positive. The x-axis, y = 0, is a horizontal **asymptote**: the curve gets closer to it but never reaches it."],
["h","2. Logarithmic functions y = log_a x"],
["p","The function y = log_a x means aʸ = x, so it is the **inverse** of y = aˣ. An inverse swaps the roles of x and y, so its graph is the mirror image of the original in the line y = x. That is why the key features swap too: the exponential passes through (0, 1) and the logarithm passes through (1, 0); the exponential has asymptote y = 0 and the logarithm has asymptote x = 0 (the y-axis). The logarithm is only defined for x > 0."],
["svg","explog"],
["p","The graph above shows y = 2ˣ, y = log₂ x and the mirror line y = x. Notice that (1, 2) on the exponential becomes (2, 1) on the logarithm."],
["h","3. The number e and natural logarithms"],
["p","The number **e ≈ 2.718** is special because the gradient of y = eˣ at any point equals its height. This makes it the natural choice for growth and decay. The logarithm to base e is written **ln x**, so ln x = log_e x. All the laws of logarithms apply to ln as well, and ln(eˣ) = x, e^(ln x) = x."],
["h","4. Sketching transformations"],
["tbl",[["Equation","What happens to y = aˣ","Asymptote"],["y = aˣ + k","Moves up by k","y = k"],["y = a^(x + h)","Moves left by h","y = 0"],["y = −aˣ","Reflects in the x-axis","y = 0"],["y = c × aˣ","Stretches vertically; y-intercept is c","y = 0"]]],
["tip","When you sketch, always label the y-intercept (put x = 0), any x-intercept (put y = 0), and the asymptote as a dashed line."],
["h","5. Solving exponential and logarithmic equations"],
["p","If the equation looks like a quadratic in disguise, such as 2²ˣ − 5(2ˣ) + 4 = 0, use a **substitution**: let u = 2ˣ, so 2²ˣ = u². Solve the quadratic in u, then convert back with 2ˣ = u. Remember u = 2ˣ is always positive, so reject any negative u."],
["p","For equations of the form aˣ = b where b is not a neat power of a, take logs of both sides: x = lg b ÷ lg a. For equations with logs, combine with the laws, convert to a power, solve and check that every log in the original is defined."],
["h","6. Growth and decay"],
["p","Quantities that grow or shrink by a fixed percentage in equal time steps follow an exponential model. A population P that grows continuously can be modelled by P = P₀ eᵏᵗ with k > 0, and a decaying quantity by a negative k, or by M = M₀ (1/2)^(t/T) where T is the half-life. To find a time, set the formula equal to the target value and take logs."]
],
ex:[
["Reading a graph","State the y-intercept and the equation of the asymptote of y = 3(2ˣ) − 4. Sketch its shape.",["y-intercept: put x = 0, y = 3(1) − 4 = −1.","As x → −∞, 2ˣ → 0 so y → −4. The asymptote is y = −4.","The curve rises from the asymptote on the left and increases steeply to the right.","x-intercept: 3(2ˣ) = 4, so 2ˣ = 4/3, x = lg(4/3) ÷ lg 2 = 0.415."],"y-intercept −1; asymptote y = −4; x-intercept 0.415"],
["Quadratic in disguise","Solve 2²ˣ − 5(2ˣ) + 4 = 0.",["Let u = 2ˣ. Then u² − 5u + 4 = 0.","(u − 1)(u − 4) = 0, so u = 1 or u = 4.","2ˣ = 1 gives x = 0. 2ˣ = 4 gives x = 2."],"x = 0 or x = 2"],
["Taking logs","Solve 5^(2x − 1) = 40, giving your answer to 2 decimal places.",["Take lg: (2x − 1) lg 5 = lg 40.","2x − 1 = lg 40 ÷ lg 5 = 1.60206 ÷ 0.69897 = 2.2920.","2x = 3.2920, so x = 1.65 (2 d.p.)."],"x = 1.65"],
["A log equation","Solve lg(x + 9) − lg x = 1.",["lg[(x + 9)/x] = 1, so (x + 9)/x = 10.","x + 9 = 10x, so 9x = 9 and x = 1.","Check: lg 10 − lg 1 = 1 − 0 = 1. ✓"],"x = 1"],
["Population growth","A population is modelled by P = 500e^(0.03t), where t is in years. Find how long it takes to double.",["Doubling means P = 1000: 500e^(0.03t) = 1000, so e^(0.03t) = 2.","Take ln: 0.03t = ln 2 = 0.6931.","t = 0.6931 ÷ 0.03 = 23.1 years."],"23.1 years"],
["Half-life","A radioactive sample has mass M = 80 × (1/2)^(t/5) grams after t days. After how many days is the mass 10 g?",["80 × (1/2)^(t/5) = 10, so (1/2)^(t/5) = 1/8 = (1/2)³.","t/5 = 3, so t = 15."],"15 days"]
],
mis:["Putting the asymptote through the wrong axis: y = aˣ has asymptote y = 0, but y = log_a x has asymptote x = 0.","Saying log_a x exists for negative x. It only exists for x > 0.","Forgetting to reject the negative value of u = 2ˣ.","Not checking logarithm equations for rejected answers.","Rounding the logs before dividing, which spoils the accuracy.","Mixing up e and 10: ln is base e, lg is base 10."],
qs:[["State the coordinates where y = log₃ x crosses the x-axis.","(1, 0), because log₃ 1 = 0."],["Write down the equation of the asymptote of y = 2ˣ + 3.","y = 3."],["Solve e^x = 7.","x = ln 7 = 1.95."],["Solve 3^(2x) − 4(3^x) + 3 = 0.","u = 3ˣ: u² − 4u + 3 = 0, so u = 1 or 3, hence x = 0 or x = 1."]],
sum:["y = aˣ passes through (0, 1) with asymptote y = 0. y = log_a x passes through (1, 0) with asymptote x = 0.","The two graphs are reflections in y = x because log is the inverse of the power.","e ≈ 2.718 and ln = log_e. ln(eˣ) = x and e^(ln x) = x.","Solve with substitution when the equation is a hidden quadratic, and with logs when x is in the index.","Growth and decay models use P₀eᵏᵗ or half-life form; take logs to find time."]
},
"amath-5":{
