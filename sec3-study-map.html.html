<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sec 3 G3 Study Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EDF1F7; --grid:#DCE3EF; --card:#FFFFFF; --ink:#16203A; --ink2:#51607F; --line:#C5CFE2; --focus:#2547D0;
  --emath:#2F5BEA; --amath:#7A3FD1; --phy:#E06A1F; --chem:#0E9484; --eng:#CF2F4A; --chi:#B98A00;
  --display:'Bricolage Grotesque','Noto Sans SC',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11172A; --grid:#1B2440; --card:#1A2240; --ink:#E8ECF7; --ink2:#9AA7C7; --line:#2E3A5F; --focus:#8EA4FF;
    --emath:#6D8DFF; --amath:#A57BEF; --phy:#F28A47; --chem:#2CC4B1; --eng:#F2647C; --chi:#E2B72E;
  }
}
:root[data-theme="dark"]{
  --paper:#11172A; --grid:#1B2440; --card:#1A2240; --ink:#E8ECF7; --ink2:#9AA7C7; --line:#2E3A5F; --focus:#8EA4FF;
  --emath:#6D8DFF; --amath:#A57BEF; --phy:#F28A47; --chem:#2CC4B1; --eng:#F2647C; --chi:#E2B72E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;line-height:1.5;font-size:16px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:.85rem}
.navrow{display:flex;align-items:stretch;gap:6px}
nav{display:flex;gap:2px;overflow-x:auto;position:relative;flex:1;min-width:0;scrollbar-width:thin;scrollbar-color:var(--ink2) transparent;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{height:6px}
nav::-webkit-scrollbar-thumb{background:var(--ink2)}
nav::-webkit-scrollbar-track{background:transparent}
.navarrow{flex:none;width:34px;background:var(--card);border:2px solid var(--ink);font-weight:800;font-size:1.3rem;line-height:1;margin-bottom:8px;padding:0}
.navarrow:disabled{opacity:.3;cursor:default}
nav button{flex:none;background:none;border:0;border-bottom:4px solid transparent;padding:8px 12px 6px;font-weight:700;color:var(--ink2);white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
.lede{max-width:56ch;color:var(--ink2);margin:10px 0 0}
.hero{padding:28px 0 18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border:2px solid var(--ink);display:inline-block}
.card{background:var(--card);border:2px solid var(--ink);padding:16px;box-shadow:4px 4px 0 var(--ink)}
.stack{display:grid;gap:18px}
.subjrow{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--c)}
.subjrow:hover{transform:translate(-1px,-1px)}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rowhead strong{font-family:var(--display);font-size:1.25rem}
.rowhead .pct{font-weight:700;color:var(--c)}
.rowhead small{color:var(--ink2)}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:22px;height:22px;border:2px solid var(--c);background:transparent;display:inline-block}
.cell.s1{background:color-mix(in srgb,var(--c) 30%,var(--card))}
.cell.s2{background:color-mix(in srgb,var(--c) 65%,var(--card))}
.cell.s3{background:var(--c)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.muted{color:var(--ink2)}
.btn{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:8px 14px;font-weight:700}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}
.chip{background:var(--card);border:2px solid var(--ink);padding:6px 12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.topic{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;margin-bottom:10px}
.topic .name{font-weight:700}
.topic .tools{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{background:var(--card);border:0;border-right:2px solid var(--ink);padding:6px 10px;font-size:.85rem;font-weight:700}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
@media (max-width:700px){.topic{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1;padding:8px 2px}}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input,select,textarea{background:var(--paper);border:2px solid var(--ink);padding:8px 10px;width:100%;border-radius:0}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.list{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.list li{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chartbox{overflow-x:auto;background:var(--card);border:2px solid var(--ink);padding:10px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:18px;border:2px solid var(--ink);background:var(--paper)}
.bar .fill{height:100%;background:var(--c)}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5rem);letter-spacing:-.02em;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.timer{box-shadow:4px 4px 0 var(--c)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-top:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
#mini{font-variant-numeric:tabular-nums}
a.btn{text-decoration:none;display:inline-block}
.vframe{border:2px solid var(--ink);background:#000;margin:0 auto;max-width:100%;box-shadow:4px 4px 0 var(--ink)}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vframe.tt{width:340px;height:min(740px,80vh)}
.vframe.yt{width:100%;aspect-ratio:16/9}
.bframe{width:100%;height:70vh;border:2px solid var(--ink);background:#fff;display:block;margin-top:12px}
a.lnk{color:var(--ink);font-weight:700}
.vres{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.vcard{background:var(--card);border:2px solid var(--ink);padding:10px;display:grid;gap:6px;align-content:start}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--ink);background:#000}
.vcard b{font-size:.95rem;line-height:1.25}
.setup ol{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.setup li{margin:3px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;font-weight:700;display:none;z-index:20;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(10,14,30,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .card{max-width:560px;width:100%}
.note{font-size:.9rem;color:var(--ink2);margin-top:26px;max-width:70ch}
.warn{background:var(--card);border:2px solid #B3261E;padding:8px 12px;margin-top:12px;font-size:.9rem}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.vocab-item{background:var(--paper);border:2px solid var(--ink);padding:10px 12px}
.quiz-card{background:var(--card);border:2px solid var(--ink);border-left:10px solid var(--c);padding:16px;margin-bottom:16px}
.quiz-options{display:grid;gap:8px;margin-top:10px}
.quiz-opt{background:var(--paper);border:2px solid var(--ink);padding:8px 12px;text-align:left;font-weight:700}
.quiz-opt:hover{background:color-mix(in srgb,var(--c) 15%,var(--paper))}
.quiz-opt.correct{background:#2E7D32;color:#fff;border-color:#2E7D32}
.quiz-opt.wrong{background:#B3261E;color:#fff;border-color:#B3261E}
input[type=range]{padding:0;border:0;background:none}
@keyframes blink{50%{opacity:0}}
.ccur{display:inline-block;height:1em;border-left:2px solid var(--ink);vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
#calc{position:fixed;width:264px;z-index:25;background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
#calc[hidden]{display:none}
#calch{cursor:move;touch-action:none;user-select:none;background:var(--ink);color:var(--paper);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
#calch button{background:none;border:0;color:inherit;font-weight:700;padding:2px 6px}
#cdisp{padding:8px 10px;text-align:right;min-height:64px;overflow:hidden}
#cexp{color:var(--ink2);font-size:.85rem;word-break:break-all;min-height:1.2em}
#cres{font-family:var(--display);font-size:1.7rem;font-weight:800}
#ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px 8px}
#ckeys button{background:var(--paper);border:2px solid var(--ink);padding:8px 0;font-weight:700;font-size:.8rem}
#calcbtn{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>

  <div class="brand"><b>Sec 3 Study Map</b><span id="mini">G3 · Singapore</span></div>

var STATUS=['Not yet','Learning','Revising','Confident'];
var KEY='sec3-g3-tracker-v3',GK='sec3-gemini-key';
var storageOk=true;
function blank(){return{v:3,status:{},custom:[],scores:[],sessions:[],topicQuizAnswers:{},videos:[],timer:null}}
function migrate(b){if(b.v!==3){b.v=3}return b}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);var b=blank();for(var k in b){if(s&&s[k]!==undefined)b[k]=s[k]}b.v=s?s.v:undefined;return migrate(b)}}catch(e){storageOk=false}
  return blank();
}
var state=load();
function save(){cloudSoon();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}}
try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storageOk=false}

var ui={tab:'map',subj:'emath',filter:'all',scoreSubj:'all',activeTopicId:null,confirmReset:false,exportText:''};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function subj(id){return SUBJECTS.filter(function(s){return s.id===id})[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return n<10?'0'+n:''+n}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dstr(new Date())}
function topicsFor(sid){
  var s=subj(sid);
  if(!s) return [];
  var base=s.topics.map(function(n,i){return{id:sid+'-'+i,name:n,custom:false}});
  var extra=state.custom.filter(function(t){return t.subject===sid}).map(function(t){return{id:t.id,name:t.name,custom:true}});
  return base.concat(extra);
}
function allTopicsList(){
  var list=[];
  SUBJECTS.forEach(function(s){list=list.concat(topicsFor(s.id))});
  return list;
}
function findTopic(id){
  if(!id) return {id:'emath-0',name:'Topic',custom:false};
  var ts=allTopicsList();
  for(var i=0;i<ts.length;i++){if(ts[i].id===id)return ts[i];}
  return {id:id,name:'Topic Study Hub',custom:false};
}


var GUIDES={
"emath-0":{s:[
["Move everything to one side so it equals 0","Write it as ax²+bx+c=0. Example: x²+2x=15 becomes x²+2x−15=0. If you skip this, factorising and the formula both go wrong."],
["Try factorising first","Find two numbers that multiply to give c (when a=1) and add to give b. For x²+2x−15, 5 and −3 multiply to −15 and add to 2, so (x+5)(x−3)=0. When a is not 1, find two numbers that multiply to a×c and add to b, then split the middle term."],
["Set each bracket equal to 0","If A×B=0 then A=0 or B=0. So x+5=0 or x−3=0, giving x=−5 or x=3."],
["If it will not factorise, use the formula","x=(−b±√(b²−4ac))÷2a. For 2x²−3x−4=0: a=2, b=−3, c=−4. b²−4ac=9+32=41, so x=(3±√41)÷4 = 2.35 or −0.85 (2 d.p.). Put brackets round negative b and c in your calculator."],
["Completing the square (when the question tells you to)","Halve the x coefficient and square it. x²+6x+1=0 → (x+3)²−9+1=0 → (x+3)²=8 → x=−3±√8 = −0.17 or −5.83. The same form (x+3)²−8 tells you the minimum point is (−3, −8)."],
["Check and round only at the end","Substitute your answers back in. Keep full calculator values until the last line, then give 2 d.p. unless the question says otherwise."]],
t:[["Solve by factorisation","Show the factor pair and both brackets for full method marks."],["Solve using the formula, answer to 2 d.p.","Write the formula, substitute, then answer. Wrong sign on b is the usual slip."],["Express in (x+p)²+q form, then state the minimum value","Minimum value is q, reached when x=−p."],["Word problem (area, consecutive numbers, age)","Define x, form the equation, solve, then reject answers that do not make sense such as a negative length."],["Fractional equation that reduces to a quadratic","Multiply through by the denominators first, then follow the steps above. Check no answer makes a denominator 0."]]},
"emath-3":{s:[
["Treat it like an equation","Do the same operation to both sides. 3x−5>10 → 3x>15 → x>5."],
["Flip the sign when you multiply or divide by a negative","−2x>6 → x<−3. The inequality direction reverses because multiplying by a negative swaps the order of numbers."],
["Two inequalities at once","Solve each part separately, then find where they overlap. x>2 and x≤7 gives 2<x≤7."],
["Show it on a number line","Open circle for < and >, solid (filled) circle for ≤ and ≥. Shade towards the solution."],
["Integer solutions","List only whole numbers inside the range. For 2<x≤7 the integers are 3, 4, 5, 6, 7."]],
t:[["Solve and represent on a number line","Check the circle type matches the sign."],["List the integers that satisfy both inequalities","Be careful whether the end values are included."],["Word problem with 'at least' or 'at most'","at least means ≥, at most means ≤, more than means >."],["Find the largest or smallest integer value of x","Solve, then pick the end integer that still satisfies the sign."]]},
"emath-4":{s:[
["Learn the six laws","aᵐ×aⁿ=aᵐ⁺ⁿ, aᵐ÷aⁿ=aᵐ⁻ⁿ, (aᵐ)ⁿ=aᵐⁿ, a⁰=1, a⁻ⁿ=1/aⁿ, a^(m/n)=(ⁿ√a)ᵐ."],
["Make the bases the same","Write numbers as powers of a prime. 8=2³ and 32=2⁵, so 8^x=2^(3x)."],
["Handle negative and fractional powers in the right order","27^(2/3): take the cube root first (3), then square it (9). Doing the root first keeps numbers small."],
["Solve equations by equating powers","2^(x+1)=32 → 2^(x+1)=2⁵ → x+1=5 → x=4. This only works once both sides have the same base."],
["Simplify with several letters","(2a³b)²÷a⁴ = 4a⁶b²÷a⁴ = 4a²b². Apply the power to every factor inside the bracket, including the number."]],
t:[["Evaluate without a calculator","Often fractional or negative powers like 16^(−3/4)=1/8."],["Simplify an expression with positive indices only","Move negative powers to the other side of the fraction."],["Solve an exponential equation","Same base then equate powers. If bases differ, you may need logs (A Math)."],["Find unknowns in aˣ×aʸ=...","Form an equation from the powers."]]},
"amath-0":{s:[
["Simplify a single surd","Pull out the largest square factor. √72=√(36×2)=6√2."],
["Add and subtract like surds only","3√2+5√2=8√2, but 3√2+5√3 cannot be combined."],
["Multiply out brackets","(2+√3)(4−√3)=8−2√3+4√3−3=5+2√3. Remember √3×√3=3."],
["Rationalise the denominator","Multiply top and bottom by the conjugate. 1/(3+√2) × (3−√2)/(3−√2) = (3−√2)/(9−2) = (3−√2)/7."],
["Equate rational and surd parts","If a+b√2=5+3√2 with a, b rational, then a=5 and b=3. Use this to solve for unknowns."]],
t:[["Simplify or express in the form a+b√c","Rationalise and collect terms."],["Show that an expression equals a given value","Work only on the left side until it matches."],["Find a and b given an equation with surds","Equate rational parts and surd parts separately."],["Area or length problems with surds","Leave answers in exact surd form unless told to round."]]},
"phy-1":{s:[
["Choose a positive direction and keep units consistent","Use m, s, m/s, m/s². Convert km/h to m/s by dividing by 3.6."],
["Read distance-time graphs","Gradient = speed. Flat line = stationary. Steeper line = faster."],
["Read speed-time graphs","Gradient = acceleration. Area under the graph = distance travelled. Flat line = constant speed."],
["Use a=(v−u)÷t","Speed rising from 0 to 20 m/s in 5 s gives a=4 m/s². Negative a means slowing down."],
["Break areas into shapes","Triangle=½×base×height, rectangle=base×height. Example: 5 s to reach 20 m/s then 10 s steady: ½×5×20 + 20×10 = 50+200 = 250 m."],
["Free fall","Without air resistance a falling object accelerates at g=10 m/s² (Singapore syllabus). With air resistance, acceleration drops until terminal velocity."]],
t:[["Describe motion from a graph in words","State each part: speeding up uniformly, constant speed, slowing down, stationary."],["Calculate acceleration or distance from a speed-time graph","Show gradient or area working with units."],["Distance vs displacement and speed vs velocity","Distance and speed have no direction."],["Free fall and terminal velocity","Explain forces: weight vs air resistance."]]},
"chem-6":{s:[
["Write a balanced equation","Coefficients give the mole ratio. CaCO₃ → CaO + CO₂ is 1:1:1."],
["Convert what you are given into moles","moles=mass÷Mr, moles=volume of gas (dm³)÷24 at room temperature and pressure, moles=concentration (mol/dm³)×volume (dm³). Convert cm³ to dm³ by dividing by 1000."],
["Use the mole ratio","10 g CaCO₃ (Mr=100) is 0.1 mol. The ratio is 1:1, so 0.1 mol CO₂ forms."],
["Convert moles to the quantity asked","Volume of CO₂=0.1×24=2.4 dm³. Mass=moles×Mr."],
["Limiting reagent","Work out moles of each reactant, divide by its coefficient, and the smallest result is limiting. The limiting reagent decides how much product forms."],
["Percentage yield and empirical formula","% yield=(actual÷theoretical)×100. Empirical formula: divide each element's moles by the smallest, then round to a whole-number ratio."]],
t:[["Mass to mass calculation","Follow the chain: mass → moles → ratio → moles → mass."],["Gas volume calculation","Use 24 dm³ per mole."],["Titration and concentration","Use moles=c×V and the equation ratio."],["Limiting reagent or percentage yield","State which reagent is limiting."],["Empirical or molecular formula","Use percentages or masses as the starting data."]]}

var CONCEPTS={
emath:["An equation where the highest power of x is 2, like x²+2x−15=0. It usually has two answers, found by factorising, the formula, or completing the square.","Equations with x in the denominator, like 2/x = x−1. You clear the fractions by multiplying through, or read the answers from where two graphs cross.","y=ax²+bx+c draws a U-shaped curve called a parabola. If a is positive it opens upward (has a minimum); if negative it opens downward (has a maximum). The roots are where it crosses the x-axis.","Like an equation but with <, >, ≤ or ≥, so the answer is a range of values (such as x>5) instead of one number.","Powers like 2⁵ mean 2×2×2×2×2. Index laws let you multiply, divide and simplify powers, including zero, negative and fractional powers.","Interest earned on your money and on the interest already added. A=P(1+r/100)ⁿ after n years, so it grows faster than simple interest.","A way to write very large or very small numbers as A×10ⁿ where 1≤A<10, e.g. 3 500 000 = 3.5×10⁶.","Using x and y coordinates to find how steep a line is (gradient=(y₂−y₁)÷(x₂−x₁)), how long it is, and its equation y=mx+c.","A function gives exactly one output for every input, written f(x). You plot its graph and read off values such as intercepts and turning points.","Congruent shapes are identical in size and shape. Similar shapes have the same shape but different size, with matching sides in the same ratio.","Extends sin and cos to angles between 90° and 180° (sin θ = sin(180°−θ)), so you can find the area of any triangle using ½ab sin C.","Formulas for finding sides and angles in any triangle, not only right-angled ones. Use the sine rule with a matching side-angle pair, and the cosine rule when you know two sides and the angle between them.","Using sin, cos and tan on real situations: bearings (angles measured clockwise from north), angles of elevation and depression, and 3D shapes.","A sector is a slice of a circle. Arc length = θ/360 × 2πr and sector area = θ/360 × πr². Radians measure angles using arc length: 180° = π rad.","Rules about angles and lines in circles, e.g. the angle at the centre is twice the angle at the circumference, and a tangent meets the radius at 90°."],
amath:["Square roots that do not come out as whole numbers or fractions, like √2 or √3. They are exact values, so answers are kept as 3√2 rather than 4.243.","Functions of the form f(x)=ax²+bx+c. Their graph is a parabola; you find the turning point, where it crosses the axes, and how it meets a line.","Use the discriminant b²−4ac to tell how many real roots there are: above 0 gives two different roots, equal to 0 gives one repeated root, below 0 gives none.","Finding values that satisfy two equations at once. With one linear and one non-linear equation, substitute the linear one into the other to get a quadratic.","Inequalities like x²−5x+6<0. Find the roots, sketch the parabola, and read off which x-values put the curve above or below the axis.","Expressions with several powers of x, like x³−2x²+5. You divide them, and use the remainder and factor theorems to find factors and unknown constants.","Splitting one complicated fraction into simpler ones that add up to it, e.g. 5/((x−1)(x+2)) = A/(x−1) + B/(x+2).","A shortcut for expanding (a+b)ⁿ without multiplying brackets by hand. The coefficients come from Pascal's triangle.","In an exponential, the unknown is in the power (like 2ˣ). A logarithm is the reverse: log₂8=3 means 2³=8. Logs let you solve for unknown powers.","Like E Math but deeper: equations of lines and circles, parallel and perpendicular gradients, and areas of shapes from coordinates.","Turning a curved relationship into a straight line by changing variables, so you can find unknown constants from the gradient and y-intercept.","Sin, cos and tan for any angle, their graphs, and identities like sin²θ+cos²θ=1 that let you simplify expressions and solve trig equations.","Finding how fast something is changing, i.e. the gradient of a curve at any point. For y=xⁿ, dy/dx = nxⁿ⁻¹."],
phy:["Measuring quantities with the right units and instruments (ruler, vernier calipers, micrometer), and understanding accuracy versus precision.","Describing motion: distance, speed, velocity and acceleration, and reading them from distance-time and speed-time graphs.","Why things move. A resultant force makes an object accelerate: F=ma. Includes Newton's laws, friction, and balanced versus unbalanced forces.","Mass is how much matter there is (kg). Weight is gravity pulling on it (W=mg, in N). Density = mass ÷ volume, how tightly packed the matter is.","A force can turn things around a pivot. Moment = force × perpendicular distance from the pivot. Something is balanced when clockwise moments equal anticlockwise moments.","Force spread over an area: p=F/A. Smaller area means higher pressure. Pressure in a liquid increases with depth (p=ρgh).","Energy is the ability to do work (measured in joules). Work = force × distance moved, power = work ÷ time, and energy is never lost, only changed from one form to another.","All matter is made of tiny moving particles. Solids, liquids and gases differ in how the particles are arranged and move, which explains gas pressure and temperature.","Heat travels by conduction (through solids), convection (in liquids and gases) and radiation (as waves, with no medium needed).","Waves carry energy without carrying matter along. They are described by wavelength, frequency, amplitude and speed (v=fλ).","Light travels in straight lines. It reflects off surfaces and bends (refracts) when it enters a different material, which is how lenses work.","Sound is a wave of vibrating particles. Pitch depends on frequency and loudness on amplitude. It needs a medium to travel through.","The flow of electric charge. Current (A), voltage (V) and resistance (Ω) are linked by V=IR. Components can be joined in series or in parallel.","Magnets attract iron. A wire carrying current also makes a magnetic field, which is how electromagnets and motors work."],
chem:["Safe lab skills: apparatus, separating mixtures (filtration, distillation, chromatography), and testing purity.","All matter is made of tiny moving particles. Their arrangement and energy explain solids, liquids, gases, diffusion and changes of state.","Atoms have protons and neutrons in the nucleus and electrons around it. The proton number decides which element it is.","How atoms join: ionic (electrons transferred, usually metal and non-metal), covalent (electrons shared), and metallic.","How bonding and structure explain melting point, conductivity and hardness of ionic, simple molecular, giant covalent and metallic substances.","A formula shows what a substance is made of (H₂O). An equation shows a reaction and must be balanced so the number of each atom is the same on both sides.","The mole is a counting unit for tiny particles (6.02×10²³), like a dozen but much bigger. It lets you convert between mass, gas volume and number of particles in an equation.","Acids release H⁺ ions and alkalis release OH⁻ ions. pH measures how acidic or alkaline something is. An acid and a base react to give a salt and water.","Ionic compounds formed when an acid reacts with a base, metal or carbonate. Includes solubility rules and how to prepare a salt.","Identifying unknown ions and gases using chemical tests, e.g. the colour of the precipitate formed with sodium hydroxide.","Elements are arranged by proton number. Groups (columns) have similar properties and periods (rows) show trends.","Properties of metals, the reactivity series, extraction and rusting. A more reactive metal displaces a less reactive one.","What air is made of (about 78% nitrogen, 21% oxygen), air pollutants, and the greenhouse effect.","Energy changes in reactions (exothermic gives out heat, endothermic takes it in) and how fast reactions go (temperature, concentration, surface area, catalyst).","The chemistry of carbon compounds: alkanes, alkenes, alcohols and acids, their reactions, and polymers."]

function unwrapArr(a){

function normQs(a){

    if(!x||typeof x!=='object')return null;

        ans=x.ans!==undefined?x.ans:(x.answer!==undefined?x.answer:(x.correct!==undefined?x.correct:x.correctIndex));
    if(opts&&!Array.isArray(opts)&&typeof opts==='object')opts=Object.keys(opts).sort().map(function(k){return opts[k]});
    if(typeof q!=='string'||!Array.isArray(opts)||opts.length!==4)return null;
    opts=opts.map(function(o){return String(o).replace(/^\s*\(?[A-Da-d][\).:]\s+/,'').trim()});

    if(typeof ans==='number')n=ans;

  }).filter(Boolean);

function ytErr(status,msg){
  if(/quota/i.test(msg))return'Today\'s free YouTube searches are used up. They reset each day, or you can paste a video link below instead.';
  if(/not been used|disabled|accessNotConfigured/i.test(msg))return'YouTube Data API v3 is not turned on for this key. In Google Cloud, open APIs and Services, then Library, enable YouTube Data API v3, and try again.';
  if(/API key not valid|keyInvalid/i.test(msg))return'Google does not accept this key. Check that you copied all of it.';

  return'YouTube said: '+(msg||('error '+status));
}
function ytSearch(q){

  function done(fn){if(ui.wstamp!==stamp)return;ui.wbusy=false;fn();if(ui.tab==='watch')render()}
  function call(u,h){return fetch(u,{headers:h}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{r:r,j:j}})})}
  call(base,{'x-goog-api-key':key}).catch(function(){return call(base+'&key='+encodeURIComponent(key),{})})

function parseVideo(raw){
  var u=String(raw||'').trim();
  if(!u)return{error:'Paste a TikTok or YouTube link first.'};
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  var url;try{url=new URL(u)}catch(e){return{error:'That does not look like a web link.'}}
  var h=url.hostname.toLowerCase().replace(/^(www|m)\./,'');
  if(h==='tiktok.com'||h==='vm.tiktok.com'||h==='vt.tiktok.com'){
    var m=url.pathname.match(/\/video\/(\d{8,25})/);
    if(m)return{provider:'tiktok',vid:m[1],url:url.href};
    return{error:'Short TikTok links cannot be read here. Open the video in TikTok, tap Share, then Copy link, and use the full link that looks like tiktok.com/@name/video/1234567890.'};
  }
  var id=null;
  if(h==='youtu.be')id=url.pathname.slice(1).split('/')[0];
  else if(h==='youtube.com'||h==='music.youtube.com'){
    id=url.searchParams.get('v');
    var sm=url.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);
    if(!id&&sm)id=sm[1];
  }
  if(id&&/^[\w-]{11}$/.test(id))return{provider:'youtube',vid:id,url:url.href};
  return{error:'Only TikTok and YouTube video links work here. Use the browser box below for other websites.'};
}
function normUrl(raw){
  var u=String(raw||'').trim();
  if(!u||/\s/.test(u))return null;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;
  try{var url=new URL(u);
    if(url.protocol==='http:')url.protocol='https:';
    if(url.protocol!=='https:'||url.hostname.indexOf('.')<0)return null;
    return url.href}catch(e){return null}
}

function render(){
  document.getElementById('app').innerHTML=views[ui.tab]();
  updateMini();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){
    if(b.dataset.t===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  navSync(true);
}
function navSync(center){
  var n=document.getElementById('nav');if(!n)return;
  if(center){var a=n.querySelector('[aria-current]');if(a&&n.scrollTo){n.scrollTo({left:Math.max(0,a.offsetLeft-(n.clientWidth-a.offsetWidth)/2),behavior:'smooth'})}}
  var L=document.getElementById('navL'),R=document.getElementById('navR');
  if(L)L.disabled=n.scrollLeft<=2;
  if(R)R.disabled=n.scrollLeft+n.clientWidth>=n.scrollWidth-2;
}

function mountCanvas(){
  var c=document.getElementById('nc');if(!c)return;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);cv.undo=[];
  if(ui.nd&&ui.nd.img){var im=new Image();im.onload=function(){x.drawImage(im,0,0,c.width,c.height)};im.src=ui.nd.img}
  function pos(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
  c.onpointerdown=function(e){e.preventDefault();c.setPointerCapture(e.pointerId);cv.undo.push(x.getImageData(0,0,c.width,c.height));if(cv.undo.length>25)cv.undo.shift();cv.draw=true;var p=pos(e);x.lineCap='round';x.lineJoin='round';x.strokeStyle=cv.er?'#fff':cv.col;x.lineWidth=cv.er?cv.w*4:cv.w;x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+0.01,p[1]);x.stroke()};
  c.onpointermove=function(e){if(!cv.draw)return;var p=pos(e);x.lineTo(p[0],p[1]);x.stroke()};
  c.onpointerup=c.onpointercancel=function(){cv.draw=false};
}
var _render=render;
render=function(){var c=document.getElementById('nc');if(c&&ui.nd&&ui.nid)ui.nd.img=c.toDataURL('image/jpeg',0.8);_render();if(ui.tab==='notes'&&ui.nid)mountCanvas()};
render();
tick();
setInterval(tick,1000);
(function(){
  var n=document.getElementById('nav'),L=document.getElementById('navL'),R=document.getElementById('navR');
  if(!n)return;
  function by(x){n.scrollBy?n.scrollBy({left:x,behavior:'smooth'}):(n.scrollLeft+=x)}
  if(L)L.addEventListener('click',function(){by(-Math.max(160,n.clientWidth*0.7))});
  if(R)R.addEventListener('click',function(){by(Math.max(160,n.clientWidth*0.7))});
  n.addEventListener('scroll',function(){navSync(false)});
  n.addEventListener('wheel',function(e){if(n.scrollWidth>n.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){n.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  window.addEventListener('resize',function(){navSync(false)});
  navSync(true);
})();
})();
</script>
</body>
